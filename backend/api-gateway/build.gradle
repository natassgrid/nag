plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.lombok)
}

version = '0.0.1-SNAPSHOT'

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.spring.cloud.get()}"
    }
}

dependencies {
    // Spring Cloud Gateway (reactive)
    implementation libs.spring.cloud.starter.gateway

    // Reactive web (required by Spring Cloud Gateway — do NOT include spring-boot-starter-web)
    implementation libs.spring.boot.starter.webflux

    // Security — OAuth2 Resource Server (JWT) for reactive stack
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.oauth2.resource.server

    // Redis for rate limiting
    implementation libs.spring.boot.starter.data.redis.reactive

    // Kafka (security alerts)
    implementation libs.spring.kafka

    // Actuator + Prometheus
    implementation libs.spring.boot.starter.actuator
    implementation libs.micrometer.registry.prometheus

    // Test
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.security.test
    testImplementation libs.reactor.test
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

springBoot {
    mainClass = 'com.examplatform.gateway.ApiGatewayApplication'
}

test {
    useJUnitPlatform()
}
