spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 17
                redis-rate-limiter.burstCapacity: 1000
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@clientKeyResolver}"
          routes:
            # Identity Service
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/identity/**
              filters:
                - StripPrefix=0

            # Candidate Service
            - id: candidate-service
              uri: ${CANDIDATE_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/candidates/**
              filters:
                - StripPrefix=0

            # Question Bank Service
            - id: question-bank-service
              uri: ${QUESTION_BANK_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/questions/**
              filters:
                - StripPrefix=0

            # Subjects Service (part of Question Bank)
            - id: subjects-service
              uri: ${QUESTION_BANK_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/subjects/**
              filters:
                - StripPrefix=0

            # Examination Service
            - id: examination-service
              uri: ${EXAMINATION_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/examinations/**
              filters:
                - StripPrefix=0

            # Geo Location (served by Examination Service — public, no auth)
            - id: geo-location-service
              uri: ${EXAMINATION_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/geo/**
              filters:
                - StripPrefix=0

            # Paper Generator
            - id: paper-generator
              uri: ${PAPER_GENERATOR_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/papers/**
              filters:
                - StripPrefix=0

            # Delivery Service
            - id: delivery-service
              uri: ${DELIVERY_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/sessions/**,/api/v1/delivery/**
              filters:
                - StripPrefix=0

            # Response Service
            - id: response-service
              uri: ${RESPONSE_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/responses/**
              filters:
                - StripPrefix=0

            # Evaluation Service
            - id: evaluation-service
              uri: ${EVALUATION_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/api/v1/evaluations/**
              filters:
                - StripPrefix=0

            # Result Service
            - id: result-service
              uri: ${RESULT_SERVICE_URI:http://localhost:8089}
              predicates:
                - Path=/api/v1/results/**
              filters:
                - StripPrefix=0

            # Audit Service
            - id: audit-service
              uri: ${AUDIT_SERVICE_URI:http://localhost:8090}
              predicates:
                - Path=/api/v1/audit/**
              filters:
                - StripPrefix=0

            # Notification Service
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8091}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - StripPrefix=0

            # Admin Service
            - id: admin-service
              uri: ${ADMIN_SERVICE_URI:http://localhost:8093}
              predicates:
                - Path=/api/v1/admin/**
              filters:
                - StripPrefix=0

            # Analytics Service
            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URI:http://localhost:8094}
              predicates:
                - Path=/api/v1/analytics/**
              filters:
                - StripPrefix=0

            # Asset Service
            - id: asset-service
              uri: ${ASSET_SERVICE_URI:http://localhost:8095}
              predicates:
                - Path=/api/v1/assets/**
              filters:
                - StripPrefix=0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}/protocol/openid-connect/certs

server:
  port: ${GATEWAY_PORT:9000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
  metrics:
    tags:
      service: api-gateway
    distribution:
      percentiles-histogram:
        http.server.requests: true

otel:
  service:
    name: api-gateway
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      protocol: grpc

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","service":"api-gateway","traceId":"%X{traceId}","spanId":"%X{spanId}","message":"%m"}%n'
