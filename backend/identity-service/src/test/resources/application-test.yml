spring:
  application:
    name: identity-service-test

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    schemas: identity_service
    default-schema: identity_service
    locations: classpath:db/migration/identity
    table: flyway_schema_history_identity

  cloud:
    vault:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:19999/realms/test
          jwk-set-uri: http://localhost:19999/realms/test/protocol/openid-connect/certs

  session:
    store-type: redis
    redis:
      flush-mode: on-save
      namespace: identity:test:session

platform:
  messaging:
    broker: in-memory

logging:
  level:
    org.testcontainers: INFO
    org.flywaydb: INFO
    org.springframework.test: INFO
