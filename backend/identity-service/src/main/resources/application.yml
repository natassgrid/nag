spring:
  application:
    name: identity-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exam_platform}
    username: ${SPRING_DATASOURCE_USERNAME:exam_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:exam_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      schema: identity_service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    schemas: identity_service
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}
      timeout: 2000ms

  session:
    store-type: redis
    redis:
      flush-mode: on-save
      namespace: identity:session

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}/protocol/openid-connect/certs

  cloud:
    vault:
      uri: ${VAULT_ADDR:http://localhost:8200}
      token: ${VAULT_ROOT_TOKEN:vault_root_token}
      scheme: http
      kv:
        enabled: true
        backend: secret
      transit:
        enabled: true
        backend: transit
        default-context: identity-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: identity-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.examplatform.*"

  threads:
    virtual:
      enabled: true

server:
  port: ${IDENTITY_SERVICE_PORT:8081}
  servlet:
    context-path: /
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
  metrics:
    tags:
      service: identity-service

otel:
  service:
    name: identity-service
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      protocol: grpc

app:
  security:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lockout-window-seconds: ${AUTH_LOCKOUT_WINDOW_SECONDS:600}
    rate-limit-auth-per-ip-per-minute: ${RATE_LIMIT_AUTH_PER_IP_PER_MINUTE:10}
    jwt-access-token-lifetime-seconds: ${JWT_ACCESS_TOKEN_LIFETIME_SECONDS:900}
    jwt-refresh-token-lifetime-seconds: ${JWT_REFRESH_TOKEN_LIFETIME_SECONDS:28800}
    session-idle-timeout-seconds: ${SESSION_IDLE_TIMEOUT_SECONDS:1800}
  keycloak:
    realm: ${KEYCLOAK_REALM:exam-realm}
    client-id: ${KEYCLOAK_CLIENT_ID:exam-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    admin-username: ${KEYCLOAK_ADMIN_USER:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin_secret}
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","service":"identity-service","traceId":"%X{traceId}","spanId":"%X{spanId}","message":"%m"}%n'
