spring:
  autoconfigure:
    exclude:
      - io.github.resilience4j.springboot.bulkhead.autoconfigure.BulkheadRefreshScopedRegistryAutoConfiguration
      - io.github.resilience4j.springboot.circuitbreaker.autoconfigure.CircuitBreakerRefreshScopedRegistryAutoConfiguration
      - io.github.resilience4j.springboot.ratelimiter.autoconfigure.RateLimiterRefreshScopedRegistryAutoConfiguration
      - io.github.resilience4j.springboot.retry.autoconfigure.RetryRefreshScopedRegistryAutoConfiguration
      - io.github.resilience4j.springboot.timelimiter.autoconfigure.TimeLimiterRefreshScopedRegistryAutoConfiguration
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/examplatform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: identity_service
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    schemas: identity_service
    default-schema: identity_service
    locations: classpath:db/migration/identity
    table: flyway_schema_history_identity
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  mail:
    host: ${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    from: ${MAIL_FROM:${SMTP_FROM:noreply@natassgrid.gov.in}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      token: ${VAULT_ROOT_TOKEN:vault_root_token}
      scheme: http
      kv:
        enabled: true
        backend: secret
      transit:
        enabled: true
        backend: transit
        default-context: identity-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: identity-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.examplatform.*"

  threads:
    virtual:
      enabled: true

server:
  port: ${IDENTITY_SERVICE_PORT:8081}
  servlet:
    context-path: /
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
    kafka:
      enabled: true
    vault:
      enabled: true
  metrics:
    tags:
      service: identity-service

otel:
  service:
    name: identity-service
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      protocol: grpc

app:
  frontend:
    admin-url: ${ADMIN_PORTAL_URL:http://localhost:4200}
    candidate-url: ${CANDIDATE_PORTAL_URL:http://localhost:5173}
  sms:
    enabled: ${SMS_ENABLED:false}
    mobile-verification-required: ${MOBILE_VERIFICATION_REQUIRED:false}
    weekly-limit: ${SMS_WEEKLY_LIMIT:3}
    rolling-window-days: 7
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_TEMPLATE_ID:}
      sender-id: ${MSG91_SENDER_ID:NAGGov}
      api-url: ${MSG91_API_URL:https://control.msg91.com/api/v5/otp}
  security:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lockout-window-seconds: ${AUTH_LOCKOUT_WINDOW_SECONDS:600}
    rate-limit-auth-per-ip-per-minute: ${RATE_LIMIT_AUTH_PER_IP_PER_MINUTE:10}
    jwt-access-token-lifetime-seconds: ${JWT_ACCESS_TOKEN_LIFETIME_SECONDS:900}
    jwt-refresh-token-lifetime-seconds: ${JWT_REFRESH_TOKEN_LIFETIME_SECONDS:28800}
    session-idle-timeout-seconds: ${SESSION_IDLE_TIMEOUT_SECONDS:1800}
  keycloak:
    realm: ${KEYCLOAK_REALM:exam-realm}
