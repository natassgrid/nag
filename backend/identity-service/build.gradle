plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.lombok)
}

version = '0.0.1-SNAPSHOT'

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${libs.versions.spring.ai.get()}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.spring.cloud.get()}"
    }
}

dependencies {
    implementation project(':backend:shared-lib')

    // Web
    implementation libs.spring.boot.starter.web

    // Security — OAuth2 Resource Server (JWT)
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.oauth2.resource.server

    // Data JPA + PostgreSQL
    implementation libs.spring.boot.starter.data.jpa
    runtimeOnly libs.postgresql

    // Flyway database migrations
    // Spring Boot 4.x requires the starter + database-specific module
    implementation libs.spring.boot.starter.flyway
    runtimeOnly libs.flyway.database.postgresql

    // Redis (session state)
    implementation libs.spring.boot.starter.data.redis
    implementation libs.spring.session.data.redis

    // Vault (crypto service)
    implementation libs.spring.cloud.starter.vault.config
    implementation libs.spring.vault.core

    // Kafka (audit events)
    implementation libs.spring.kafka

    // Actuator + Prometheus
    implementation libs.spring.boot.starter.actuator
    implementation libs.micrometer.registry.prometheus

    // Validation
    implementation libs.spring.boot.starter.validation

    // WebAuthn / FIDO2
    // TODO: For production, add com.webauthn4j:webauthn4j-core for full COSE key parsing
    // and cryptographic signature verification. The current scaffold uses simplified verification.
    // implementation 'com.webauthn4j:webauthn4j-core:0.24.1.RELEASE'

    // Test
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.spring.security.test
    testImplementation libs.spring.kafka.test
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.kafka
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.jupiter.params
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
    testImplementation libs.jqwik
}

springBoot {
    mainClass = 'com.examplatform.identity.IdentityServiceApplication'
}

test {
    useJUnitPlatform()
}
