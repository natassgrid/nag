spring:
  application:
    name: notification-service-test

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    schemas: notification_service
    locations: classpath:db/migration/notification

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:19999/realms/test
          jwk-set-uri: http://localhost:19999/realms/test/protocol/openid-connect/certs

  kafka:
    listener:
      auto-startup: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

notification:
  sms:
    endpoint: http://localhost:19998/msg91/api/v5/otp
    auth-key: test-sms-key
    sender-id: NAGGov
  whatsapp:
    endpoint: http://localhost:19998/whatsapp/v1/messages
    access-token: test-wa-token
  push:
    endpoint: http://localhost:19998/fcm/send
    server-key: test-fcm-key

platform:
  messaging:
    broker: in-memory

logging:
  level:
    org.testcontainers: INFO
    org.flywaydb: INFO
    org.springframework.test: INFO
