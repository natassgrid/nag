plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.lombok)
}

version = '0.0.1-SNAPSHOT'

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.spring.cloud.get()}"
        mavenBom "org.springframework.ai:spring-ai-bom:${libs.versions.spring.ai.get()}"
    }
}

dependencies {
    implementation project(':backend:shared-lib')

    // Web
    implementation libs.spring.boot.starter.web

    // Security — OAuth2 Resource Server (JWT)
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.oauth2.resource.server

    // Data JPA + PostgreSQL
    implementation libs.spring.boot.starter.data.jpa
    runtimeOnly libs.postgresql

    // Flyway database migrations
    // Spring Boot 4.x requires the starter + database-specific module
    implementation libs.spring.boot.starter.flyway
    runtimeOnly libs.flyway.database.postgresql

    // Apache HttpClient 5 (required by OpenSearch client and Spring Cloud Vault)
    implementation libs.httpclient5
    implementation libs.httpcore5.h2

    // OpenSearch Java client
    implementation libs.opensearch.java
    implementation libs.opensearch.rest.client

    // Vault (crypto service)
    implementation libs.spring.cloud.starter.vault.config
    implementation libs.spring.vault.core

    // Kafka (audit events)
    implementation libs.spring.kafka

    // Spring AI (LLM + Embeddings via LiteLLM OpenAI-compatible gateway)
    implementation libs.spring.ai.starter.model.openai

    // AWS SDK v2 (Bedrock Batch Inference + S3 for input/output)
    implementation platform(libs.aws.bom)
    implementation libs.aws.bedrock
    implementation libs.aws.bedrock.runtime
    implementation libs.aws.s3
    implementation libs.aws.sts

    // pgvector (halfvec similarity search)
    implementation libs.pgvector

    // Actuator + Prometheus
    implementation libs.spring.boot.starter.actuator
    implementation libs.micrometer.registry.prometheus

    // Validation
    implementation libs.spring.boot.starter.validation

    // Test
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.security.test
    testImplementation libs.spring.kafka.test
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.kafka
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.jupiter.params
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
    testImplementation libs.jqwik
}

springBoot {
    mainClass = 'com.examplatform.questionbank.QuestionBankServiceApplication'
}

test {
    useJUnitPlatform()
}
