spring:
  application:
    name: question-bank-service

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exam_platform}
    username: ${SPRING_DATASOURCE_USERNAME:exam_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:exam_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      schema: question_service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: question_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    schemas: question_service
    locations:
      - classpath:db/migration/question
      - classpath:db/migration/question/seeds
      - classpath:db/migration/question/seeds/rrb_ntpc
      - classpath:db/migration/question/seeds/sbi_po
      - classpath:db/migration/question/seeds/statement_and_conclusion

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}/protocol/openid-connect/certs

  cloud:
    vault:
      uri: ${VAULT_ADDR:http://localhost:8200}
      token: ${VAULT_ROOT_TOKEN:vault_root_token}
      scheme: http
      kv:
        enabled: true
        backend: secret
      transit:
        enabled: true
        backend: transit
        default-context: question-bank-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: question-bank-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.examplatform.*"

  ai:
    openai:
      base-url: ${LITELLM_BASE_URL:http://localhost:4000}
      api-key: ${LITELLM_API_KEY:sk-litellm-dev-key}
      connect-timeout: 30s
      read-timeout: 15m
      chat:
        options:
          model: qwen2.5-1.5b
          temperature: 0.7
      embedding:
        options:
          model: all-minilm

  threads:
    virtual:
      enabled: true

indictrans2:
  url: ${INDICTRANS2_URL:http://localhost:7860}

translation:
  batch:
    chunk-pause-interval-questions: ${TRANSLATION_BATCH_CHUNK_INTERVAL:15}
    chunk-pause-duration-seconds: ${TRANSLATION_BATCH_CHUNK_PAUSE_SECONDS:60}

app:
  ai:
    provider: ${AI_PROVIDER:bedrock}
    models:
      easy: ${AI_MODEL_EASY:nova-micro}
      medium: ${AI_MODEL_MEDIUM:nova-lite}
      hard: ${AI_MODEL_HARD:nova-lite}
      gemini:
        easy: ${AI_GEMINI_MODEL_EASY:gemini-flash-lite}
        medium: ${AI_GEMINI_MODEL_MEDIUM:gemini-flash}
        hard: ${AI_GEMINI_MODEL_HARD:gemini-pro}
      local:
        easy: ${AI_MODEL_LOCAL_EASY:llama3.2:1b}
        medium: ${AI_MODEL_LOCAL_MEDIUM:qwen2.5:1.5b}
        hard: ${AI_MODEL_LOCAL_HARD:qwen2.5:1.5b}
      extraction:
        vision: ${AI_MODEL_EXTRACTION_VISION:paper-extract-vision}
        text: ${AI_MODEL_EXTRACTION_TEXT:paper-extract-text}
    guardrails:
      enabled: ${AI_GUARDRAILS_ENABLED:true}
      strict-mode: ${AI_GUARDRAIL_STRICT_MODE:true}
      max-input-length: ${AI_MAX_PROMPT_INPUT_LENGTH:4000}
      max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    resilience:
      call-timeout-seconds: ${AI_CALL_TIMEOUT_SECONDS:45}
      failure-rate-threshold: ${AI_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
      wait-duration-seconds: ${AI_CIRCUIT_BREAKER_WAIT_DURATION_SECONDS:30}
      sliding-window-size: ${AI_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:10}
    agent:
      max-refinement-cycles: ${AI_AGENT_MAX_REFINEMENT_CYCLES:2}
  asset-service:
    url: ${ASSET_SERVICE_URL:http://localhost:8095}

resilience4j:
  circuitbreaker:
    instances:
      microLessonAiService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${AI_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:10}
        minimumNumberOfCalls: 5
        failureRateThreshold: ${AI_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
        waitDurationInOpenState: ${AI_CIRCUIT_BREAKER_WAIT_DURATION_SECONDS:30}s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      microLessonAiService:
        maxAttempts: 2
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  timelimiter:
    instances:
      microLessonAiService:
        timeoutDuration: ${AI_CALL_TIMEOUT_SECONDS:45}s
        cancelRunningFuture: true

server:
  port: ${QUESTION_BANK_SERVICE_PORT:8083}
  servlet:
    context-path: /
  shutdown: graceful

grpc:
  server:
    port: ${GRPC_QUESTION_BANK_PORT:9083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
