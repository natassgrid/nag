spring:
  application:
    name: question-bank-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exam_platform?currentSchema=question_service,public}
    username: ${SPRING_DATASOURCE_USERNAME:exam_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:exam_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      schema: question_service
      connection-init-sql: SET search_path TO question_service, public

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: question_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    schemas: question_service
    default-schema: question_service
    locations: classpath:db/migration
    init-sqls:
      - SET search_path TO question_service, public

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}/protocol/openid-connect/certs

  cloud:
    vault:
      uri: ${VAULT_ADDR:http://localhost:8200}
      token: ${VAULT_ROOT_TOKEN:vault_root_token}
      scheme: http
      kv:
        enabled: true
        backend: secret
      transit:
        enabled: true
        backend: transit
        default-context: question-bank-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: question-bank-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.examplatform.*"

  ai:
    openai:
      base-url: ${LITELLM_BASE_URL:http://localhost:4000}
      api-key: ${LITELLM_API_KEY:sk-litellm-dev-key}
      connect-timeout: 30s
      read-timeout: 15m
      chat:
        options:
          model: qwen2.5-1.5b
          temperature: 0.7
      embedding:
        options:
          model: all-minilm

  threads:
    virtual:
      enabled: true

server:
  port: ${QUESTION_BANK_SERVICE_PORT:8083}
  servlet:
    context-path: /
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    kafka:
      enabled: true
    vault:
      enabled: true
  metrics:
    tags:
      service: question-bank-service

otel:
  service:
    name: question-bank-service
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      protocol: grpc

app:
  opensearch:
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}
    scheme: ${OPENSEARCH_SCHEME:http}
  # Feature flag: set to true to encrypt question content/answerKey via Vault Transit.
  # When false, content is stored as plaintext (default for local dev).
  encryption:
    enabled: ${QUESTION_ENCRYPTION_ENABLED:false}

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","service":"question-bank-service","traceId":"%X{traceId}","spanId":"%X{spanId}","message":"%m"}%n'
