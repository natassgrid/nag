spring:
  application:
    name: question-bank-service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: question_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    schemas: question_service
    locations:
      - classpath:db/migration/question
      - classpath:db/migration/question/seeds
      - classpath:db/migration/question/seeds/rrb_ntpc
      - classpath:db/migration/question/seeds/sbi_po
      - classpath:db/migration/question/seeds/statement_and_conclusion
    clean-disabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.example.com/realms/exam-realm
          jwk-set-uri: https://auth.example.com/realms/exam-realm/protocol/openid-connect/certs

  cloud:
    vault:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
      - org.springframework.cloud.vault.config.VaultAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

translation:
  batch:
    chunk-pause-interval-questions: 0
    chunk-pause-duration-seconds: 0

management:
  health:
    db:
      enabled: false
    kafka:
      enabled: false
    vault:
      enabled: false
