spring:
  application:
    name: asset-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exam_platform}
    username: ${SPRING_DATASOURCE_USERNAME:exam_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:exam_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      schema: asset_service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: asset_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    schemas: asset_service
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  threads:
    virtual:
      enabled: true

server:
  port: ${ASSET_SERVICE_PORT:8095}
  servlet:
    context-path: /
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: asset-service

otel:
  service:
    name: asset-service
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      protocol: grpc

# Asset storage configuration
asset:
  storage:
    provider: filesystem
    max-file-size: 104857600  # 100 MB
    filesystem:
      base-path: ${ASSET_STORAGE_PATH:./asset-storage}

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","service":"asset-service","traceId":"%X{traceId}","spanId":"%X{spanId}","message":"%m"}%n'
