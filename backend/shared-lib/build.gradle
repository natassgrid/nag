plugins {
    id 'java-library'
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.lombok)
}

version = '1.0.0-SNAPSHOT'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
    }
}

dependencies {
    // Spring Context (for @Component, etc. — lightweight, no full Boot)
    api libs.spring.context

    // Spring Web (for ProblemDetail support — included in spring-webmvc)
    api libs.spring.web

    // Spring Data JPA (for @MappedSuperclass, @PrePersist, etc.)
    api libs.spring.data.jpa

    // Jakarta Persistence (JPA annotations)
    api libs.jakarta.persistence.api

    // UUID v7 — time-ordered, k-sortable UUIDs for all primary keys
    api libs.java.uuid.generator

    // Jackson for JSON serialisation of ApiResponse
    api libs.jackson.databind
    api libs.jackson.datatype.jsr310

    // Validation
    api libs.jakarta.validation.api

    // Spring Security (for shared security configs)
    api libs.spring.boot.starter.security
    api libs.spring.boot.starter.oauth2.resource.server

    // Hibernate (JPA provider — needed at compile time for @MappedSuperclass processing)
    compileOnly libs.hibernate.core

    // Test dependencies
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.jupiter.params
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
}

test {
    useJUnitPlatform()
}
