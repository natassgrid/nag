plugins {
    id 'java-library'
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.lombok)
    alias(libs.plugins.protobuf)
}

version = '1.0.0-SNAPSHOT'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.spring.boot.get()}"
    }
}

dependencies {
    // Spring Context (for @Component, etc. — lightweight, no full Boot)
    api libs.spring.context

    // Spring Web (for ProblemDetail support — included in spring-webmvc)
    api libs.spring.web

    // Spring Data JPA (for @MappedSuperclass, @PrePersist, etc.)
    api libs.spring.data.jpa

    // Jakarta Persistence (JPA annotations)
    api libs.jakarta.persistence.api

    // UUID v7 — time-ordered, k-sortable UUIDs for all primary keys
    api libs.java.uuid.generator

    // Jackson for JSON serialisation of ApiResponse
    api libs.jackson.databind
    api libs.jackson.datatype.jsr310

    // Validation
    api libs.jakarta.validation.api

    // Spring Kafka (for shared producer and consumer configuration)
    api libs.spring.kafka

    // Spring AMQP / RabbitMQ (shared RabbitMQ integration)
    api libs.spring.boot.starter.amqp

    // Spring Data Redis (optional shared Redis integration)
    compileOnly libs.spring.boot.starter.data.redis

    // Spring Security (for shared security configs)
    api libs.spring.boot.starter.security
    api libs.spring.boot.starter.oauth2.resource.server

    // gRPC & Protobuf
    api libs.grpc.protobuf
    api libs.grpc.stub
    api libs.grpc.netty.shaded
    api libs.protobuf.java
    api 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    // Hibernate (JPA provider — needed at compile time for @MappedSuperclass processing)
    compileOnly libs.hibernate.core

    // Flyway (for multi-schema migration runner)
    compileOnly libs.flyway.core

    // Test dependencies
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.starter.data.redis
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.jupiter.params
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
    testImplementation libs.spring.kafka.test
    testImplementation libs.grpc.testing
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.version.get()}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

test {
    useJUnitPlatform()
}
