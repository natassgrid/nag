syntax = "proto3";

package com.examplatform.questionbank.grpc;

option java_multiple_files = true;
option java_package = "com.examplatform.questionbank.grpc";
option java_outer_classname = "QuestionBankProto";

service QuestionBankGrpcService {
  rpc GetQuestionsForPaper (PaperQuestionsGrpcRequest) returns (PaperQuestionsGrpcResponse);
  rpc BatchFindQuestions (BatchFindQuestionsGrpcRequest) returns (BatchFindQuestionsGrpcResponse);
  rpc MatchBlueprint (BlueprintMatchGrpcRequest) returns (BlueprintMatchGrpcResponse);
}

message PaperQuestionsGrpcRequest {
  string paper_id = 1;
  string tenant_id = 2;
}

message BatchFindQuestionsGrpcRequest {
  repeated string question_ids = 1;
  string tenant_id = 2;
}

message BlueprintMatchGrpcRequest {
  int64 subject_id = 1;
  int64 topic_id = 2;
  int64 subtopic_id = 3;
  string difficulty = 4;
  string cognitive_level = 5;
  string tenant_id = 6;
}

message BlueprintMatchGrpcResponse {
  repeated QuestionSummaryGrpc questions = 1;
}

message QuestionSummaryGrpc {
  string id = 1;
  string content = 2;
  string question_type = 3;
  string difficulty = 4;
  string cognitive_level = 5;
  double marks = 6;
  double negative_marks = 7;
  string topic_id = 8;
  string subject_id = 9;
  string options_json = 10;
  string answer_key = 11;
  string explanation = 12;
  string passage_id = 13;
  string passage_content = 14;
  int32 passage_order_index = 15;
  string subject = 16;
  string topic = 17;
  int32 usage_count = 18;
  string subtopic_id = 19;
  string subtopic = 20;
}

message PaperQuestionsGrpcResponse {
  repeated QuestionSummaryGrpc questions = 1;
}

message BatchFindQuestionsGrpcResponse {
  repeated QuestionSummaryGrpc questions = 1;
}
