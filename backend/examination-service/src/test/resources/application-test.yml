spring:
  application:
    name: examination-service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: examination_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    schemas: examination_service
    locations: classpath:db/migration/examination
    clean-disabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.example.com/realms/exam-realm
          jwk-set-uri: https://auth.example.com/realms/exam-realm/protocol/openid-connect/certs

  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

management:
  health:
    db:
      enabled: false
    kafka:
      enabled: false

server:
  port: 0
