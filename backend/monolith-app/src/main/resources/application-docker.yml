# Docker Profile for Single JVM Monolith

server:
  port: ${SERVER_PORT:9000}

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:exam_platform}?currentSchema=identity_service,candidate_service,question_service,examination_service,paper_generator,delivery_service,response_service,evaluation_service,result_service,audit_service,notification_service,admin_service,analytics_service,asset_service,public
    username: ${POSTGRES_USER:exam_admin}
    password: ${POSTGRES_PASSWORD:exam_secret}

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:redis_secret}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/exam-realm
          jwk-set-uri: http://keycloak:8080/realms/exam-realm/protocol/openid-connect/certs

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:${SMTP_PORT:587}}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${SMTP_USERNAME:}}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${SMTP_PASSWORD:}}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  cloud:
    vault:
      uri: http://vault:8200
      token: ${VAULT_ROOT_TOKEN:vault_root_token}

  ai:
    openai:
      base-url: ${LITELLM_BASE_URL:http://litellm:4000}
      api-key: ${LITELLM_API_KEY:sk-litellm-dev-key}

platform:
  messaging:
    broker: in-memory

indictrans2:
  url: ${INDICTRANS2_URL:http://indictrans2:7860}

asset:
  storage:
    filesystem:
      base-path: ${ASSET_STORAGE_PATH:/data/asset-storage}

app:
  keycloak:
    server-url: http://keycloak:8080
  question-bank:
    service-url: ${QUESTION_BANK_SERVICE_URI:http://localhost:9000}
  frontend:
    admin-url: ${ADMIN_PORTAL_URL:http://localhost:4200}
    candidate-url: ${CANDIDATE_PORTAL_URL:http://localhost:4300}
