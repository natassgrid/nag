# National Assessment Grid (NAG) - Single JVM Monolith Application
# Combines all 14 domain services, embedded audit, and in-memory event bus.

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: nag-monolith

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exam_platform?currentSchema=identity_service,candidate_service,question_service,examination_service,paper_generator,delivery_service,response_service,evaluation_service,result_service,audit_service,notification_service,admin_service,analytics_service,asset_service,public}
    username: ${SPRING_DATASOURCE_USERNAME:exam_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:exam_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: false # Handled sequentially via MonolithFlywayConfig

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}
      timeout: 2000ms

  session:
    store-type: redis
    redis:
      flush-mode: on-save
      namespace: auth:session

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}/protocol/openid-connect/certs

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:exam_rabbit}
    password: ${SPRING_RABBITMQ_PASSWORD:rabbit_secret}
    listener:
      simple:
        auto-startup: ${SPRING_RABBITMQ_LISTENER_AUTO_STARTUP:false}
      direct:
        auto-startup: ${SPRING_RABBITMQ_LISTENER_AUTO_STARTUP:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:false}

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:${SMTP_PORT:587}}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${SMTP_USERNAME:}}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${SMTP_PASSWORD:}}}
    from: ${SPRING_MAIL_FROM:${MAIL_FROM:${SMTP_FROM:noreply@natassgrid.gov.in}}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  cloud:
    vault:
      uri: ${VAULT_ADDR:http://localhost:8200}
      token: ${VAULT_ROOT_TOKEN:vault_root_token}
      scheme: http
      kv:
        enabled: true
        backend: secret
      transit:
        enabled: true
        backend: transit
        default-context: identity-service

  ai:
    openai:
      base-url: ${LITELLM_BASE_URL:http://localhost:4000}
      api-key: ${LITELLM_API_KEY:sk-litellm-dev-key}
      connect-timeout: 30s
      read-timeout: 15m
      chat:
        options:
          model: qwen2.5-1.5b
          temperature: 0.7
      embedding:
        options:
          model: all-minilm

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:9000}
  servlet:
    context-path: /
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    kafka:
      enabled: false
    rabbit:
      enabled: false
    vault:
      enabled: ${MANAGEMENT_HEALTH_VAULT_ENABLED:false}
  tracing:
    enabled: ${ENABLE_OBSERVABILITY:false}
  metrics:
    tags:
      service: nag-monolith

# Observability (OpenTelemetry / Jaeger) - Optional in Monolith Mode
otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: http/protobuf

# Identity and Admin URL Settings
app:
  frontend:
    admin-url: ${ADMIN_PORTAL_URL:http://localhost:4200}
    candidate-url: ${CANDIDATE_PORTAL_URL:http://localhost:4300}
