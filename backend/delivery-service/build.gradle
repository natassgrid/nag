plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.lombok)
}

version = '0.0.1-SNAPSHOT'

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.spring.cloud.get()}"
    }
}

dependencies {
    implementation project(':backend:shared-lib')

    // Web
    implementation libs.spring.boot.starter.web

    // Security — OAuth2 Resource Server (JWT)
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.oauth2.resource.server

    // Data JPA + PostgreSQL
    implementation libs.spring.boot.starter.data.jpa
    runtimeOnly libs.postgresql

    // Flyway database migrations
    implementation libs.flyway.core
    implementation libs.flyway.database.postgresql

    // Redis (hot exam session state)
    implementation libs.spring.boot.starter.data.redis

    // Vault (shift-key decryption)
    implementation libs.spring.cloud.starter.vault.config
    implementation libs.spring.vault.core

    // Kafka (delivery events)
    implementation libs.spring.kafka

    // Resilience4j (circuit breaker)
    implementation libs.resilience4j.spring.boot3
    implementation libs.spring.boot.starter.aspectj

    // Actuator + Prometheus
    implementation libs.spring.boot.starter.actuator
    implementation libs.micrometer.registry.prometheus

    // Validation
    implementation libs.spring.boot.starter.validation

    // Test
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.security.test
    testImplementation libs.spring.kafka.test
    testImplementation libs.testcontainers.postgresql
    testImplementation libs.testcontainers.kafka
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.jupiter.params
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.assertj.core
    testImplementation libs.jqwik
}

springBoot {
    mainClass = 'com.examplatform.delivery.DeliveryServiceApplication'
}

test {
    useJUnitPlatform()
}
