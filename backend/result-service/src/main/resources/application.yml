spring:
  application:
    name: result-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exam_platform}
    username: ${SPRING_DATASOURCE_USERNAME:exam_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:exam_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      schema: result_service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: result_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    schemas: result_service
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/exam-realm}/protocol/openid-connect/certs
      client:
        registration:
          digilocker:
            client-id: ${DIGILOCKER_CLIENT_ID:digilocker-client}
            client-secret: ${DIGILOCKER_CLIENT_SECRET:digilocker-secret}
            authorization-grant-type: authorization_code
            redirect-uri: ${DIGILOCKER_REDIRECT_URI:http://localhost:8090/api/v1/results/digilocker/callback}
            scope: openid,profile
        provider:
          digilocker:
            authorization-uri: ${DIGILOCKER_AUTH_URI:https://digilocker.meripehchaan.gov.in/public/oauth2/1/authorize}
            token-uri: ${DIGILOCKER_TOKEN_URI:https://digilocker.meripehchaan.gov.in/public/oauth2/2/token}
            user-info-uri: ${DIGILOCKER_USERINFO_URI:https://digilocker.meripehchaan.gov.in/public/oauth2/1/user}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: result-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.examplatform.*"

  threads:
    virtual:
      enabled: true

server:
  port: ${RESULT_SERVICE_PORT:8090}
  servlet:
    context-path: /
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    kafka:
      enabled: true
  metrics:
    tags:
      service: result-service
    distribution:
      percentiles-histogram:
        http.server.requests: true

otel:
  service:
    name: result-service
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      protocol: grpc

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","service":"result-service","traceId":"%X{traceId}","spanId":"%X{spanId}","message":"%m"}%n'
