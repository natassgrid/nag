spring:
  application:
    name: result-service-test

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: result_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    schemas: result_service
    locations: classpath:db/migration/result

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:19999/realms/test
          jwk-set-uri: http://localhost:19999/realms/test/protocol/openid-connect/certs

  kafka:
    listener:
      auto-startup: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

platform:
  messaging:
    broker: in-memory

logging:
  level:
    org.testcontainers: INFO
    org.flywaydb: INFO
    org.springframework.test: INFO
