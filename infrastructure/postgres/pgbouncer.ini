; =============================================================================
; PgBouncer Configuration — Transaction-Mode Pooling
; Open Source Government Examination Platform
; Requirements: 20.5
;
; Each microservice gets its own pool with appropriate sizing.
; Transaction-mode pooling for maximum connection efficiency.
; =============================================================================

[databases]
; Service-specific database connections via Patroni leader
identity_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=identity_service'
candidate_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=candidate_service'
question_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=question_service'
translation_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=translation_service'
examination_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=examination_service'
paper_generator = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=paper_generator'
delivery_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=delivery_service'
response_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=response_service'
evaluation_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=evaluation_service'
result_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=result_service'
audit_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=audit_service'
notification_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=notification_service'
admin_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=admin_service'
analytics_service = host=${PG_HOST:-postgres} port=5432 dbname=exam_platform options='-c search_path=analytics_service'

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction-mode pooling — connections returned to pool after each transaction
pool_mode = transaction

; Pool sizing
default_pool_size = 20
min_pool_size = 5
max_client_conn = 1000
reserve_pool_size = 5
reserve_pool_timeout = 3

; Timeouts
server_idle_timeout = 300
server_lifetime = 3600
server_connect_timeout = 5
query_timeout = 30
query_wait_timeout = 60
client_idle_timeout = 600

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; TLS
; client_tls_sslmode = require
; client_tls_key_file = /etc/pgbouncer/server.key
; client_tls_cert_file = /etc/pgbouncer/server.crt
; server_tls_sslmode = verify-full
; server_tls_ca_file = /etc/pgbouncer/ca.crt

; Admin
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

; DNS
dns_max_ttl = 15
dns_zone_check_period = 5
