# =============================================================================
# Redis 7 Cluster Configuration — Production
# Open Digital Public Infrastructure (DPI) Platform
# Requirements: 19.2
#
# 3 masters + 3 replicas across 3 Availability Zones
# Sub-millisecond session lookups, rate limiting, distributed cache
#
# Deploy 2 nodes (1 master + 1 replica from different shard) per AZ:
#   AZ-1: redis-1 (master-shard-1), redis-4 (replica-shard-2)
#   AZ-2: redis-2 (master-shard-2), redis-5 (replica-shard-3)
#   AZ-3: redis-3 (master-shard-3), redis-6 (replica-shard-1)
# =============================================================================

# --- Network ---
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
protected-mode no

# --- Cluster ---
cluster-enabled yes
cluster-config-file /data/nodes.conf
cluster-node-timeout 5000
cluster-announce-hostname ""
cluster-announce-port 6379
cluster-announce-bus-port 16379
cluster-migration-barrier 1
cluster-require-full-coverage no
cluster-allow-reads-when-down no
cluster-allow-pubsubshard-when-down no

# --- Memory ---
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 10
active-expire-enabled yes

# --- Persistence (AOF for durability) ---
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# RDB snapshots (supplementary backup)
save 900 1
save 300 10
save 60 10000
rdbfilename dump.rdb
rdbcompression yes
rdbchecksum yes
dir /data

# --- Security ---
requirepass ${REDIS_PASSWORD}
masterauth ${REDIS_PASSWORD}
aclfile /etc/redis/users.acl

# --- Performance ---
hz 10
dynamic-hz yes
io-threads 4
io-threads-do-reads yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# --- Logging ---
loglevel notice
logfile /var/log/redis/redis-server.log

# --- Slow Log ---
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Latency Monitoring ---
latency-monitor-threshold 50

# --- Client Output Buffer Limits ---
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# --- Replication ---
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-diskless-sync-max-replicas 0
repl-timeout 60
repl-backlog-size 512mb
repl-backlog-ttl 3600
replica-lazy-flush yes
