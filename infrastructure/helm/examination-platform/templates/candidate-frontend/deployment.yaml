{{- if .Values.candidateFrontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "examination-platform.fullname" . }}-candidate-frontend
  labels:
    app.kubernetes.io/name: candidate-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: exam-platform
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.candidateFrontend.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: candidate-frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: candidate-frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: exam-platform
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: candidate-frontend
          image: "{{ .Values.global.image.registry }}/{{ .Values.candidateFrontend.image.name }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.candidateFrontend.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.candidateFrontend.resources | nindent 12 }}
{{- end }}
