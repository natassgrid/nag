# =============================================================================
# Default Values — Open Source Government Examination Platform
# Requirements: 24.6
# All secrets injected via External Secrets Operator — no plaintext secrets here
# =============================================================================

global:
  image:
    registry: ghcr.io/exam-platform
    tag: latest
    pullPolicy: IfNotPresent
  environment: staging
  namespace: exam-platform

# --- External Secrets Operator ---
externalSecrets:
  enabled: true
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  refreshInterval: 1h

# --- Service Defaults ---
defaults:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  javaOpts: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: management
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: management
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 3

# --- Identity Service ---
identityService:
  enabled: true
  replicas: 3
  image:
    name: identity-service
  port: 8081
  managementPort: 8081
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: 2000m
      memory: 1536Mi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    metrics:
      - type: Pods
        pods:
          metric:
            name: http_server_requests_per_second
          target:
            type: AverageValue
            averageValue: "500"
  env:
    SPRING_PROFILES_ACTIVE: kubernetes
    OTEL_SERVICE_NAME: identity-service

# --- Candidate Service ---
candidateService:
  enabled: true
  replicas: 2
  image:
