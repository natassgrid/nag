# =============================================================================
# Apache Kafka KRaft Broker Configuration (3-Broker Cluster)
# Open Digital Public Infrastructure (DPI) Platform
# Requirements: 20.3 — Replication factor 3, min.insync.replicas=2
#
# Each broker should have a unique node.id (1, 2, or 3).
# Override node.id and advertised.listeners per broker instance.
# =============================================================================

# --- Cluster Identity ---
process.roles=broker,controller
node.id=${KAFKA_NODE_ID:-1}
cluster.id=${KAFKA_CLUSTER_ID:-exam-platform-kafka-cluster}

# --- Controller Quorum (3 controllers for HA) ---
controller.quorum.voters=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
controller.listener.names=CONTROLLER

# --- Listeners ---
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
advertised.listeners=PLAINTEXT://${KAFKA_ADVERTISED_HOST:-kafka-1}:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

# --- Replication and Durability (RPO=0) ---
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

# --- Log Configuration ---
log.dirs=/var/kafka/data
num.partitions=6
log.retention.hours=168
log.retention.bytes=-1
log.segment.bytes=1073741824
log.cleanup.policy=delete
log.retention.check.interval.ms=300000

# --- Performance Tuning ---
num.network.threads=8
num.io.threads=16
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
num.recovery.threads.per.data.dir=2
num.replica.fetchers=4

# --- Producer ACKs enforcement ---
# Producers MUST use acks=all; broker enforces via min.insync.replicas
# This ensures zero data loss (RPO=0) for all exam response data

# --- Group Coordinator ---
group.initial.rebalance.delay.ms=3000
group.min.session.timeout.ms=6000
group.max.session.timeout.ms=1800000

# --- Metadata ---
metadata.log.dir=/var/kafka/metadata
metadata.max.retention.bytes=-1
metadata.max.retention.ms=604800000

# --- Monitoring ---
metric.reporters=org.apache.kafka.common.metrics.JmxReporter
auto.create.topics.enable=false
