# =============================================================================
# Open Source Government Examination Platform — Local Development Stack
# Requirement 24.4: Docker Compose for all infrastructure services
# =============================================================================

networks:
  exam-network:
    driver: bridge
    name: exam-network

volumes:
  postgres_data:
  kafka_data:
  redis_1_data:
  redis_2_data:
  redis_3_data:
  redis_4_data:
  redis_5_data:
  redis_6_data:
  keycloak_data:
  vault_data:
  prometheus_data:
  grafana_data:

services:

  # ===========================================================================
  # PostgreSQL 16 — Primary relational data store
  # All service schemas in a single cluster (per design doc)
  # ===========================================================================
  postgres:
    image: postgres:16
    container_name: exam-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam_secret}
      POSTGRES_DB: ${POSTGRES_DB:-exam_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exam_admin} -d ${POSTGRES_DB:-exam_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - exam-network

  # ===========================================================================
  # Apache Kafka — KRaft mode (no Zookeeper), Bitnami image
  # Topics: exam.audit.events, exam.notifications.outbound, exam.session.events,
  #         exam.question.lifecycle, exam.proctoring.alerts, exam.evaluation.events
  # ===========================================================================
  kafka:
    image: bitnami/kafka:3.7
    container_name: exam-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_INTERNAL_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      # KRaft settings
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listener configuration
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Replication and durability (RPO=0 requirement)
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 1
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Auto-create the required topics
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: >-
        exam.audit.events:3:1,
        exam.notifications.outbound:3:1,
        exam.session.events:6:1,
        exam.question.lifecycle:3:1,
        exam.proctoring.alerts:3:1,
        exam.evaluation.events:3:1,
        exam.identity.events:3:1,
        exam.paper.events:3:1,
        exam.response.saved:12:1,
        exam.result.published:3:1
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - exam-network

  # ===========================================================================
  # Redis Cluster — 3 masters + 3 replicas (ports 6379-6384)
  # Sub-millisecond session lookup, rate limiting, distributed cache
  # ===========================================================================
  redis-node-1:
    image: redis:7-alpine
    container_name: exam-redis-1
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "16379:16379"
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip ${REDIS_CLUSTER_IP:-127.0.0.1}
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --masterauth ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_1_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - exam-network

  redis-node-2:
    image: redis:7-alpine
    container_name: exam-redis-2
    restart: unless-stopped
    ports:
      - "6380:6380"
      - "16380:16380"
    command: >
      redis-server
      --port 6380
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip ${REDIS_CLUSTER_IP:-127.0.0.1}
      --cluster-announce-port 6380
      --cluster-announce-bus-port 16380
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --masterauth ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_2_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - exam-network

  redis-node-3:
    image: redis:7-alpine
    container_name: exam-redis-3
    restart: unless-stopped
    ports:
      - "6381:6381"
      - "16381:16381"
    command: >
      redis-server
      --port 6381
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip ${REDIS_CLUSTER_IP:-127.0.0.1}
      --cluster-announce-port 6381
      --cluster-announce-bus-port 16381
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --masterauth ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_3_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - exam-network

  redis-node-4:
    image: redis:7-alpine
    container_name: exam-redis-4
    restart: unless-stopped
    ports:
      - "6382:6382"
      - "16382:16382"
    command: >
      redis-server
      --port 6382
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip ${REDIS_CLUSTER_IP:-127.0.0.1}
      --cluster-announce-port 6382
      --cluster-announce-bus-port 16382
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --masterauth ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_4_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - exam-network

  redis-node-5:
    image: redis:7-alpine
    container_name: exam-redis-5
    restart: unless-stopped
    ports:
      - "6383:6383"
      - "16383:16383"
    command: >
      redis-server
      --port 6383
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip ${REDIS_CLUSTER_IP:-127.0.0.1}
      --cluster-announce-port 6383
      --cluster-announce-bus-port 16383
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --masterauth ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_5_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6383", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - exam-network

  redis-node-6:
    image: redis:7-alpine
    container_name: exam-redis-6
    restart: unless-stopped
    ports:
      - "6384:6384"
      - "16384:16384"
    command: >
      redis-server
      --port 6384
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip ${REDIS_CLUSTER_IP:-127.0.0.1}
      --cluster-announce-port 6384
      --cluster-announce-bus-port 16384
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --masterauth ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_6_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6384", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - exam-network

  # Bootstrap the Redis cluster (runs once, exits after cluster is formed)
  redis-cluster-init:
    image: redis:7-alpine
    container_name: exam-redis-cluster-init
    restart: on-failure
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    command: >
      sh -c "redis-cli -a ${REDIS_PASSWORD:-redis_secret}
        --cluster create
        ${REDIS_CLUSTER_IP:-127.0.0.1}:6379
        ${REDIS_CLUSTER_IP:-127.0.0.1}:6380
        ${REDIS_CLUSTER_IP:-127.0.0.1}:6381
        ${REDIS_CLUSTER_IP:-127.0.0.1}:6382
        ${REDIS_CLUSTER_IP:-127.0.0.1}:6383
        ${REDIS_CLUSTER_IP:-127.0.0.1}:6384
        --cluster-replicas 1
        --cluster-yes"
    networks:
      - exam-network

  # ===========================================================================
  # Keycloak — IAM / OAuth2 / OIDC provider (dev mode)
  # Port 8080 — admin UI at http://localhost:8080
  # ===========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: exam-keycloak
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secret}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}
      KC_DB_USERNAME: ${POSTGRES_USER:-exam_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-exam_secret}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - exam-network
    volumes:
      - keycloak_data:/opt/keycloak/data

  # ===========================================================================
  # HashiCorp Vault — dev mode, Transit Engine for HSM-abstracted key management
  # Port 8200 — UI at http://localhost:8200 (root token: vault_root_token)
  # ===========================================================================
  vault:
    image: hashicorp/vault:latest
    container_name: exam-vault
    restart: unless-stopped
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-vault_root_token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://localhost:8200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - vault_data:/vault/data
    networks:
      - exam-network

  # ===========================================================================
  # Prometheus — metrics collection, scrapes all service /actuator/prometheus
  # Port 9090 — UI at http://localhost:9090
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: exam-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - exam-network

  # ===========================================================================
  # Grafana — dashboards provisioned with Prometheus datasource
  # Port 3000 — UI at http://localhost:3000 (admin / grafana_secret)
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: exam-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_secret}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - exam-network

  # ===========================================================================
  # Jaeger — distributed tracing (all-in-one)
  # Port 16686 (UI), 4317 (OTLP gRPC), 4318 (OTLP HTTP)
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: exam-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"       # Jaeger UI
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"  # OTLP gRPC
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"  # OTLP HTTP
      - "14268:14268"                           # Jaeger HTTP collector (legacy)
      - "14250:14250"                           # Jaeger gRPC (internal)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      QUERY_MAX_CLOCK_SKEW_ADJUSTMENT: 0s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - exam-network
