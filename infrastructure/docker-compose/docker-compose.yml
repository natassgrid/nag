# =============================================================================
# Open Source Government Examination Platform — Local Development Stack
# Requirement 24.4: Docker Compose for all infrastructure services
# =============================================================================

networks:
  exam-network:
    driver: bridge
    name: exam-network

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  keycloak_data:
  vault_data:
  prometheus_data:
  grafana_data:

services:

  # ===========================================================================
  # PostgreSQL 16 — Primary relational data store
  # All service schemas in a single cluster (per design doc)
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: exam-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam_secret}
      POSTGRES_DB: ${POSTGRES_DB:-exam_platform}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exam_admin} -d ${POSTGRES_DB:-exam_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - exam-network

  # ===========================================================================
  # Apache Kafka — KRaft mode (no Zookeeper), Bitnami image
  # Topics: exam.audit.events, exam.notifications.outbound, exam.session.events,
  #         exam.question.lifecycle, exam.proctoring.alerts, exam.evaluation.events
  # ===========================================================================
  kafka:
    image: apache/kafka:3.9.0
    container_name: exam-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_INTERNAL_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listener configuration
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Replication and durability (RPO=0 requirement)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Auto-create topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Cluster ID for KRaft
      CLUSTER_ID: "exam-platform-kafka-cluster-01"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - exam-network

  # ===========================================================================
  # Redis — Standalone mode for local development
  # For production, use a proper Redis Cluster with sentinel
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: exam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --port 6379
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - exam-network

  # ===========================================================================
  # Keycloak — IAM / OAuth2 / OIDC provider (dev mode)
  # Port 8080 — admin UI at http://localhost:8080
  # ===========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: exam-keycloak
    restart: unless-stopped
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secret}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}
      KC_DB_USERNAME: ${POSTGRES_USER:-exam_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-exam_secret}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - exam-network
    volumes:
      - keycloak_data:/opt/keycloak/data

  # ===========================================================================
  # HashiCorp Vault — dev mode, Transit Engine for HSM-abstracted key management
  # Port 8200 — UI at http://localhost:8200 (root token: vault_root_token)
  # ===========================================================================
  vault:
    image: hashicorp/vault:latest
    container_name: exam-vault
    restart: unless-stopped
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-vault_root_token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://localhost:8200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - vault_data:/vault/data
    networks:
      - exam-network

  # ===========================================================================
  # Prometheus — metrics collection, scrapes all service /actuator/prometheus
  # Port 9090 — UI at http://localhost:9090
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: exam-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - exam-network

  # ===========================================================================
  # Grafana — dashboards provisioned with Prometheus datasource
  # Port 3000 — UI at http://localhost:3000 (admin / grafana_secret)
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: exam-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_secret}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - exam-network

  # ===========================================================================
  # Jaeger — distributed tracing (all-in-one)
  # Port 16686 (UI), 4317 (OTLP gRPC), 4318 (OTLP HTTP)
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: exam-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"       # Jaeger UI
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"  # OTLP gRPC
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"  # OTLP HTTP
      - "14268:14268"                           # Jaeger HTTP collector (legacy)
      - "14250:14250"                           # Jaeger gRPC (internal)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      QUERY_MAX_CLOCK_SKEW_ADJUSTMENT: 0s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - exam-network
