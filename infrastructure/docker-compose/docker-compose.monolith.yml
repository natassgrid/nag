# =============================================================================
# Monolith Deployment Mode (Requirement 24.3, 24.4)
# Consolidates all 14 backend microservices + audit into a single Spring Boot JVM
# reducing RAM consumption from ~8.5GB down to ~1.2GB for low-spec servers and local dev.
#
# Supports:
#   1. In-Memory messaging (zero broker, ultra-lightweight)
#   2. RabbitMQ messaging (with --profile rabbit)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monolith.yml up -d
#   docker compose --profile rabbit -f docker-compose.yml -f docker-compose.monolith.yml up -d
# =============================================================================

x-service-common: &service-common
  restart: unless-stopped
  networks:
    - exam-network

x-healthcheck-spring: &healthcheck-spring
  interval: 10s
  timeout: 5s
  retries: 15
  start_period: 30s

services:

  # ===========================================================================
  # Optional RabbitMQ 3.13 — Lightweight message broker for Monolith RabbitMQ mode
  # ===========================================================================
  rabbitmq:
    profiles: ["rabbit"]
    image: rabbitmq:3.13-management-alpine
    container_name: exam-monolith-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"       # AMQP protocol
      - "15672:15672"     # Web Management Console (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-exam_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbit_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - exam-network

  # ===========================================================================
  # Single JVM Monolith Application (All 14 Modules + Audit Embedded)
  # ===========================================================================
  monolith-app:
    restart: unless-stopped
    build:
      context: ../../
      dockerfile: backend/Dockerfile.monolith
    image: localhost:5000/exam/monolith-app:latest
    container_name: exam-monolith-app
    ports:
      - "${MONOLITH_PORT:-9000}:${MONOLITH_PORT:-9000}"
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PLATFORM_MESSAGING_BROKER: ${PLATFORM_MESSAGING_BROKER:-in-memory}
      SERVER_PORT: ${MONOLITH_PORT:-9000}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=identity_service,candidate_service,question_service,examination_service,paper_generator,delivery_service,response_service,evaluation_service,result_service,audit_service,notification_service,admin_service,analytics_service,asset_service,public
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-exam_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-exam_secret}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-exam_rabbit}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-rabbit_secret}
      SPRING_RABBITMQ_LISTENER_AUTO_STARTUP: ${SPRING_RABBITMQ_LISTENER_AUTO_STARTUP:-true}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/exam-realm
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN:-vault_root_token}
      MANAGEMENT_HEALTH_VAULT_ENABLED: "false"
      MANAGEMENT_HEALTH_DISCOVERY_ENABLED: "false"
      MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "${MANAGEMENT_HEALTH_RABBIT_ENABLED:-false}"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      ASSET_STORAGE_PATH: /data/asset-storage
      SCORECARD_STORAGE_MODE: ${SCORECARD_STORAGE_MODE:-local}
      SCORECARD_STORAGE_PATH: ${SCORECARD_STORAGE_PATH:-/data/scorecards}
      SCORECARD_STORAGE_BUCKET: ${SCORECARD_STORAGE_BUCKET:-exam-platform-scorecards}
      # Observability / OpenTelemetry - Optional (Disabled by default to minimize memory)
      ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-false}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # Shared JWT signing secret for dev mode
      APP_JWT_SECRET: dev-jwt-secret-key-for-local-testing-minimum-32-chars
      INDICTRANS2_URL: ${INDICTRANS2_URL:-http://indictrans2:7860}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
    networks:
      exam-network:
        aliases:
          - api-gateway
          - auth-service
          - candidate-service
          - question-bank-service
          - examination-service
          - paper-generator
          - delivery-service
          - response-service
          - evaluation-service
          - result-service
          - audit-service
          - notification-service
          - admin-service
          - analytics-service
          - asset-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || wget -qO- http://localhost:8080/actuator/health || exit 1"]
      <<: *healthcheck-spring
    volumes:
      - monolith_asset_data:/data/asset-storage
      - monolith_scorecard_data:/data/scorecards

  frontend:
    <<: *service-common
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: localhost:5000/exam/frontend:latest
    container_name: exam-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: exam-realm
      VITE_KEYCLOAK_CLIENT_ID: exam-admin-frontend
    depends_on:
      monolith-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  candidate-frontend:
    <<: *service-common
    build:
      context: ../../candidate-frontend
      dockerfile: Dockerfile
    image: localhost:5000/exam/candidate-frontend:latest
    container_name: exam-candidate-frontend
    ports:
      - "${CANDIDATE_FRONTEND_PORT:-4300}:80"
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: exam-realm
      VITE_KEYCLOAK_CLIENT_ID: exam-candidate-frontend
    depends_on:
      monolith-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  monolith_asset_data:
  monolith_scorecard_data:
  rabbitmq_data:
