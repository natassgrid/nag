  # Jaeger (internal metrics)
  - job_name: jaeger
    static_configs:
      - targets:
          - jaeger:14269
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: jaeger
