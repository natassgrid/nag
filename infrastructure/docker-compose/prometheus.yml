# =============================================================================
# Prometheus scrape configuration
# Open Source Government Examination Platform
# Requirement 21.2: Prometheus-compatible metrics from every microservice
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    platform: exam-platform
    env: local

# Alerting configuration (points to Alertmanager when deployed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files (add alert rules here as the platform grows)
rule_files: []
# - "alert_rules.yml"

scrape_configs:

  # -------------------------------------------------------------------------
  # Prometheus self-monitoring
  # -------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
    metrics_path: /metrics

  # -------------------------------------------------------------------------
  # Identity Service
  # -------------------------------------------------------------------------
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity-service:8081
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: identity-service

  # -------------------------------------------------------------------------
  # Candidate Service
  # -------------------------------------------------------------------------
  - job_name: candidate-service
    metrics_path: /actuator/prometheus
    static_configs:
