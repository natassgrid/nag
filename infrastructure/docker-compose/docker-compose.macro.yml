# =============================================================================
# Docker Compose ? NAG Macro-Services Mode (Lightweight / Demo / EC2 / Small Tenants)
# Consolidates 14 microservices into 5 deployment units + API Gateway + RabbitMQ.
# Memory requirement: ~2.5 GB RAM (runs comfortably on t3.medium with 4 GB).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.macro.yml up --build
# =============================================================================

x-service-common: &service-common
  restart: unless-stopped
  networks:
    - exam-network

x-healthcheck-spring: &healthcheck-spring
  interval: 10s
  timeout: 5s
  retries: 15
  start_period: 30s

x-spring-macro-env: &spring-macro-env
  SPRING_PROFILES_ACTIVE: macro,docker
  PLATFORM_MESSAGING_BROKER: rabbit
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-exam_admin}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-exam_secret}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-exam_rabbit}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-rabbit_secret}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
  KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/exam-realm
  KEYCLOAK_SERVER_URL: http://keycloak:8080
  VAULT_ADDR: http://vault:8200
  VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN:-vault_root_token}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_HEALTH_VAULT_ENABLED: "false"
  MANAGEMENT_HEALTH_DISCOVERY_ENABLED: "false"
  MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  APP_JWT_SECRET: dev-jwt-secret-key-for-local-testing-minimum-32-chars

x-depends-macro: &depends-macro
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:

  # ===========================================================================
  # RabbitMQ 3.13 ? Lightweight message broker (~80 MB RAM vs 512 MB Kafka)
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: exam-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"       # AMQP protocol
      - "15672:15672"     # Web Management Console (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-exam_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbit_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - exam-network

  # ===========================================================================
  # Macro 1: Auth & Admin Service (Identity, Candidate, Admin, Notification)
  # ===========================================================================
  auth-admin-service:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: auth-admin-app
    image: localhost:5000/exam/auth-admin-app:latest
    container_name: exam-auth-admin-service
    ports:
      - "${AUTH_ADMIN_PORT:-8081}:${AUTH_ADMIN_PORT:-8081}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${AUTH_ADMIN_PORT:-8081}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=identity_service,candidate_service,admin_service,notification_service,public
      OTEL_SERVICE_NAME: auth-admin-service
    depends_on:
      <<: *depends-macro
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${AUTH_ADMIN_PORT:-8081}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # Macro 2: Content Service (Question Bank, Examination, Paper Gen, Asset)
  # ===========================================================================
  content-service:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: content-app
    image: localhost:5000/exam/content-app:latest
    container_name: exam-content-service
    ports:
      - "${CONTENT_APP_PORT:-8083}:${CONTENT_APP_PORT:-8083}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${CONTENT_APP_PORT:-8083}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=question_service,examination_service,paper_generator,asset_service,public
      OTEL_SERVICE_NAME: content-service
      INDICTRANS2_URL: ${INDICTRANS2_URL:-http://indictrans2:7860}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
    depends_on:
      <<: *depends-macro
    volumes:
      - asset_storage:/data/asset-storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CONTENT_APP_PORT:-8083}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # Macro 3: Execution Service (Delivery & Response ? Hot Path)
  # ===========================================================================
  execution-service:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: execution-app
    image: localhost:5000/exam/execution-app:latest
    container_name: exam-execution-service
    ports:
      - "${EXECUTION_APP_PORT:-8087}:${EXECUTION_APP_PORT:-8087}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${EXECUTION_APP_PORT:-8087}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=delivery_service,response_service,public
      OTEL_SERVICE_NAME: execution-service
    depends_on:
      <<: *depends-macro
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${EXECUTION_APP_PORT:-8087}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # Macro 4: Post-Exam Service (Evaluation, Result, Analytics)
  # ===========================================================================
  post-exam-service:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: post-exam-app
    image: localhost:5000/exam/post-exam-app:latest
    container_name: exam-post-exam-service
    ports:
      - "${POST_EXAM_APP_PORT:-8089}:${POST_EXAM_APP_PORT:-8089}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${POST_EXAM_APP_PORT:-8089}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=evaluation_service,result_service,analytics_service,public
      OTEL_SERVICE_NAME: post-exam-service
    depends_on:
      <<: *depends-macro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${POST_EXAM_APP_PORT:-8089}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # Macro 5: Audit Service (Isolated Standalone for Legal Compliance)
  # ===========================================================================
  audit-service:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: audit-service
    image: localhost:5000/exam/audit-service:latest
    container_name: exam-audit-service
    ports:
      - "${AUDIT_SERVICE_PORT:-8091}:${AUDIT_SERVICE_PORT:-8091}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${AUDIT_SERVICE_PORT:-8091}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=audit_service
      OTEL_SERVICE_NAME: audit-service
    depends_on:
      <<: *depends-macro
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${AUDIT_SERVICE_PORT:-8091}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # API Gateway ? Routes traffic to the 5 macro backend endpoints
  # ===========================================================================
  api-gateway:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: api-gateway
    image: localhost:5000/exam/api-gateway:latest
    container_name: exam-api-gateway
    ports:
      - "${GATEWAY_PORT:-9000}:${GATEWAY_PORT:-9000}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${GATEWAY_PORT:-9000}
      OTEL_SERVICE_NAME: api-gateway
      # Route upstream targets mapped to macro services
      IDENTITY_SERVICE_URI: http://auth-admin-service:${AUTH_ADMIN_PORT:-8081}
      CANDIDATE_SERVICE_URI: http://auth-admin-service:${AUTH_ADMIN_PORT:-8081}
      ADMIN_SERVICE_URI: http://auth-admin-service:${AUTH_ADMIN_PORT:-8081}
      NOTIFICATION_SERVICE_URI: http://auth-admin-service:${AUTH_ADMIN_PORT:-8081}
      QUESTION_BANK_SERVICE_URI: http://content-service:${CONTENT_APP_PORT:-8083}
      EXAMINATION_SERVICE_URI: http://content-service:${CONTENT_APP_PORT:-8083}
      PAPER_GENERATOR_URI: http://content-service:${CONTENT_APP_PORT:-8083}
      ASSET_SERVICE_URI: http://content-service:${CONTENT_APP_PORT:-8083}
      DELIVERY_SERVICE_URI: http://execution-service:${EXECUTION_APP_PORT:-8087}
      RESPONSE_SERVICE_URI: http://execution-service:${EXECUTION_APP_PORT:-8087}
      EVALUATION_SERVICE_URI: http://post-exam-service:${POST_EXAM_APP_PORT:-8089}
      RESULT_SERVICE_URI: http://post-exam-service:${POST_EXAM_APP_PORT:-8089}
      ANALYTICS_SERVICE_URI: http://post-exam-service:${POST_EXAM_APP_PORT:-8089}
      AUDIT_SERVICE_URI: http://audit-service:${AUDIT_SERVICE_PORT:-8091}
    depends_on:
      auth-admin-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${GATEWAY_PORT:-9000}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # Frontend ? Admin SPA
  # ===========================================================================
  frontend:
    <<: *service-common
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: localhost:5000/exam/frontend:latest
    container_name: exam-frontend
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # Candidate Frontend ? Candidate SPA
  # ===========================================================================
  candidate-frontend:
    <<: *service-common
    build:
      context: ../../candidate-frontend
      dockerfile: Dockerfile
    image: localhost:5000/exam/candidate-frontend:latest
    container_name: exam-candidate-frontend
    ports:
      - "4300:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rabbitmq_data:
  asset_storage:
