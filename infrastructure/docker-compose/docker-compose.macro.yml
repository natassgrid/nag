# =============================================================================
# Docker Compose — NAG Macroservices Deployment Profile
# Groups 14 microservices into 5 balanced Macroservice clusters + Audit:
#   Macro 1: Identity & Access (Identity, Candidate, Admin, Notification)
#   Macro 2: Question & Authoring (Question, Paper Generator, Asset)
#   Macro 3: Exam Delivery (Examination, Delivery, Response)
#   Macro 4: Assessment & Analytics (Evaluation, Result, Analytics)
#   Macro 5: Audit Service (Stand-alone audit append-only log)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.macro.yml up --build
# =============================================================================

x-service-common: &service-common
  restart: unless-stopped
  networks:
    - exam-network

x-healthcheck-spring: &healthcheck-spring
  interval: 10s
  timeout: 5s
  retries: 15
  start_period: 30s

x-spring-macro-env: &spring-macro-env
  SPRING_PROFILES_ACTIVE: docker
  PLATFORM_MESSAGING_BROKER: rabbit
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-exam_rabbit}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-rabbit_secret}
  SPRING_RABBITMQ_LISTENER_AUTO_STARTUP: "true"
  MANAGEMENT_HEALTH_RABBIT_ENABLED: "true"
  MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
  MANAGEMENT_HEALTH_VAULT_ENABLED: "false"
  MANAGEMENT_HEALTH_DISCOVERY_ENABLED: "false"
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-exam_admin}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-exam_secret}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
  KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/exam-realm
  KEYCLOAK_SERVER_URL: http://keycloak:8080
  VAULT_ADDR: http://vault:8200
  VAULT_ROOT_TOKEN: ${VAULT_ROOT_TOKEN:-vault_root_token}
  ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-false}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
  APP_JWT_SECRET: dev-jwt-secret-key-for-local-testing-minimum-32-chars

x-depends-macro: &depends-macro
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:

  # ===========================================================================\
  # RabbitMQ 3.13 — Message broker for Macroservice inter-cluster messaging
  # ===========================================================================\
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: exam-macro-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"       # AMQP protocol
      - "15672:15672"     # Web Management Console (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-exam_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbit_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - exam-network

  # ===========================================================================
  # Macro 1: Identity & Access Service (Identity, Candidate, Admin, Notification)
  # ===========================================================================
  identity-service:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: identity-app
    image: localhost:5000/exam/identity-app:latest
    container_name: exam-identity-service
    ports:
      - "${IDENTITY_APP_PORT:-8081}:${IDENTITY_APP_PORT:-8081}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${IDENTITY_APP_PORT:-8081}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=identity_service,candidate_service,admin_service,notification_service,public
      OTEL_SERVICE_NAME: identity-service
      ADMIN_PORTAL_URL: ${ADMIN_PORTAL_URL:-http://localhost:4200}
      CANDIDATE_PORTAL_URL: ${CANDIDATE_PORTAL_URL:-http://localhost:4300}
      # Email / SMTP Configuration
      SMTP_HOST: ${SMTP_HOST:-${MAIL_HOST:-smtp.gmail.com}}
      SMTP_PORT: ${SMTP_PORT:-${MAIL_PORT:-587}}
      SMTP_USERNAME: ${SMTP_USERNAME:-${MAIL_USERNAME:-}}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-${MAIL_PASSWORD:-}}
      SMTP_FROM: ${SMTP_FROM:-${MAIL_FROM:-noreply@natassgrid.gov.in}}
      MAIL_HOST: ${MAIL_HOST:-${SMTP_HOST:-smtp.gmail.com}}
      MAIL_PORT: ${MAIL_PORT:-${SMTP_PORT:-587}}
      MAIL_USERNAME: ${MAIL_USERNAME:-${SMTP_USERNAME:-}}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-${SMTP_PASSWORD:-}}
      MAIL_FROM: ${MAIL_FROM:-${SMTP_FROM:-noreply@natassgrid.gov.in}}
      SPRING_MAIL_HOST: ${SMTP_HOST:-${MAIL_HOST:-smtp.gmail.com}}
      SPRING_MAIL_PORT: ${SMTP_PORT:-${MAIL_PORT:-587}}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-${MAIL_USERNAME:-}}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-${MAIL_PASSWORD:-}}
      SPRING_MAIL_FROM: ${SMTP_FROM:-${MAIL_FROM:-noreply@natassgrid.gov.in}}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      MOBILE_VERIFICATION_REQUIRED: ${MOBILE_VERIFICATION_REQUIRED:-false}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-NAGGov}
    depends_on:
      <<: *depends-macro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${IDENTITY_APP_PORT:-8081}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # Macro 2: Question & Authoring Service (Question, Paper Generator, Asset)
  # ===========================================================================
  paper-service:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: paper-app
    image: localhost:5000/exam/paper-app:latest
    container_name: exam-paper-service
    ports:
      - "${PAPER_SERVICE_PORT:-8083}:${PAPER_SERVICE_PORT:-8083}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${PAPER_SERVICE_PORT:-8083}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=question_service,paper_generator,asset_service,public
      OTEL_SERVICE_NAME: paper-service
      ASSET_STORAGE_PATH: /data/asset-storage
      # AI Generation & Bedrock / LiteLLM Settings
      AI_BEDROCK_ENABLED: ${AI_BEDROCK_ENABLED:-false}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AI_BEDROCK_ROLE_ARN: ${AI_BEDROCK_ROLE_ARN:-}
      AI_BEDROCK_S3_BUCKET: ${AI_BEDROCK_S3_BUCKET:-}
      AI_MODEL_EASY: ${AI_MODEL_EASY:-nova-micro}
      AI_MODEL_MEDIUM: ${AI_MODEL_MEDIUM:-nova-lite}
      AI_MODEL_HARD: ${AI_MODEL_HARD:-nova-lite}
      INDICTRANS2_URL: http://indictrans2:7860
      SPRING_AI_OPENAI_BASE_URL: http://litellm:4000
      SPRING_AI_OPENAI_API_KEY: sk-litellm-dev-key
    depends_on:
      <<: *depends-macro
    volumes:
      - asset_storage:/data/asset-storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PAPER_SERVICE_PORT:-8083}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # Macro 3: Exam Delivery Service (Examination, Delivery, Response)
  # ===========================================================================
  delivery-service:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: delivery-app
    image: localhost:5000/exam/delivery-app:latest
    container_name: exam-delivery-service
    ports:
      - "${DELIVERY_APP_PORT:-8085}:${DELIVERY_APP_PORT:-8085}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${DELIVERY_APP_PORT:-8085}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=examination_service,delivery_service,response_service,public
      OTEL_SERVICE_NAME: exam-delivery-service
    depends_on:
      <<: *depends-macro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${DELIVERY_APP_PORT:-8085}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # Macro 4: Assessment & Analytics (Evaluation, Result, Analytics)
  # ===========================================================================
  assessment-service:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: assessment-app
    image: localhost:5000/exam/assessment-app:latest
    container_name: exam-assessment-service
    ports:
      - "${ASSESSMENT_PORT:-8089}:${ASSESSMENT_PORT:-8089}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${ASSESSMENT_PORT:-8089}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=evaluation_service,result_service,analytics_service,public
      OTEL_SERVICE_NAME: assessment-service
      SCORECARD_STORAGE_MODE: local
      SCORECARD_STORAGE_PATH: /data/scorecards
      SCORECARD_STORAGE_BUCKET: exam-platform-scorecards
    depends_on:
      <<: *depends-macro
    volumes:
      - scorecard_storage:/data/scorecards
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${ASSESSMENT_PORT:-8089}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # Macro 5: Audit Service (Stand-alone audit append-only log)
  # ===========================================================================
  audit-service:
    <<: *service-common
    build:
      context: ../../
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: audit-service
    image: localhost:5000/exam/audit-service:latest
    container_name: exam-audit-service
    ports:
      - "${AUDIT_SERVICE_PORT:-8091}:${AUDIT_SERVICE_PORT:-8091}"
    environment:
      <<: *spring-macro-env
      SERVER_PORT: ${AUDIT_SERVICE_PORT:-8091}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exam_platform}?currentSchema=audit_service
      OTEL_SERVICE_NAME: audit-service
    depends_on:
      <<: *depends-macro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${AUDIT_SERVICE_PORT:-8091}/actuator/health || exit 1"]
      <<: *healthcheck-spring

  # ===========================================================================
  # Frontend — Admin Portal SPA (Nx Workspace / Angular 22)
  # ===========================================================================
  frontend:
    <<: *service-common
    build:
      context: ../../nag-frontend-workspace
      dockerfile: Dockerfile
      args:
        APP_NAME: admin-portal
    image: localhost:5000/exam/admin-portal:latest
    container_name: exam-frontend
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # Candidate Frontend — Delivery Console SPA (Nx Workspace / Angular 22)
  # ===========================================================================
  candidate-frontend:
    <<: *service-common
    build:
      context: ../../nag-frontend-workspace
      dockerfile: Dockerfile
      args:
        APP_NAME: candidate-delivery
    image: localhost:5000/exam/candidate-delivery:latest
    container_name: exam-candidate-frontend
    ports:
      - "4300:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # Public Verifier — Credential & Proof Verifier SPA (Nx Workspace / Angular 22)
  # ===========================================================================
  public-verifier:
    <<: *service-common
    build:
      context: ../../nag-frontend-workspace
      dockerfile: Dockerfile
      args:
        APP_NAME: public-verifier
    image: localhost:5000/exam/public-verifier:latest
    container_name: exam-public-verifier
    ports:
      - "4400:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rabbitmq_data:
  asset_storage:
  scorecard_storage:
