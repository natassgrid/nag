# =============================================================================
# Docker Compose Overlay — E2E Test Infrastructure
#
# Extends the monolith stack to add WireMock (external API stubs) and MailHog
# (SMTP capture) for deterministic end-to-end integration testing.
#
# Usage (layer on top of base + monolith overlays):
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.monolith.yml \
#     -f docker-compose.e2e.yml \
#     up -d
#
# Ports exposed on host:
#   8089  — WireMock HTTP stub server  (admin UI: http://localhost:8089/__admin)
#   8025  — MailHog web UI             (http://localhost:8025)
#   1025  — MailHog SMTP capture port  (SMTP sink, not a real relay)
# =============================================================================

networks:
  # Re-declare exam-network as external so this overlay can attach services
  # to the network created by the base docker-compose.yml.
  exam-network:
    external: true

services:

  # ===========================================================================
  # WireMock 3.13.0 — HTTP stub server for third-party API simulation
  # Stubs: DigiLocker KYC, SMS gateway (MSG91), payment callbacks, etc.
  # Admin API: http://localhost:8089/__admin/mappings
  #
  # Volume layout (--root-dir=/home/wiremock):
  #   ./wiremock/mappings/  → /home/wiremock/mappings/   (stub JSON, ro)
  #   ./wiremock/__files/   → /home/wiremock/__files/    (body files, ro)
  #
  # Healthcheck: WireMock 3.x Docker image is distroless (no wget/curl).
  # We use the built-in Java healthcheck flag instead.
  # ===========================================================================
  wiremock:
    image: wiremock/wiremock:3.13.0
    container_name: exam-e2e-wiremock
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      # Stub mapping JSON files (loaded at startup)
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      # Response body files referenced by bodyFileName in stub JSONs
      - ./wiremock/__files:/home/wiremock/__files:ro
    command:
      - "--port=8080"
      - "--verbose"
      - "--root-dir=/home/wiremock"
      - "--enable-stub-cors"
      - "--healthcheck-enabled"
    # WireMock 3.x image is distroless (no shell/wget/curl).
    # Use TCP-level probe against the HTTP port as the healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - exam-network

  # ===========================================================================
  # MailHog v1.0.1 — SMTP capture server for outbound email assertions
  # Web UI : http://localhost:8025
  # SMTP   : mailhog:1025 (inside the exam-network)
  # REST API: http://localhost:8025/api/v2/messages (for test assertions)
  # ===========================================================================
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: exam-e2e-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI / REST API
      - "1025:1025"   # SMTP sink
    # MailHog image has no wget/curl either — use TCP probe.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8025 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 8s
    networks:
      - exam-network

  # ===========================================================================
  # monolith-app override — re-route external integrations to local mocks.
  # All keys here are merged on top of docker-compose.monolith.yml values.
  #
  # depends_on uses service_started (not service_healthy) so the monolith
  # can boot even if WireMock/MailHog are still initialising. The monolith
  # only calls these services at request-time, not at startup.
  # ===========================================================================
  monolith-app:
    environment:
      # --- Email: route to MailHog SMTP sink ---
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"

      # --- SMS: disabled in E2E mode (WireMock covers OTP delivery assertions) ---
      SMS_ENABLED: "false"

      # --- E2E mode flags ---
      # E2E_MODE activates the /internal/e2e/reset endpoint.
      E2E_MODE: "true"
      # Shared secret that authorises the /internal/e2e/reset call.
      # DO NOT use this value outside local/CI E2E environments.
      E2E_RESET_TOKEN: e2e-reset-secret-do-not-use-in-production

      # --- Third-party API base URL overrides (point to WireMock) ---
      DIGILOCKER_BASE_URL: http://wiremock:8080/digilocker
      MSG91_BASE_URL: http://wiremock:8080
    depends_on:
      # service_started: monolith boots immediately; mocks are available
      # before any test request reaches them.
      wiremock:
        condition: service_started
      mailhog:
        condition: service_started
