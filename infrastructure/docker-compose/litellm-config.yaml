# LiteLLM Proxy Configuration
# Unified LLM Gateway for the Exam Platform
# Docs: https://docs.litellm.ai/docs/proxy/configs
#
# Model Strategy:
#   - EASY difficulty    → Amazon Nova Micro (or local fallback: qwen2.5:1.5b / llama3.2:1b)
#   - MEDIUM difficulty  → Amazon Nova Lite  (or local fallback: qwen2.5:1.5b)
#   - HARD difficulty    → Amazon Nova Lite  (or local fallback: qwen2-math:1.5b / qwen2.5:1.5b)
#   - Embeddings         → all-minilm via Ollama
#
# Bedrock models use AWS service account credentials if configured in environment,
# with Ollama models providing zero-cost local inference during local dev and testing.

model_list:
  # ─── Embedding Model (local via Ollama) ────────────────────────────────────
  - model_name: all-minilm
    litellm_params:
      model: ollama/all-minilm
      api_base: http://ollama:11434

  # ─── Local Ollama Models (offline & local development) ─────────────────────
  # Pulled automatically via docker-compose ollama-pull service
  - model_name: qwen2.5:1.5b
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: http://ollama:11434

  - model_name: qwen2-math:1.5b
    litellm_params:
      model: ollama/qwen2-math:1.5b
      api_base: http://ollama:11434

  - model_name: llama3.2:1b
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: http://ollama:11434

  # ─── Local Model Convenience Aliases ───────────────────────────────────────
  - model_name: local-easy
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: http://ollama:11434

  - model_name: local-medium
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: http://ollama:11434

  - model_name: local-math
    litellm_params:
      model: ollama/qwen2-math:1.5b
      api_base: http://ollama:11434

  # Qwen3 8B dense reasoning model via Ollama
  - model_name: qwen3:8b
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434

  # Qwen2.5-VL 7B Multimodal Vision-Language Model via Ollama (OpenAI-compatible route)
  # Supports both official Ollama tag 'qwen2.5vl:7b' and hyphenated alias 'qwen2.5-vl:7b'
  - model_name: qwen2.5-vl:7b
    litellm_params:
      model: openai/qwen2.5vl:7b
      api_base: http://ollama:11434/v1
      api_key: ollama
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192

  - model_name: qwen2.5vl:7b
    litellm_params:
      model: openai/qwen2.5vl:7b
      api_base: http://ollama:11434/v1
      api_key: ollama
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192

  # ─── Question Paper PDF Extraction Models (Dev/Testing & Cloud) ────────────
  # Vision/Multimodal route for scanned PDF pages, formulas, diagrams & tables
  - model_name: paper-extract-vision
    litellm_params:
      model: openai/qwen2.5vl:7b
      api_base: http://ollama:11434/v1
      api_key: ollama
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192

  # Text/Math route for digital PDF streams and LaTeX/JSON normalization
  - model_name: paper-extract-text
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192

  # ─── AWS Bedrock Models (question generation in cloud/staging) ─────────────
  # Uses service account credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
  # passed via environment variables to the LiteLLM container.

  # Amazon Nova Micro — fast, cost-efficient for EASY difficulty questions
  - model_name: nova-micro
    litellm_params:
      model: bedrock/amazon.nova-micro-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  # Amazon Nova Lite — balanced for MEDIUM and HARD difficulty questions
  - model_name: nova-lite
    litellm_params:
      model: bedrock/amazon.nova-lite-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  # ─── Google Gemini Models (AI Studio via GEMINI_API_KEY) ───────────────────
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # Direct model names mapping to the same Gemini endpoints
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  # ─── Google Gemini Models (Vertex AI Enterprise Path) ─────────────────────
  - model_name: vertex-gemini-pro
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION

  - model_name: vertex-gemini-flash
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION

  - model_name: vertex-gemini-flash-lite
    litellm_params:
      model: vertex_ai/gemini-2.5-flash-lite
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION

router_settings:
  model_group_alias:
    "easy": "nova-micro"
    "medium": "nova-lite"
    "hard": "nova-lite"
  fallbacks:
    # Vision fallback route: ONLY multimodal models supporting image inputs.
    # Text-only models like qwen3:8b are strictly excluded from this list.
    # Cloud fallbacks (gemini-2.5-flash, gemini-flash) only kick in when GEMINI_API_KEY is configured.
    - "paper-extract-vision": ["gemini-2.5-flash", "gemini-flash", "nova-lite"]
    - "paper-extract-text": ["qwen3:8b", "qwen2.5:1.5b", "gemini-flash-lite", "nova-micro"]
    - "gemini-pro": ["nova-lite", "qwen2-math:1.5b", "qwen2.5:1.5b"]
    - "gemini-flash": ["nova-lite", "qwen2.5:1.5b"]
    - "gemini-flash-lite": ["nova-micro", "llama3.2:1b"]
    - "gemini-2.5-pro": ["nova-lite", "qwen2-math:1.5b", "qwen2.5:1.5b"]
    - "gemini-2.5-flash": ["nova-lite", "qwen2.5:1.5b"]
    - "gemini-2.5-flash-lite": ["nova-micro", "llama3.2:1b"]
    - "vertex-gemini-pro": ["gemini-pro", "nova-lite", "qwen2.5:1.5b"]
    - "vertex-gemini-flash": ["gemini-flash", "nova-lite", "qwen2.5:1.5b"]
    - "vertex-gemini-flash-lite": ["gemini-flash-lite", "nova-micro", "llama3.2:1b"]
    - "nova-micro": ["gemini-flash-lite", "llama3.2:1b"]
    - "nova-lite": ["gemini-flash", "qwen2.5:1.5b"]

general_settings:
  master_key: sk-litellm-dev-key
  drop_params: true

litellm_settings:
  num_retries: 2
  request_timeout: 900
  set_verbose: false
  drop_params: true
