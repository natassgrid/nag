# LiteLLM Proxy Configuration
# Unified LLM Gateway for the Exam Platform
# Docs: https://docs.litellm.ai/docs/proxy/configs
#
# Model Strategy:
#   - EASY difficulty    → Amazon Nova Micro (or local fallback: qwen2.5:1.5b / llama3.2:1b)
#   - MEDIUM difficulty  → Amazon Nova Lite  (or local fallback: qwen2.5:1.5b)
#   - HARD difficulty    → Amazon Nova Lite  (or local fallback: qwen2-math:1.5b / qwen2.5:1.5b)
#   - Embeddings         → all-minilm via Ollama
#
# Bedrock models use AWS service account credentials if configured in environment,
# with Ollama models providing zero-cost local inference during local dev and testing.

model_list:
  # ─── Embedding Model (local via Ollama) ────────────────────────────────────
  - model_name: all-minilm
    litellm_params:
      model: ollama/all-minilm
      api_base: http://ollama:11434

  # ─── Local Ollama Models (offline & local development) ─────────────────────
  # Pulled automatically via docker-compose ollama-pull service
  - model_name: qwen2.5:1.5b
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: http://ollama:11434

  - model_name: qwen2-math:1.5b
    litellm_params:
      model: ollama/qwen2-math:1.5b
      api_base: http://ollama:11434

  - model_name: llama3.2:1b
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: http://ollama:11434

  # ─── Local Model Convenience Aliases ───────────────────────────────────────
  - model_name: local-easy
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: http://ollama:11434

  - model_name: local-medium
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: http://ollama:11434

  - model_name: local-math
    litellm_params:
      model: ollama/qwen2-math:1.5b
      api_base: http://ollama:11434

  # ─── AWS Bedrock Models (question generation in cloud/staging) ─────────────
  # Uses service account credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
  # passed via environment variables to the LiteLLM container.

  # Amazon Nova Micro — fast, cost-efficient for EASY difficulty questions
  - model_name: nova-micro
    litellm_params:
      model: bedrock/amazon.nova-micro-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  # Amazon Nova Lite — balanced for MEDIUM and HARD difficulty questions
  - model_name: nova-lite
    litellm_params:
      model: bedrock/amazon.nova-lite-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

router_settings:
  model_group_alias:
    "easy": "nova-micro"
    "medium": "nova-lite"
    "hard": "nova-lite"

general_settings:
  master_key: sk-litellm-dev-key
  drop_params: true

litellm_settings:
  num_retries: 2
  request_timeout: 900
  set_verbose: false
  drop_params: true
