# LiteLLM Proxy Configuration
# Unified LLM Gateway for the Exam Platform
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # ─── Embedding Models (local via Ollama) ───────────────────────────────────
  - model_name: all-minilm
    litellm_params:
      model: ollama/all-minilm
      api_base: http://ollama:11434

  # ─── Chat/Completion Models (local via Ollama) ─────────────────────────────

  # Balanced/Structured output — general question generation
  - model_name: qwen2.5-1.5b
    litellm_params:
      model: ollama/qwen2.5:1.5b
      api_base: http://ollama:11434

  # Math & Science specialist — math/physics/chemistry questions
  - model_name: qwen2-math-1.5b
    litellm_params:
      model: ollama/qwen2-math:1.5b
      api_base: http://ollama:11434

  # Fast trivia — history, geography, sports, current affairs
  - model_name: llama3.2-1b
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: http://ollama:11434

  # ─── External Models (uncomment and set API keys as needed) ────────────────
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

  # - model_name: claude-sonnet
  #   litellm_params:
  #     model: anthropic/claude-sonnet-4-20250514
  #     api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: sk-litellm-dev-key
  drop_params: true

litellm_settings:
  num_retries: 2
  request_timeout: 900
  set_verbose: false
  drop_params: true
