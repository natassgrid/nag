plugins {
    id 'java'
}

version = '0.0.1-SNAPSHOT'

dependencies {
    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    testImplementation 'io.rest-assured:json-path:5.5.0'
    testImplementation 'io.rest-assured:json-schema-validator:5.5.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'com.github.tomakehurst:wiremock-standalone:3.10.0'
    testImplementation 'org.postgresql:postgresql:42.7.4'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
    testImplementation 'io.lettuce:lettuce-core:6.5.0.RELEASE'
    testImplementation 'org.keycloak:keycloak-admin-client:26.0.7'
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
    testImplementation 'ch.qos.logback:logback-classic:1.5.12'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
    // Tests require running Docker stack — skip in standard unit test phase
    // Run explicitly with: ./gradlew :e2e-tests:test -PrunE2E
    if (!project.hasProperty('runE2E')) {
        exclude '**/*E2ETest*'
    }
}
