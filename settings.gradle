/*
 * Open Source Government Examination Platform
 * Root Gradle settings — declares all backend service subprojects
 */
rootProject.name = 'exam-platform'

// ── Backend modules ──────────────────────────────────────────────────────────
include 'backend:shared-lib'
include 'backend:identity-service'
include 'backend:candidate-service'
include 'backend:question-bank-service'
include 'backend:translation-service'
include 'backend:examination-service'
include 'backend:paper-generator'
include 'backend:delivery-service'
include 'backend:response-service'
include 'backend:evaluation-service'
include 'backend:result-service'
include 'backend:audit-service'
include 'backend:notification-service'
include 'backend:admin-service'
include 'backend:analytics-service'
include 'backend:api-gateway'

// ── Plugin management ─────────────────────────────────────────────────────────
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

// ── Dependency resolution management ─────────────────────────────────────────
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}
