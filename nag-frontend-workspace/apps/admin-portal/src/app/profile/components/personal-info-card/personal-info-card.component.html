<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
  <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100">
    <div>
      <h3 class="text-lg font-bold text-slate-900 tracking-tight flex items-center gap-2">
        <mat-icon class="text-indigo-600 !text-xl !w-5 !h-5">person</mat-icon>
        <span>Personal & Account Details</span>
      </h3>
      <p class="text-xs text-slate-500 mt-0.5">
        Manage your administrative identity, official contact details, and domain specialization.
      </p>
    </div>

    <span class="px-2.5 py-1 rounded-md text-xs font-mono font-semibold bg-slate-100 text-slate-600 border border-slate-200">
      ID: {{ profile().employeeId || profile().id }}
    </span>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Full Name -->
      <div class="space-y-1.5">
        <label for="fullName" class="text-xs font-semibold text-slate-700 uppercase tracking-wider flex items-center justify-between">
          <span>Full Name / Display Name</span>
          <span class="text-[11px] font-normal text-indigo-600">Editable</span>
        </label>
        <div class="relative rounded-lg shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <mat-icon class="!text-base !w-4 !h-4">badge</mat-icon>
          </div>
          <input
            type="text"
            id="fullName"
            name="fullName"
            [ngModel]="fullName()"
            (ngModelChange)="fullName.set($event)"
            required
            placeholder="e.g. Dr. Rajesh Kumar Sharma"
            class="block w-full pl-9 pr-3 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
          />
        </div>
      </div>

      <!-- Email / Username (Read-Only) -->
      <div class="space-y-1.5">
        <label for="email" class="text-xs font-semibold text-slate-700 uppercase tracking-wider flex items-center justify-between">
          <span>Official Email / Username</span>
          <span class="text-[11px] font-normal text-slate-400 flex items-center gap-0.5">
            <mat-icon class="!text-xs !w-3 !h-3">lock</mat-icon> Primary Identity
          </span>
        </label>
        <div class="relative rounded-lg shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <mat-icon class="!text-base !w-4 !h-4">mail</mat-icon>
          </div>
          <input
            type="email"
            id="email"
            name="email"
            [value]="profile().email"
            disabled
            class="block w-full pl-9 pr-3 py-2 text-sm text-slate-500 bg-slate-50 border border-slate-200 rounded-lg cursor-not-allowed select-all"
          />
        </div>
      </div>

      <!-- Phone Number -->
      <div class="space-y-1.5">
        <label for="phoneNumber" class="text-xs font-semibold text-slate-700 uppercase tracking-wider flex items-center justify-between">
          <span>Mobile Number (2FA & SMS Alerts)</span>
          <span class="text-[11px] font-normal text-indigo-600">Editable</span>
        </label>
        <div class="relative rounded-lg shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <mat-icon class="!text-base !w-4 !h-4">phone</mat-icon>
          </div>
          <input
            type="tel"
            id="phoneNumber"
            name="phoneNumber"
            [ngModel]="phoneNumber()"
            (ngModelChange)="phoneNumber.set($event)"
            placeholder="+91 98765 43210"
            class="block w-full pl-9 pr-3 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
          />
        </div>
      </div>

      <!-- Specialization / Domain -->
      <div class="space-y-1.5">
        <label for="specialization" class="text-xs font-semibold text-slate-700 uppercase tracking-wider flex items-center justify-between">
          <span>Domain Specialization / Subject</span>
          <span class="text-[11px] font-normal text-indigo-600">Editable</span>
        </label>
        <div class="relative rounded-lg shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <mat-icon class="!text-base !w-4 !h-4">science</mat-icon>
          </div>
          <input
            type="text"
            id="specialization"
            name="specialization"
            [ngModel]="specialization()"
            (ngModelChange)="specialization.set($event)"
            placeholder="e.g. Physics, Quantitative Reasoning, AI Analytics"
            class="block w-full pl-9 pr-3 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
          />
        </div>
      </div>

      <!-- Department / Ministry -->
      <div class="space-y-1.5">
        <label for="department" class="text-xs font-semibold text-slate-700 uppercase tracking-wider flex items-center justify-between">
          <span>Department / Authority</span>
          <span class="text-[11px] font-normal text-indigo-600">Editable</span>
        </label>
        <div class="relative rounded-lg shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <mat-icon class="!text-base !w-4 !h-4">account_balance</mat-icon>
          </div>
          <input
            type="text"
            id="department"
            name="department"
            [ngModel]="department()"
            (ngModelChange)="department.set($event)"
            placeholder="e.g. National Assessment Grid Central Authority"
            class="block w-full pl-9 pr-3 py-2 text-sm text-slate-900 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
          />
        </div>
      </div>

      <!-- Tenant Boundary (Read-Only) -->
      <div class="space-y-1.5">
        <label for="tenantId" class="text-xs font-semibold text-slate-700 uppercase tracking-wider flex items-center justify-between">
          <span>Tenant Organization Boundary</span>
          <span class="text-[11px] font-normal text-slate-400 flex items-center gap-0.5">
            <mat-icon class="!text-xs !w-3 !h-3">shield</mat-icon> Isolated Tenant
          </span>
        </label>
        <div class="relative rounded-lg shadow-sm">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <mat-icon class="!text-base !w-4 !h-4">corporate_fare</mat-icon>
          </div>
          <input
            type="text"
            id="tenantId"
            name="tenantId"
            [value]="profile().tenantId || 'default'"
            disabled
            class="block w-full pl-9 pr-3 py-2 text-sm text-slate-500 bg-slate-50 border border-slate-200 rounded-lg cursor-not-allowed uppercase font-mono"
          />
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
      <button
        type="button"
        mat-stroked-button
        (click)="onReset()"
        [disabled]="saving()"
        class="!text-slate-700 !border-slate-300 hover:!bg-slate-50 text-xs"
      >
        Reset Form
      </button>
      <button
        type="submit"
        mat-flat-button
        [disabled]="saving()"
        class="!bg-indigo-600 hover:!bg-indigo-700 !text-white text-xs shadow-sm"
      >
        <span class="flex items-center gap-1.5">
          @if (saving()) {
            <mat-icon class="!text-sm !w-4 !h-4 animate-spin">sync</mat-icon>
            <span>Saving Updates...</span>
          } @else {
            <mat-icon class="!text-sm !w-4 !h-4">save</mat-icon>
            <span>Save Profile Changes</span>
          }
        </span>
      </button>
    </div>
  </form>
</div>
