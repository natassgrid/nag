<div class="min-h-screen bg-slate-50 flex flex-col text-slate-800">
  <!-- Top Navigation Bar -->
  @if (!isLoginPage()) {
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-6">
          <a routerLink="/dashboard" class="flex items-center gap-3 font-bold text-lg tracking-tight hover:opacity-90">
            <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-black text-sm">
              NAG
            </span>
            <span>National Assessment Grid</span>
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
              Admin Console
            </span>
          </a>

          <!-- Primary Nav Links -->
          <nav class="hidden md:flex items-center gap-1 text-sm font-medium">
            <a
              routerLink="/dashboard"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              [routerLinkActiveOptions]="{ exact: true }"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Dashboard
            </a>
            <a
              routerLink="/questions"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              [routerLinkActiveOptions]="{ exact: true }"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Question Bank
            </a>
            <a
              routerLink="/questions/authoring"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Authoring
            </a>
            <a
              routerLink="/assets"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Media Assets
            </a>
            <a
              routerLink="/examinations/scheduling"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Scheduling
            </a>
            <a
              routerLink="/examinations/paper-gen"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Paper Assembly
            </a>
            <a
              routerLink="/evaluation/grading"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Evaluation
            </a>
            <a
              routerLink="/reports"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Reports
            </a>
            <a
              routerLink="/audit"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Audit Trail
            </a>
            <a
              routerLink="/users"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Security
            </a>
            <a
              routerLink="/settings"
              routerLinkActive="bg-slate-800 text-white font-semibold"
              class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
            >
              Settings
            </a>
          </nav>
        </div>

        <!-- Right Action Area -->
        <div class="flex items-center gap-3">
          <div class="hidden sm:flex items-center gap-2 text-xs">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span class="text-slate-300 font-mono">{{ authService.userName() }}</span>
          </div>
          <button
            mat-stroked-button
            (click)="handleLogout()"
            class="!text-slate-300 !border-slate-700 !text-xs hover:!text-white"
          >
            Sign Out
          </button>
        </div>
      </div>
    </header>
  }

  <!-- Main Workspace Area -->
  <main class="grow">
    <router-outlet></router-outlet>
  </main>
</div>
