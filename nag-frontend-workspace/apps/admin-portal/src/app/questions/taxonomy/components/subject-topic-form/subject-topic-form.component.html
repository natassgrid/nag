<div class="bg-purple-50 border border-purple-200 rounded-xl p-4 space-y-3">
  <div class="flex items-center justify-between">
    <span class="text-xs font-bold text-purple-900 uppercase">
      Add New Topic to {{ subjectName() }}
    </span>
    <button
      type="button"
      (click)="onClose()"
      class="text-slate-400 hover:text-slate-600"
    >
      <mat-icon class="!text-sm">close</mat-icon>
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div>
      <label [for]="'topic-name-' + subjectId()" class="block text-[11px] font-semibold text-slate-700 uppercase mb-1">
        Topic Name *
      </label>
      <input
        [id]="'topic-name-' + subjectId()"
        type="text"
        [(ngModel)]="newTopicName"
        placeholder="e.g. Thermodynamics &amp; Heat Transfer"
        class="w-full px-3 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 font-medium"
      />
    </div>
    <div>
      <label [for]="'topic-desc-' + subjectId()" class="block text-[11px] font-semibold text-slate-700 uppercase mb-1">
        Topic Description
      </label>
      <input
        [id]="'topic-desc-' + subjectId()"
        type="text"
        [(ngModel)]="newTopicDescription"
        placeholder="e.g. Laws of thermodynamics, entropy, and heat engines."
        class="w-full px-3 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 font-medium"
      />
    </div>
  </div>

  <div class="flex justify-end gap-2">
    <button
      type="button"
      (click)="onClose()"
      class="px-3 py-1 text-xs text-slate-600 hover:text-slate-900 cursor-pointer"
    >
      Cancel
    </button>
    <button
      type="button"
      [disabled]="creating() || !newTopicName.trim()"
      (click)="onSave()"
      class="px-3 py-1 bg-purple-600 hover:bg-purple-700 disabled:opacity-50 text-white text-xs font-bold rounded-lg cursor-pointer"
    >
      {{ creating() ? 'Saving...' : 'Add Topic' }}
    </button>
  </div>
</div>
