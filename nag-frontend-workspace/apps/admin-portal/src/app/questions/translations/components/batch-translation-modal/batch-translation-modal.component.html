@if (isOpen()) {
  <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl border border-slate-200 overflow-hidden">
      <div class="p-6 border-b border-slate-100 bg-slate-900 text-white flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center text-indigo-300">
            <mat-icon>auto_awesome</mat-icon>
          </div>
          <div>
            <h2 class="text-lg font-bold">Trigger AI Batch Translation</h2>
            <p class="text-xs text-slate-400">IndicTrans2 GPU High-Throughput Worker</p>
          </div>
        </div>
        <button mat-icon-button (click)="closeModal.emit()" class="!text-slate-400 hover:!text-white cursor-pointer">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="p-6 space-y-4 text-xs">
        <div>
          <label class="block font-bold uppercase text-slate-700 mb-1">Target Indian Language *</label>
          <select
            [(ngModel)]="batchTargetLang"
            class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold cursor-pointer"
          >
            @for (lang of languages(); track lang.code) {
              <option [value]="lang.code">{{ lang.name }} ({{ lang.nativeName }})</option>
            }
          </select>
        </div>

        <div>
          <label class="block font-bold uppercase text-slate-700 mb-1">Subject Scope Filter</label>
          <select
            [(ngModel)]="batchSubject"
            class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold cursor-pointer"
          >
            <option value="ALL">All Subjects (Full Question Bank)</option>
            @for (s of availableSubjects(); track s) {
              <option [value]="s">{{ s }}</option>
            }
          </select>
        </div>

        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center gap-3">
          <input
            type="checkbox"
            id="overwrite"
            [(ngModel)]="batchOverwrite"
            class="w-4 h-4 rounded text-indigo-600 cursor-pointer"
          />
          <label for="overwrite" class="font-medium text-slate-700 cursor-pointer">
            Overwrite previously approved translations if newer source exists
          </label>
        </div>

        <div class="text-[11px] text-slate-500 bg-blue-50/50 p-3 rounded-xl border border-blue-100 flex items-start gap-2">
          <mat-icon class="!text-sm text-blue-600 shrink-0">info</mat-icon>
          <span>Batch translation processes up to 1,000 questions per chunk with mathematical symbol and LaTeX preservation.</span>
        </div>
      </div>

      <div class="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
        <button mat-button (click)="closeModal.emit()" class="!text-slate-600 font-semibold cursor-pointer">Cancel</button>
        <button
          mat-flat-button
          color="primary"
          (click)="onSubmit()"
          [disabled]="submittingBatch()"
          class="!bg-indigo-600 !text-white !font-bold cursor-pointer"
        >
          @if (submittingBatch()) {
            <mat-spinner diameter="18" class="mr-2"></mat-spinner>
          }
          Start Batch Translation
        </button>
      </div>
    </div>
  </div>
}
