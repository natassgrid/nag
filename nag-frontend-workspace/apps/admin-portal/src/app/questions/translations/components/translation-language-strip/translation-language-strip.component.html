<div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs space-y-2">
  <div class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center justify-between">
    <span>Target Regional Language</span>
    <span class="text-indigo-600 font-semibold">Active: {{ activeLanguageName() }}</span>
  </div>
  <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-thin">
    @for (lang of languages(); track lang.code) {
      <button
        type="button"
        (click)="selectLanguage.emit(lang.code)"
        class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all flex items-center gap-1.5 cursor-pointer"
        [ngClass]="
          selectedLanguage() === lang.code
            ? 'bg-slate-900 text-white border-slate-900 shadow-xs'
            : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
        "
      >
        <span>{{ lang.name }}</span>
        <span class="text-[10px] opacity-75 font-normal">({{ lang.nativeName }})</span>
      </button>
    }
  </div>
</div>
