<div class="admin-login-page min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 flex items-center justify-center p-4">
  <div class="w-full max-w-md space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black text-2xl shadow-lg border border-indigo-400/30">
          NAG
        </div>
        <div class="text-left">
          <h1 class="text-2xl font-black text-white tracking-tight">National Assessment Grid</h1>
          <p class="text-xs text-indigo-300 uppercase tracking-widest font-semibold">Command Console &bull; Security Clearance</p>
        </div>
      </div>
      <p class="text-slate-400 text-xs">Author, Evaluator, Controller & Superadmin Gateway</p>
    </div>

    <!-- Login Box -->
    <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-2xl space-y-6">
      @if (errorMessage()) {
        <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
          <mat-icon class="!text-base leading-none">error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form (ngSubmit)="handleLogin()" class="space-y-4">
        <div>
          <label for="admin-username" class="block text-xs font-bold text-slate-700 uppercase mb-1.5">
            Admin Officer ID / Email
          </label>
          <div class="relative">
            <input
              id="admin-username"
              type="text"
              name="username"
              [(ngModel)]="username"
              placeholder="admin@nag.gov.in"
              required
              class="w-full pl-10 pr-4 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-mono"
            />
            <mat-icon class="absolute left-3 top-2.5 !text-lg text-slate-400">shield</mat-icon>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="admin-password" class="text-xs font-bold text-slate-700 uppercase">
              Access Token / Password
            </label>
            <span class="text-[11px] text-slate-400">Hardware FIDO2 / OIDC</span>
          </div>
          <div class="relative">
            <input
              id="admin-password"
              [type]="showPassword() ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="••••••••••••"
              required
              class="w-full pl-10 pr-10 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-sans"
            />
            <mat-icon class="absolute left-3 top-2.5 !text-lg text-slate-400">lock</mat-icon>
            <button
              type="button"
              (click)="showPassword.set(!showPassword())"
              class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600"
            >
              <mat-icon class="!text-lg">{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>

        <button
          type="submit"
          mat-flat-button
          color="primary"
          [disabled]="loading()"
          class="w-full !py-3 !rounded-xl !text-sm font-bold shadow-md !bg-slate-900 hover:!bg-black !text-white"
        >
          <span class="flex items-center justify-center gap-2">
            <mat-icon class="!text-base">{{ loading() ? 'hourglass_top' : 'fingerprint' }}</mat-icon>
            {{ loading() ? 'Verifying Credentials...' : 'Authenticate Officer Session' }}
          </span>
        </button>
      </form>

      <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500">
        <span class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          Keycloak Single Sign-On
        </span>
        <span class="font-mono">v2.4-monolith</span>
      </div>
    </div>
  </div>
</div>
