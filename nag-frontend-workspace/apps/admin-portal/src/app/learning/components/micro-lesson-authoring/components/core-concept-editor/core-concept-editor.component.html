<div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
        <mat-icon class="!text-lg">lightbulb</mat-icon>
      </div>
      <div>
        <h3 class="text-sm font-bold text-slate-900">Part 1: Core Concept &amp; Mental Model *</h3>
        <p class="text-[11px] text-slate-500">Explain the foundational principle with Markdown and LaTeX ($$...$$).</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="togglePalette()"
        class="px-3 py-1.5 text-xs font-semibold rounded-xl border flex items-center gap-1.5 transition-all cursor-pointer"
        [ngClass]="{
          'bg-indigo-600 text-white border-indigo-600': showPalette(),
          'bg-white text-indigo-600 border-indigo-200 hover:bg-indigo-50': !showPalette()
        }"
      >
        <mat-icon class="!text-sm leading-none">functions</mat-icon>
        <span>{{ showPalette() ? 'Close Symbol Palette' : 'Insert Formula &amp; Chemistry' }}</span>
      </button>

      @if (showWizardTrigger()) {
        <button
          type="button"
          (click)="openWizard.emit()"
          data-testid="inline-open-microlesson-wizard-btn"
          title="Pop out editor in Wizard mode"
          aria-label="Pop out editor in Wizard mode"
          class="inline-flex items-center justify-center w-8 h-8 rounded-xl border border-purple-200 bg-purple-50/80 text-purple-700 hover:bg-purple-100 transition-all cursor-pointer"
        >
          <mat-icon class="!text-sm !w-4 !h-4 leading-none flex items-center justify-center">open_in_new</mat-icon>
        </button>
      }
    </div>
  </div>

  @if (showPalette()) {
    <div class="pt-1">
      <nag-formula-symbol-palette
        (symbolSelected)="insertSymbol($event)"
      ></nag-formula-symbol-palette>
    </div>
  }

  <div>
    <textarea
      #conceptTextarea
      id="core-concept-textarea"
      [ngModel]="coreConcept()"
      (ngModelChange)="coreConceptChange.emit($event)"
      rows="6"
      placeholder="e.g. By the Work-Energy Theorem, the net work done by all forces acting on a particle equals its change in kinetic energy: $$W_{\text{net}} = \Delta K = \frac{1}{2}mv_f^2 - \frac{1}{2}mv_i^2$$"
      class="w-full font-mono text-xs p-3.5 bg-slate-50 border rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors"
      [ngClass]="{
        'border-rose-300': isInvalid(),
        'border-slate-200': !isInvalid()
      }"
    ></textarea>
    @if (isInvalid()) {
      <p class="text-[11px] text-rose-600 mt-1 flex items-center gap-1 font-medium">
        <mat-icon class="!text-xs leading-none">error_outline</mat-icon>
        Core concept explanation is required before saving.
      </p>
    }
  </div>
</div>
