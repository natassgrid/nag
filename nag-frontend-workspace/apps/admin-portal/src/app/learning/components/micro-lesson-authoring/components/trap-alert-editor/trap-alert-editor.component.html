<div class="bg-white rounded-2xl border border-amber-200/80 p-5 shadow-xs space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-100 pb-3">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center shrink-0">
        <mat-icon class="!text-lg">warning_amber</mat-icon>
      </div>
      <div>
        <h3 class="text-sm font-bold text-slate-900">Part 2: Exam Trap &amp; Common Misconception *</h3>
        <p class="text-[11px] text-slate-500">Highlight where candidates lose marks and how to avoid the pitfall.</p>
      </div>
    </div>

    <button
      type="button"
      (click)="togglePalette()"
      class="px-3 py-1.5 text-xs font-semibold rounded-xl border flex items-center gap-1.5 transition-all cursor-pointer"
      [ngClass]="{
        'bg-amber-600 text-white border-amber-600': showPalette(),
        'bg-white text-amber-700 border-amber-200 hover:bg-amber-50': !showPalette()
      }"
    >
      <mat-icon class="!text-sm leading-none">functions</mat-icon>
      <span>{{ showPalette() ? 'Close Palette' : 'Insert Symbol' }}</span>
    </button>
  </div>

  @if (showPalette()) {
    <div class="pt-1">
      <nag-formula-symbol-palette
        (symbolSelected)="insertSymbol($event)"
      ></nag-formula-symbol-palette>
    </div>
  }

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <div class="md:col-span-2">
      <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">
        Trap Headline / Title
      </label>
      <input
        type="text"
        [ngModel]="trapAlert().title"
        (ngModelChange)="updateField('title', $event)"
        placeholder="e.g. Sign Convention Error in Non-Inertial Frames"
        class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500"
      />
    </div>

    <div class="md:col-span-2">
      <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">
        Core Trap Warning (Markdown + LaTeX) *
      </label>
      <textarea
        id="trap-description-textarea"
        [ngModel]="trapAlert().description"
        (ngModelChange)="updateField('description', $event)"
        (focus)="activeField.set('description')"
        rows="3"
        placeholder="Describe the exam trap or distractor pattern..."
        class="w-full font-mono text-xs p-3 bg-amber-50/30 border border-amber-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500"
      ></textarea>
    </div>

    <div>
      <label class="block text-[11px] font-bold text-amber-800 uppercase mb-1">
        Common Misconception (Optional)
      </label>
      <textarea
        [ngModel]="trapAlert().commonMistake || ''"
        (ngModelChange)="updateField('commonMistake', $event)"
        (focus)="activeField.set('commonMistake')"
        rows="2"
        placeholder="What candidates mistakenly assume..."
        class="w-full font-mono text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500"
      ></textarea>
    </div>

    <div>
      <label class="block text-[11px] font-bold text-emerald-800 uppercase mb-1">
        Correct Approach (Optional)
      </label>
      <textarea
        [ngModel]="trapAlert().correctApproach || ''"
        (ngModelChange)="updateField('correctApproach', $event)"
        (focus)="activeField.set('correctApproach')"
        rows="2"
        placeholder="How to solve it accurately..."
        class="w-full font-mono text-xs p-2.5 bg-emerald-50/30 border border-emerald-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"
      ></textarea>
    </div>
  </div>
</div>
