<div class="p-6 max-w-xl w-full space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between border-b border-slate-200 pb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600">
        <mat-icon class="!text-xl">psychology</mat-icon>
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-900">Generate Remedial Micro-Lesson</h2>
        <p class="text-xs text-slate-500">Synthesize AI-powered remedial lesson with custom context notes</p>
      </div>
    </div>
    <button type="button" (click)="onCancel()" class="text-slate-400 hover:text-slate-600 cursor-pointer">
      <mat-icon class="!text-xl">close</mat-icon>
    </button>
  </div>

  @if (errorMessage()) {
    <div class="p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs flex items-center gap-2">
      <mat-icon class="!text-base">error_outline</mat-icon>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <!-- Mode Selector -->
  <div class="bg-slate-50 p-2 rounded-xl border border-slate-200 flex items-center gap-2">
    <button
      type="button"
      (click)="mode.set('SINGLE')"
      [class.bg-white]="mode() === 'SINGLE'"
      [class.shadow-xs]="mode() === 'SINGLE'"
      [class.text-indigo-700]="mode() === 'SINGLE'"
      [class.font-bold]="mode() === 'SINGLE'"
      class="flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold text-slate-600 transition-all cursor-pointer flex items-center justify-center gap-1.5"
    >
      <mat-icon class="!text-sm">auto_awesome</mat-icon>
      <span>Single Subtopic (Recommended)</span>
    </button>
    <button
      type="button"
      disabled
      title="Batch generation disabled on developer account quota limits"
      class="flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold text-slate-400 opacity-60 cursor-not-allowed flex items-center justify-center gap-1.5"
    >
      <mat-icon class="!text-sm">playlist_add</mat-icon>
      <span>Batch Syllabus (Quota Limited)</span>
    </button>
  </div>

  <!-- Form Fields -->
  <div class="space-y-4 text-xs font-medium text-slate-700">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block mb-1 text-slate-600 font-semibold">Subject</label>
        <input
          type="text"
          [ngModel]="subject()"
          (ngModelChange)="subject.set($event)"
          placeholder="e.g. Physics"
          class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-indigo-500 text-xs"
        />
      </div>
      <div>
        <label class="block mb-1 text-slate-600 font-semibold">Target Examination</label>
        <select
          [ngModel]="targetExam()"
          (ngModelChange)="targetExam.set($event)"
          class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-indigo-500 text-xs"
        >
          @for (opt of examOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
    </div>

    <div>
      <label class="block mb-1 text-slate-600 font-semibold">Topic Hierarchy</label>
      <input
        type="text"
        [ngModel]="topic()"
        (ngModelChange)="topic.set($event)"
        placeholder="e.g. Rotational Mechanics"
        class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-indigo-500 text-xs"
      />
    </div>

    <div>
      <label class="block mb-1 text-slate-600 font-semibold">
        Subtopic Name <span class="text-rose-500">*</span>
      </label>
      <input
        type="text"
        [ngModel]="subtopic()"
        (ngModelChange)="subtopic.set($event)"
        placeholder="e.g. Moment of Inertia of Composite Bodies"
        class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-indigo-500 text-xs"
      />
    </div>

    <div>
      <label class="block mb-1 text-slate-600 font-semibold">
        Faculty Context / Custom Reference Text (Optional)
      </label>
      <textarea
        rows="3"
        [ngModel]="referenceText()"
        (ngModelChange)="referenceText.set($event)"
        placeholder="Provide key formulas, derivations, common misconceptions or reference notes for the LLM..."
        class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-indigo-500 text-xs resize-none"
      ></textarea>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
    <button
      type="button"
      mat-stroked-button
      (click)="onCancel()"
      [disabled]="isGenerating()"
      class="!rounded-xl !text-xs !border-slate-300"
    >
      Cancel
    </button>
    <button
      type="button"
      mat-flat-button
      color="primary"
      (click)="onGenerate()"
      [disabled]="isGenerating() || !subtopic().trim()"
      class="!rounded-xl !text-xs !font-bold flex items-center gap-2 !px-4 !py-2"
    >
      @if (isGenerating()) {
        <mat-progress-spinner diameter="16" mode="indeterminate"></mat-progress-spinner>
        <span>Synthesizing...</span>
      } @else {
        <mat-icon class="!text-sm">auto_awesome</mat-icon>
        <span>Generate Micro-Lesson</span>
      }
    </button>
  </div>
</div>
