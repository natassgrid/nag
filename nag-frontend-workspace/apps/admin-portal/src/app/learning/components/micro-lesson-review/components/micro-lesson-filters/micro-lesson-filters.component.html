<div class="bg-white p-4 rounded-xl border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4 shadow-xs">
  <!-- Search Input -->
  <div class="flex items-center gap-2 w-full md:w-80 px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl">
    <mat-icon class="text-slate-400 !w-4 !h-4 !text-base !leading-none flex items-center justify-center shrink-0">search</mat-icon>
    <input
      type="text"
      [ngModel]="searchQuery()"
      (ngModelChange)="searchChange.emit($event)"
      placeholder="Search subtopic, topic, subject..."
      class="bg-transparent text-xs text-slate-800 placeholder:text-slate-400 focus:outline-none w-full font-medium"
    />
    @if (searchQuery().trim()) {
      <button
        type="button"
        (click)="searchChange.emit('')"
        class="text-slate-400 hover:text-slate-600 cursor-pointer flex items-center justify-center shrink-0"
      >
        <mat-icon class="!w-4 !h-4 !text-base !leading-none flex items-center justify-center shrink-0">close</mat-icon>
      </button>
    }
  </div>

  <!-- Taxonomy Filters (Dynamic Subject & Topic from DB) -->
  <div class="flex items-center gap-2 flex-wrap">
    <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
      <span class="text-[11px] font-bold text-slate-400 uppercase">Subject:</span>
      <select
        [ngModel]="selectedSubject()"
        (ngModelChange)="subjectChange.emit($event)"
        class="bg-transparent text-xs text-slate-700 font-semibold focus:outline-none cursor-pointer"
      >
        @for (subj of distinctSubjects(); track subj) {
          <option [value]="subj">{{ subj === 'ALL' ? 'All Subjects' : subj }}</option>
        }
      </select>
    </div>

    <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
      <span class="text-[11px] font-bold text-slate-400 uppercase">Topic:</span>
      <select
        [ngModel]="selectedTopic()"
        (ngModelChange)="topicChange.emit($event)"
        class="bg-transparent text-xs text-slate-700 font-semibold focus:outline-none cursor-pointer"
      >
        @for (tpc of distinctTopics(); track tpc) {
          <option [value]="tpc">{{ tpc === 'ALL' ? 'All Topics' : tpc }}</option>
        }
      </select>
    </div>

    <!-- Status Filter Buttons -->
    <div class="flex items-center bg-slate-100 p-1 rounded-xl flex-wrap gap-1">
      @for (opt of statusOptions(); track opt.value) {
        <button
          type="button"
          (click)="statusChange.emit(opt.value)"
          [class.bg-white]="statusFilter() === opt.value"
          [class.shadow-xs]="statusFilter() === opt.value"
          class="px-2.5 py-1 text-xs font-semibold rounded-lg transition-all text-slate-700 cursor-pointer"
        >
          {{ opt.label }}
        </button>
      }
    </div>
  </div>
</div>
