@if (selectedCount() > 0) {
  <div class="bg-slate-900 text-white px-5 py-3 rounded-2xl flex flex-wrap items-center justify-between gap-3 shadow-lg sticky top-4 z-20">
    <div class="flex items-center gap-3">
      <span class="w-6 h-6 rounded-full bg-purple-600 flex items-center justify-center font-bold text-xs">
        {{ selectedCount() }}
      </span>
      <span class="text-xs font-semibold">
        {{ selectedCount() }} micro-lesson{{ selectedCount() > 1 ? 's' : '' }} selected
      </span>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <button
        type="button"
        (click)="bulkSubmit.emit('APPROVE')"
        [disabled]="isBulkSubmitting() || isBulkDeleting()"
        class="px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold cursor-pointer transition-all disabled:opacity-50"
      >
        Approve Selected
      </button>
      <button
        type="button"
        (click)="bulkSubmit.emit('PUBLISH')"
        [disabled]="isBulkSubmitting() || isBulkDeleting()"
        class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer transition-all disabled:opacity-50"
      >
        Publish Selected
      </button>
      <button
        type="button"
        (click)="bulkSubmit.emit('REJECT')"
        [disabled]="isBulkSubmitting() || isBulkDeleting()"
        class="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold cursor-pointer transition-all disabled:opacity-50"
      >
        Reject Selected
      </button>
      <button
        type="button"
        (click)="bulkDelete.emit()"
        [disabled]="isBulkSubmitting() || isBulkDeleting()"
        class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold cursor-pointer transition-all disabled:opacity-50 flex items-center gap-1.5"
      >
        @if (isBulkDeleting()) {
          <mat-progress-spinner diameter="14" mode="indeterminate" class="!inline-block"></mat-progress-spinner>
          <span>Deleting...</span>
        } @else {
          <mat-icon class="!text-sm leading-none">delete</mat-icon>
          <span>Delete Selected</span>
        }
      </button>
      <button
        type="button"
        (click)="clearSelection.emit()"
        class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium cursor-pointer"
      >
        Deselect All
      </button>
    </div>
  </div>
}
