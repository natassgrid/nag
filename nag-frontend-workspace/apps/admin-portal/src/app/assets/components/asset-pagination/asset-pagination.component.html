<div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white px-5 py-3.5 rounded-2xl border border-slate-200 text-xs">
  <div class="text-slate-500 font-medium">
    Showing
    <span class="font-bold text-slate-800">{{ fromItem() }}</span>
    to
    <span class="font-bold text-slate-800">{{ toItem() }}</span>
    of
    <span class="font-bold text-slate-800">{{ totalElements() }}</span>
    assets
  </div>

  <div class="flex items-center gap-4">
    <!-- Page size selector -->
    <div class="flex items-center gap-2 text-slate-500">
      <label for="asset-page-size" class="text-xs">Per page:</label>
      <select
        id="asset-page-size"
        [value]="pageSize()"
        (change)="onPageSizeChange($event)"
        class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-lg px-2 py-1 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500/20 cursor-pointer"
      >
        @for (opt of pageSizeOptions; track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </select>
    </div>

    <!-- Navigation buttons -->
    <div class="flex items-center gap-1">
      <button
        mat-icon-button
        [disabled]="currentPage() === 0"
        (click)="pageChange.emit(0)"
        class="!w-8 !h-8 !rounded-lg cursor-pointer"
        title="First Page"
      >
        <mat-icon class="!text-sm">first_page</mat-icon>
      </button>
      <button
        mat-icon-button
        [disabled]="currentPage() === 0"
        (click)="pageChange.emit(currentPage() - 1)"
        class="!w-8 !h-8 !rounded-lg cursor-pointer"
        title="Previous Page"
      >
        <mat-icon class="!text-sm">chevron_left</mat-icon>
      </button>

      <span class="text-slate-600 font-semibold px-2 whitespace-nowrap">
        Page {{ currentPage() + 1 }} of {{ totalPages() || 1 }}
      </span>

      <button
        mat-icon-button
        [disabled]="currentPage() + 1 >= totalPages()"
        (click)="pageChange.emit(currentPage() + 1)"
        class="!w-8 !h-8 !rounded-lg cursor-pointer"
        title="Next Page"
      >
        <mat-icon class="!text-sm">chevron_right</mat-icon>
      </button>
      <button
        mat-icon-button
        [disabled]="currentPage() + 1 >= totalPages()"
        (click)="pageChange.emit(lastPageNumber())"
        class="!w-8 !h-8 !rounded-lg cursor-pointer"
        title="Last Page"
      >
        <mat-icon class="!text-sm">last_page</mat-icon>
      </button>
    </div>
  </div>
</div>
