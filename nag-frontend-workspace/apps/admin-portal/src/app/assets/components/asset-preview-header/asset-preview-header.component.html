<div class="flex items-center justify-between pb-4 border-b border-slate-200">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600">
      @switch (asset().assetType) {
        @case ('IMAGE') { <mat-icon>image</mat-icon> }
        @case ('AUDIO') { <mat-icon>audiotrack</mat-icon> }
        @case ('VIDEO') { <mat-icon>videocam</mat-icon> }
        @default { <mat-icon>insert_drive_file</mat-icon> }
      }
    </div>
    <div>
      <h3 class="text-base font-bold text-slate-900 leading-tight">
        {{ asset().originalFilename }}
      </h3>
      <p class="text-xs text-slate-500">
        {{ asset().title || 'No descriptive title set' }}
      </p>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <input #headerFileInput type="file" class="hidden" (change)="fileSelected.emit($event)" />
    <button
      mat-stroked-button
      color="primary"
      class="!text-xs !rounded-xl !h-8"
      (click)="headerFileInput.click()"
      [disabled]="replacing()"
      title="Upload a new file to replace this asset's binary"
    >
      <span class="flex items-center gap-1">
        @if (replacing()) {
          <mat-spinner diameter="14"></mat-spinner>
          <span>Updating...</span>
        } @else {
          <mat-icon class="!text-base mr-1">sync</mat-icon>
          <span>Replace Binary</span>
        }
      </span>
    </button>

    <button mat-icon-button (click)="copyUrl.emit()" title="Copy direct URL">
      <mat-icon class="text-slate-600">content_copy</mat-icon>
    </button>
    <button mat-icon-button (click)="download.emit()" title="Download binary">
      <mat-icon class="text-slate-600">download</mat-icon>
    </button>
    <button mat-icon-button mat-dialog-close title="Close">
      <mat-icon class="text-slate-500">close</mat-icon>
    </button>
  </div>
</div>
