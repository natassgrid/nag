@if (isOpen()) {
  <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex justify-end animate-fadeIn">
    <div class="w-full max-w-lg bg-white h-full shadow-2xl flex flex-col animate-slideLeft overflow-y-auto">
      <!-- Header -->
      <div class="p-6 border-b border-slate-200 flex items-center justify-between sticky top-0 bg-white z-10">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
            <mat-icon>person_add</mat-icon>
          </div>
          <div>
            <h2 class="text-base font-black text-slate-900">
              Invite Authority User
            </h2>
            <p class="text-xs text-slate-500">Dispatch cryptographically signed invitation with TOTP 2FA enrollment</p>
          </div>
        </div>
        <button
          type="button"
          (click)="closeDrawer.emit()"
          class="text-slate-400 hover:text-slate-600 cursor-pointer"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- Form Body -->
      <div class="p-6 space-y-5 flex-1">
        <!-- Full Name -->
        <div>
          <label for="invite-name" class="block text-xs font-bold text-slate-700 uppercase mb-1">
            Full Official Name *
          </label>
          <input
            id="invite-name"
            type="text"
            [ngModel]="formFullName()"
            (ngModelChange)="formFullName.set($event)"
            placeholder="e.g. Dr. Rajesh Kumar Verma"
            class="w-full px-3 py-2.5 text-xs bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-medium"
          />
        </div>

        <!-- Official Email -->
        <div>
          <label for="invite-email" class="block text-xs font-bold text-slate-700 uppercase mb-1">
            Official Email Address *
          </label>
          <input
            id="invite-email"
            type="email"
            [ngModel]="formEmail()"
            (ngModelChange)="formEmail.set($event)"
            placeholder="e.g. rajesh.verma@nag.gov.in"
            class="w-full px-3 py-2.5 text-xs bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-medium font-mono"
          />
        </div>

        <!-- Role Assignment Selection -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">
            Assign RBAC Authority Roles *
          </label>
          <div class="space-y-2">
            @for (role of roles(); track role.id) {
              <div
                (click)="toggleRole(role.name)"
                [ngClass]="{
                  'bg-indigo-50/80 border-indigo-300 ring-1 ring-indigo-500/20': isRoleSelected(role.name),
                  'bg-slate-50 border-slate-200 hover:bg-slate-100/70': !isRoleSelected(role.name)
                }"
                class="p-3 rounded-xl border transition-all cursor-pointer flex items-start gap-3"
              >
                <div class="pt-0.5">
                  <input
                    type="checkbox"
                    [checked]="isRoleSelected(role.name)"
                    (click)="$event.stopPropagation()"
                    (change)="toggleRole(role.name)"
                    class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer"
                  />
                </div>
                <div class="grow">
                  <div class="text-xs font-bold text-slate-900 flex items-center justify-between">
                    <span>{{ role.displayName }}</span>
                    @if (role.systemRole) {
                      <span class="text-[9px] font-bold px-1.5 py-0.2 rounded bg-slate-200 text-slate-700">
                        SYSTEM
                      </span>
                    }
                  </div>
                  <p class="text-[11px] text-slate-500 mt-0.5 leading-normal">
                    {{ role.description }}
                  </p>
                </div>
              </div>
            }
          </div>
        </div>

        <!-- Token Validity Duration -->
        <div>
          <label for="invite-expiry" class="block text-xs font-bold text-slate-700 uppercase mb-1">
            Invitation Link Expiration (Days)
          </label>
          <select
            id="invite-expiry"
            [ngModel]="formExpiryDays()"
            (ngModelChange)="formExpiryDays.set($event)"
            class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-medium"
          >
            <option [value]="1">24 Hours (High Security / Hotfix)</option>
            <option [value]="3">3 Days</option>
            <option [value]="5">5 Days (Standard)</option>
            <option [value]="7">7 Days</option>
            <option [value]="14">14 Days (Regional Batches)</option>
          </select>
        </div>
      </div>

      <!-- Footer -->
      <div class="p-4 border-t border-slate-200 flex justify-end gap-3 sticky bottom-0 bg-white">
        <button
          mat-stroked-button
          (click)="closeDrawer.emit()"
          class="!text-slate-600 cursor-pointer !rounded-xl"
        >
          Cancel
        </button>
        <button
          mat-flat-button
          color="primary"
          [disabled]="isSubmitting() || !formFullName().trim() || !formEmail().trim()"
          (click)="onSubmit()"
          class="cursor-pointer !rounded-xl !bg-indigo-600 hover:!bg-indigo-700 !text-white"
        >
          <span class="flex items-center gap-1.5">
            <mat-icon>{{ isSubmitting() ? 'hourglass_top' : 'send' }}</mat-icon>
            <span>{{ isSubmitting() ? 'Dispatching Invitation...' : 'Dispatch Invitation' }}</span>
          </span>
        </button>
      </div>
    </div>
  </div>
}
