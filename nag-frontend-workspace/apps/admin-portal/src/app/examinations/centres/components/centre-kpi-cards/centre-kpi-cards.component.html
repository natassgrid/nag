<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
  <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between shadow-xs">
    <div>
      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Registered Venues</span>
      <span class="text-2xl font-black text-slate-900">{{ totalCentresCount() }}</span>
    </div>
    <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
      <mat-icon>location_city</mat-icon>
    </div>
  </div>

  <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between shadow-xs">
    <div>
      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Aggregate Seat Capacity</span>
      <span class="text-2xl font-black text-purple-600">{{ totalCapacitySum() | number }}</span>
    </div>
    <div class="w-10 h-10 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center">
      <mat-icon>chair</mat-icon>
    </div>
  </div>

  <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center justify-between shadow-xs">
    <div>
      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Active Venues</span>
      <span class="text-2xl font-black text-emerald-600">{{ activeCentresCount() }}</span>
    </div>
    <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
      <mat-icon>verified</mat-icon>
    </div>
  </div>
</div>
