<div class="bg-white p-4 rounded-xl border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4 shadow-xs">
  <div class="flex items-center gap-2 w-full md:w-80 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
    <mat-icon class="text-slate-400 !text-lg">search</mat-icon>
    <input
      type="text"
      [ngModel]="searchQuery()"
      (ngModelChange)="searchQueryChange.emit($event)"
      placeholder="Filter by venue name, city, district..."
      class="bg-transparent text-xs text-slate-800 placeholder:text-slate-400 focus:outline-none w-full font-medium"
    />
    @if (searchQuery().trim()) {
      <button
        type="button"
        (click)="searchQueryChange.emit('')"
        class="text-slate-400 hover:text-slate-600 cursor-pointer"
      >
        <mat-icon class="!text-sm">close</mat-icon>
      </button>
    }
  </div>

  <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
    <!-- State Selector -->
    @if (uniqueStates().length > 0) {
      <div class="flex items-center gap-1.5 text-xs font-semibold text-slate-600">
        <span>State:</span>
        <select
          [ngModel]="stateFilter()"
          (ngModelChange)="stateFilterChange.emit($event)"
          class="px-2.5 py-1.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium text-xs text-slate-800"
        >
          <option value="ALL">All States</option>
          @for (st of uniqueStates(); track st) {
            <option [value]="st">{{ st }}</option>
          }
        </select>
      </div>
    }

    <!-- Status Filters -->
    <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
      <button
        type="button"
        (click)="statusFilterChange.emit('ALL')"
        [class.bg-white]="statusFilter() === 'ALL'"
        [class.shadow-xs]="statusFilter() === 'ALL'"
        class="px-2.5 py-1 text-xs font-semibold rounded-md transition-all text-slate-700 cursor-pointer"
      >
        All
      </button>
      <button
        type="button"
        (click)="statusFilterChange.emit('ACTIVE')"
        [class.bg-white]="statusFilter() === 'ACTIVE'"
        [class.shadow-xs]="statusFilter() === 'ACTIVE'"
        class="px-2.5 py-1 text-xs font-semibold rounded-md transition-all text-slate-700 cursor-pointer"
      >
        Active
      </button>
      <button
        type="button"
        (click)="statusFilterChange.emit('INACTIVE')"
        [class.bg-white]="statusFilter() === 'INACTIVE'"
        [class.shadow-xs]="statusFilter() === 'INACTIVE'"
        class="px-2.5 py-1 text-xs font-semibold rounded-md transition-all text-slate-700 cursor-pointer"
      >
        Inactive
      </button>
    </div>
  </div>
</div>
