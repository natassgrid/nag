@if (isOpen()) {
  <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex justify-end animate-fadeIn">
    <div class="w-full max-w-xl bg-white h-full shadow-2xl flex flex-col animate-slideLeft overflow-y-auto">
      <!-- Header -->
      <div class="p-6 border-b border-slate-200 flex items-center justify-between sticky top-0 bg-white z-10">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center">
            <mat-icon>add_business</mat-icon>
          </div>
          <div>
            <h2 class="text-base font-black text-slate-900">
              Register New Test Centre
            </h2>
            <p class="text-xs text-slate-500">Add test venue with location hierarchy and terminal capacity</p>
          </div>
        </div>
        <button
          type="button"
          (click)="closeDrawer.emit()"
          class="text-slate-400 hover:text-slate-600 cursor-pointer"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- Form Body -->
      <div class="p-6 space-y-4 flex-1">
        <!-- Venue Name -->
        <div>
          <label for="centre-name" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
            Test Centre Name *
          </label>
          <input
            id="centre-name"
            type="text"
            [(ngModel)]="formCentreName"
            placeholder="e.g. National Institute of Technology - Digital Test Center"
            class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 font-medium"
          />
        </div>

        <!-- Geographic Cascading Selection Sub-component -->
        <nag-centre-location-form
          [countries]="countries()"
          [states]="states()"
          [cities]="cities()"
          [countryId]="formCountryId"
          [stateId]="formStateId"
          [cityId]="formCityId"
          [stateName]="formStateName"
          [cityName]="formCityName"
          [district]="formDistrict"
          (countryChange)="onCountryChanged($event)"
          (stateChange)="onStateChanged($event)"
          (cityChange)="onCityChanged($event)"
          (stateNameChange)="formStateName = $event"
          (cityNameChange)="formCityName = $event"
          (districtChange)="formDistrict = $event"
        ></nag-centre-location-form>

        <!-- Facility & Capacity Sub-component -->
        <nag-centre-facility-form
          [building]="formBuilding"
          [floor]="formFloor"
          [labIdentifier]="formLabIdentifier"
          [totalCapacity]="formTotalCapacity"
          [active]="formActive"
          (buildingChange)="formBuilding = $event"
          (floorChange)="formFloor = $event"
          (labIdentifierChange)="formLabIdentifier = $event"
          (totalCapacityChange)="formTotalCapacity = $event"
          (activeChange)="formActive = $event"
        ></nag-centre-facility-form>
      </div>

      <!-- Footer -->
      <div class="p-4 border-t border-slate-200 flex justify-end gap-3 sticky bottom-0 bg-white">
        <button
          mat-stroked-button
          (click)="closeDrawer.emit()"
          class="!text-slate-600 cursor-pointer"
        >
          Cancel
        </button>
        <button
          mat-flat-button
          color="primary"
          [disabled]="isSaving() || !formCentreName.trim()"
          (click)="onSave()"
          class="cursor-pointer !bg-purple-600 hover:!bg-purple-700 !text-white"
        >
          <span class="flex items-center gap-1">
            <mat-icon>{{ isSaving() ? 'hourglass_top' : 'save' }}</mat-icon>
            <span>{{ isSaving() ? 'Saving...' : 'Register Test Centre' }}</span>
          </span>
        </button>
      </div>
    </div>
  </div>
}
