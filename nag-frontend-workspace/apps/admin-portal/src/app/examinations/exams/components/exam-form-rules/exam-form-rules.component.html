<div class="space-y-3 pt-3 border-t border-slate-200">
  <h3 class="text-xs font-bold text-indigo-900 uppercase tracking-wider">Assessment Rules &amp; Timing</h3>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label for="exam-dur-input" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
        Duration (Minutes) *
      </label>
      <input
        id="exam-dur-input"
        type="number"
        [ngModel]="duration()"
        (ngModelChange)="durationChange.emit($event)"
        min="1"
        class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
      />
    </div>

    <div>
      <label for="exam-tot-marks-input" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
        Total Marks *
      </label>
      <input
        id="exam-tot-marks-input"
        type="number"
        [ngModel]="totalMarks()"
        (ngModelChange)="totalMarksChange.emit($event)"
        min="1"
        class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
      />
    </div>

    <div>
      <label for="exam-nav-policy-select" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
        Navigation Policy
      </label>
      <select
        id="exam-nav-policy-select"
        [ngModel]="navPolicy()"
        (ngModelChange)="navPolicyChange.emit($event)"
        class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
      >
        <option value="FREE_NAVIGATION">Free Navigation (Candidates jump freely)</option>
        <option value="SECTION_LOCKED">Section Locked (Sequential per section)</option>
        <option value="STRICT_SEQUENTIAL">Strict Sequential (No back-tracking)</option>
      </select>
    </div>

    <div>
      <label for="exam-calc-policy-select" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
        Calculator Policy
      </label>
      <select
        id="exam-calc-policy-select"
        [ngModel]="calcPolicy()"
        (ngModelChange)="calcPolicyChange.emit($event)"
        class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
      >
        <option value="NONE">No Calculator Allowed</option>
        <option value="VIRTUAL_BASIC">Virtual Basic Calculator</option>
        <option value="VIRTUAL_SCIENTIFIC">Virtual Scientific Calculator</option>
      </select>
    </div>
  </div>

  <!-- Negative Marking & Toggles -->
  <div class="bg-slate-50 p-4 rounded-xl space-y-3 border border-slate-200">
    <label class="flex items-center gap-2 cursor-pointer select-none">
      <input
        type="checkbox"
        [ngModel]="negMarking()"
        (ngModelChange)="negMarkingChange.emit($event)"
        class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500"
      />
      <span class="text-xs font-bold text-slate-800">Enable Negative Marking Deduction</span>
    </label>

    @if (negMarking()) {
      <div class="pt-2 pl-6">
        <label for="exam-neg-val-input" class="block text-[11px] font-semibold text-slate-600 uppercase mb-1">
          Marks Deducted per Incorrect Answer
        </label>
        <input
          id="exam-neg-val-input"
          type="number"
          step="0.25"
          [ngModel]="negMarkingValue()"
          (ngModelChange)="negMarkingValueChange.emit($event)"
          class="w-36 px-3 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono font-medium"
        />
      </div>
    }

    <div class="flex items-center gap-6 pt-2">
      <label class="flex items-center gap-2 cursor-pointer select-none">
        <input
          type="checkbox"
          [ngModel]="reviewFlag()"
          (ngModelChange)="reviewFlagChange.emit($event)"
          class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500"
        />
        <span class="text-xs font-semibold text-slate-700">Allow &quot;Mark for Review&quot; Flagging</span>
      </label>

      <label class="flex items-center gap-2 cursor-pointer select-none">
        <input
          type="checkbox"
          [ngModel]="isPractice()"
          (ngModelChange)="isPracticeChange.emit($event)"
          class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500"
        />
        <span class="text-xs font-semibold text-slate-700">Practice / Mock Exam</span>
      </label>
    </div>
  </div>
</div>
