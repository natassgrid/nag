<div class="space-y-3 pt-3 border-t border-slate-200">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <h3 class="text-xs font-bold text-indigo-900 uppercase tracking-wider">
        Exam Sections Breakdown ({{ sections().length }})
      </h3>
      <span class="text-[10px] text-slate-500 font-medium">Relational Subject Mapping</span>
    </div>
    <button
      type="button"
      (click)="addSection.emit()"
      class="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1"
    >
      <mat-icon class="!text-xs">add</mat-icon>
      Add Section
    </button>
  </div>

  <div class="space-y-2">
    @for (sec of sections(); track $index; let idx = $index) {
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-bold text-indigo-700 uppercase tracking-wide">
            Section #{{ idx + 1 }}
          </span>
          <button
            type="button"
            (click)="removeSection.emit(idx)"
            [disabled]="sections().length <= 1"
            class="text-slate-400 hover:text-rose-600 disabled:opacity-30 cursor-pointer"
            title="Delete Section"
          >
            <mat-icon class="!text-base">delete</mat-icon>
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-2.5">
          <!-- Subject Selector (Mandatory for Unified Spine) -->
          <div class="sm:col-span-2 md:col-span-2 space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 uppercase">Subject *</label>
            <select
              [ngModel]="sec.subjectId"
              (ngModelChange)="onSubjectSelect(sec, $event)"
              class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
            >
              <option [ngValue]="undefined">-- Select Canonical Subject --</option>
              @for (sub of subjects(); track sub.id) {
                <option [value]="sub.id">{{ sub.name }}</option>
              }
            </select>
          </div>

          <!-- Section Name -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 uppercase">Section Name</label>
            <input
              type="text"
              [(ngModel)]="sec.name"
              placeholder="e.g. Mathematics"
              class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
            />
          </div>

          <!-- Question Count -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 uppercase">Questions</label>
            <input
              type="number"
              [(ngModel)]="sec.questionCount"
              placeholder="Questions"
              min="1"
              title="Number of Questions"
              class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-center font-bold text-indigo-700"
            />
          </div>

          <!-- Marks Per Question -->
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-600 uppercase">Marks/Q</label>
            <input
              type="number"
              [(ngModel)]="sec.marksPerQuestion"
              placeholder="Marks/Q"
              min="0.5"
              step="0.5"
              title="Marks per Question"
              class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono text-center font-bold"
            />
          </div>
        </div>
      </div>
    }
  </div>
</div>
