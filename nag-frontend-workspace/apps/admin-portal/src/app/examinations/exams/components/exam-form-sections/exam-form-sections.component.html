<div class="space-y-3 pt-3 border-t border-slate-200">
  <div class="flex items-center justify-between">
    <h3 class="text-xs font-bold text-indigo-900 uppercase tracking-wider">
      Exam Sections Breakdown ({{ sections().length }})
    </h3>
    <button
      type="button"
      (click)="addSection.emit()"
      class="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1"
    >
      <mat-icon class="!text-xs">add</mat-icon>
      Add Section
    </button>
  </div>

  <div class="space-y-2">
    @for (sec of sections(); track $index; let idx = $index) {
      <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
        <input
          type="text"
          [(ngModel)]="sec.name"
          placeholder="Section Name"
          class="flex-1 px-2.5 py-1 text-xs bg-white border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium"
        />
        <div class="w-24">
          <input
            type="number"
            [(ngModel)]="sec.questionCount"
            placeholder="Questions"
            title="Number of Questions"
            class="w-full px-2 py-1 text-xs bg-white border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono text-center"
          />
        </div>
        <div class="w-24">
          <input
            type="number"
            [(ngModel)]="sec.marksPerQuestion"
            placeholder="Marks/Q"
            title="Marks per Question"
            class="w-full px-2 py-1 text-xs bg-white border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono text-center"
          />
        </div>
        <button
          type="button"
          (click)="removeSection.emit(idx)"
          [disabled]="sections().length <= 1"
          class="text-slate-400 hover:text-rose-600 disabled:opacity-30"
        >
          <mat-icon class="!text-base">delete</mat-icon>
        </button>
      </div>
    }
  </div>
</div>
