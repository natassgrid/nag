@if (isOpen()) {
  <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex justify-end animate-fadeIn">
    <div class="w-full max-w-2xl bg-white h-full shadow-2xl flex flex-col animate-slideLeft overflow-y-auto">
      <!-- Drawer Header -->
      <div class="p-6 border-b border-slate-200 flex items-center justify-between sticky top-0 bg-white z-10">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
            <mat-icon>{{ editingExam() ? 'edit_note' : 'add_circle' }}</mat-icon>
          </div>
          <div>
            <h2 class="text-base font-black text-slate-900">
              {{ editingExam() ? 'Edit Examination Blueprint' : 'Create New Examination' }}
            </h2>
            <p class="text-xs text-slate-500">Configure examination settings, sections, and delivery policies</p>
          </div>
        </div>
        <button
          type="button"
          (click)="onClose()"
          class="text-slate-400 hover:text-slate-600"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <!-- Drawer Body Form Sub-components -->
      <div class="p-6 space-y-5 flex-1">
        <!-- General Info Sub-component -->
        <nag-exam-form-general
          [name]="formName"
          [code]="formCode"
          [authority]="formAuthority"
          [category]="formCategory"
          [academicYear]="formAcademicYear"
          (nameChange)="formName = $event"
          (codeChange)="formCode = $event"
          (authorityChange)="formAuthority = $event"
          (categoryChange)="formCategory = $event"
          (academicYearChange)="formAcademicYear = $event"
        ></nag-exam-form-general>

        <!-- Rules and Policies Sub-component -->
        <nag-exam-form-rules
          [duration]="formDuration"
          [totalMarks]="formTotalMarks"
          [navPolicy]="formNavPolicy"
          [calcPolicy]="formCalcPolicy"
          [negMarking]="formNegMarking"
          [negMarkingValue]="formNegMarkingValue"
          [reviewFlag]="formReviewFlag"
          [isPractice]="formIsPractice"
          (durationChange)="formDuration = $event"
          (totalMarksChange)="formTotalMarks = $event"
          (navPolicyChange)="formNavPolicy = $event"
          (calcPolicyChange)="formCalcPolicy = $event"
          (negMarkingChange)="formNegMarking = $event"
          (negMarkingValueChange)="formNegMarkingValue = $event"
          (reviewFlagChange)="formReviewFlag = $event"
          (isPracticeChange)="formIsPractice = $event"
        ></nag-exam-form-rules>

        <!-- Sections Breakdown Sub-component -->
        <nag-exam-form-sections
          [sections]="formSections"
          (addSection)="addSection()"
          (removeSection)="removeSection($event)"
        ></nag-exam-form-sections>
      </div>

      <!-- Drawer Footer Actions -->
      <div class="p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-end gap-3 sticky bottom-0 z-10">
        <button
          type="button"
          mat-stroked-button
          (click)="onClose()"
          [disabled]="isSaving()"
          class="!border-slate-300 !text-slate-700 !rounded-xl"
        >
          Cancel
        </button>
        <button
          type="button"
          mat-flat-button
          color="primary"
          (click)="onSave()"
          [disabled]="isSaving() || !formName.trim()"
          class="!rounded-xl"
        >
          <span class="flex items-center gap-1.5">
            @if (isSaving()) {
              <mat-icon class="animate-spin !text-sm leading-none">refresh</mat-icon>
              <span>Saving...</span>
            } @else {
              <mat-icon class="!text-sm leading-none">save</mat-icon>
              <span>{{ editingExam() ? 'Update Blueprint' : 'Create Examination' }}</span>
            }
          </span>
        </button>
      </div>
    </div>
  </div>
}
