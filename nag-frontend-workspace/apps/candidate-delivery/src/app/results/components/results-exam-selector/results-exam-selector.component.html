<div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
  <div class="space-y-0.5">
    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Select Examination Session</span>
    <p class="text-xs text-slate-600 font-medium">Switch between declared assessments to inspect rank, sectional marks, and Merkle proofs</p>
  </div>

  <div class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
    @for (sc of scorecards(); track sc.id) {
      <button
        type="button"
        (click)="selectScorecard.emit(sc)"
        class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer whitespace-nowrap"
        [ngClass]="{
          'bg-indigo-600 text-white shadow-xs scale-102': selected()?.id === sc.id,
          'bg-slate-100 text-slate-700 hover:bg-slate-200': selected()?.id !== sc.id
        }"
      >
        <span class="font-mono">{{ sc.examCode }}</span>
        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded" [ngClass]="selected()?.id === sc.id ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'">
          {{ sc.percentile }}%ile
        </span>
      </button>
    }
  </div>
</div>
