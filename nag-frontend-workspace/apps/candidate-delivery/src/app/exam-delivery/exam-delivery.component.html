<div class="h-screen w-full flex flex-col bg-slate-950 text-slate-100 overflow-hidden font-sans select-none">
  <!-- Mode Banner (Preview / Practice Simulation) -->
  <nag-exam-mode-banner
    [mode]="deliveryMode()"
    (exit)="handleExitBanner()"
  />

  <!-- Top Runtime Header Component -->
  <nag-exam-runtime-header
    [deliveryMode]="deliveryMode()"
    [formattedTime]="formattedTime()"
    [remainingSeconds]="remainingSeconds()"
    [currentLanguage]="i18nService.currentLanguage()"
    [supportedLanguages]="supportedLanguages"
    (languageChange)="onLanguageChange($event)"
    (submit)="confirmSubmission()"
  />

  <!-- Main Delivery Split Body -->
  <main class="flex-1 flex overflow-hidden min-h-0">
    <!-- Left: Question Workspace -->
    <section class="flex-1 flex flex-col min-w-0 bg-slate-900 border-r border-slate-800">
      @if (currentItem(); as item) {
        <nag-exam-question-card
          [item]="item"
          [currentIndex]="currentIndex()"
          [totalQuestions]="totalQuestions()"
          (selectOption)="selectOption(item, $event)"
          (clearResponse)="clearResponse(item)"
          (toggleFlag)="toggleFlag(item)"
          (previous)="prevQuestion()"
          (next)="nextQuestion()"
        />
      } @else {
        <div class="flex-1 flex items-center justify-center p-8 text-center text-slate-500">
          <div class="max-w-md">
            <mat-icon class="!text-6xl !w-16 !h-16 text-slate-600 mb-4">quiz</mat-icon>
            <h3 class="text-xl font-bold text-slate-300 mb-2">No Question Selected</h3>
            <p class="text-sm">Please select a question number from the question palette on the right.</p>
          </div>
        </div>
      }
    </section>

    <!-- Right: Question Palette & Candidate Status -->
    <aside class="w-80 lg:w-96 flex flex-col bg-slate-950 shrink-0">
      <nag-exam-question-palette
        [questions]="questions()"
        [currentIndex]="currentIndex()"
        [countAnswered]="countAnswered()"
        [countFlagged]="countFlagged()"
        [countUnvisited]="countUnvisited()"
        [sessionMeta]="sessionMeta()"
        (selectQuestion)="goToQuestion($event)"
      />
    </aside>
  </main>

  <!-- Cryptographic Submission Receipt & Score Modal -->
  @if (submissionReceipt(); as receipt) {
    <nag-exam-submission-modal
      [receipt]="receipt"
      (close)="onCloseReceipt()"
    />
  }
</div>
