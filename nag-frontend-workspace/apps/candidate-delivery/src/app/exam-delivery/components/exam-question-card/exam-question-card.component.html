<div class="max-w-4xl w-full mx-auto space-y-6">
  <!-- Item Header -->
  <div class="flex items-center justify-between pb-3 border-b border-slate-200">
    <div class="flex items-center gap-3">
      <span class="font-bold text-base text-slate-900">
        Question {{ item().order }} of {{ totalQuestions() }}
      </span>
      <span class="text-xs font-mono bg-slate-200 text-slate-700 px-2 py-0.5 rounded">
        Code: {{ item().questionCode }}
      </span>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <span class="text-emerald-700 font-semibold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
        +{{ item().marks }} / -{{ item().negativeMarks }} Marks
      </span>
      <button
        type="button"
        (click)="onToggleFlag()"
        class="px-2.5 py-1 rounded border flex items-center gap-1 font-semibold transition-colors cursor-pointer"
        [ngClass]="{
          'bg-amber-100 border-amber-300 text-amber-900': item().isFlagged,
          'bg-white border-slate-300 text-slate-600 hover:bg-slate-50': !item().isFlagged
        }"
      >
        <mat-icon class="!text-sm leading-none">
          {{ item().isFlagged ? 'flag' : 'outlined_flag' }}
        </mat-icon>
        <span>{{ item().isFlagged ? 'Flagged' : 'Flag for Review' }}</span>
      </button>
    </div>
  </div>

  <!-- Question Stem Box -->
  <div class="question-stem-box bg-white p-6 rounded-xl border border-slate-200 shadow-xs text-base">
    <nag-math-renderer [content]="item().content" />
  </div>

  <!-- Options Selection List -->
  <div class="space-y-3">
    <span class="text-xs font-bold uppercase text-slate-500 tracking-wider">
      Select your answer:
    </span>
    <div class="grid grid-cols-1 gap-3">
      @for (opt of item().options; track opt.id; let idx = $index) {
        <button
          type="button"
          (click)="onSelectOption(opt.id)"
          class="option-row text-left p-4 rounded-xl border flex items-center gap-4 transition-all bg-white cursor-pointer"
          [ngClass]="{
            'border-indigo-600 bg-indigo-50/50 ring-2 ring-indigo-600/30 font-medium':
              item().selectedOptionId === opt.id,
            'border-slate-200 hover:border-slate-300 hover:bg-slate-50':
              item().selectedOptionId !== opt.id
          }"
        >
          <span
            class="w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs shrink-0"
            [ngClass]="{
              'bg-indigo-600 text-white': item().selectedOptionId === opt.id,
              'bg-slate-200 text-slate-700': item().selectedOptionId !== opt.id
            }"
          >
            {{ getLetter(idx) }}
          </span>
          <div class="grow text-sm">
            <nag-math-renderer [content]="opt.text" [inline]="true" />
          </div>
        </button>
      }
    </div>
  </div>

  <!-- Footer Navigation Controls -->
  <div class="pt-6 border-t border-slate-200 flex items-center justify-between">
    <button
      type="button"
      (click)="onPrevious()"
      [disabled]="currentIndex() === 0"
      class="px-4 py-2 rounded-lg border border-slate-300 text-sm font-semibold bg-white hover:bg-slate-50 disabled:opacity-40 cursor-pointer disabled:cursor-not-allowed"
    >
      &larr; Previous
    </button>

    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="onClearResponse()"
        [disabled]="!item().selectedOptionId"
        class="px-3 py-2 text-xs font-semibold text-slate-500 hover:text-slate-800 disabled:opacity-40 cursor-pointer disabled:cursor-not-allowed"
      >
        Clear Selection
      </button>
      <button
        type="button"
        (click)="onNext()"
        [disabled]="currentIndex() === totalQuestions() - 1"
        class="px-5 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:opacity-40 cursor-pointer disabled:cursor-not-allowed"
      >
        Next &rarr;
      </button>
    </div>
  </div>
</div>
