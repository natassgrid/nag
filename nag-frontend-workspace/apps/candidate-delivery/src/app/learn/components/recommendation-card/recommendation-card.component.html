<mat-card class="rec-card" appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar>
      <mat-icon color="primary">auto_awesome</mat-icon>
    </div>
    <mat-card-title>Your Personalized Study Plan</mat-card-title>
    <mat-card-subtitle>
      Status: {{ recommendation().status }}
      @if (recommendation().generatedAt) {
        | Generated: {{ recommendation().generatedAt | date:'mediumDate' }}
      }
    </mat-card-subtitle>
  </mat-card-header>
  
  <mat-card-content>
    @if (recommendation().motivationalMessage) {
      <div class="message-banner">
        <mat-icon>lightbulb</mat-icon>
        <p>{{ recommendation().motivationalMessage }}</p>
      </div>
    }

    <mat-tab-group>
      <mat-tab label="Weak Topics">
        <div class="tab-content">
          <app-weak-topics-panel [topics]="recommendation().weakTopicRecommendations"></app-weak-topics-panel>
        </div>
      </mat-tab>
      <mat-tab label="7-Day Study Plan">
        <div class="tab-content">
          <app-study-plan-panel [plan]="recommendation().studyPlanItems"></app-study-plan-panel>
        </div>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
  
  <mat-card-actions>
    <button mat-button color="primary" routerLink="/practice">Start Practice</button>
  </mat-card-actions>
</mat-card>
