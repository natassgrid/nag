<div class="bg-white rounded-3xl border border-slate-200 p-4 sm:p-5 shadow-xs space-y-4">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <!-- Format Variant Chips -->
    <div class="space-y-1.5">
      <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500">
        Explanation Variant Style:
      </span>
      <div class="flex flex-wrap items-center gap-1.5">
        @for (item of allTypes; track item.type) {
          <button
            type="button"
            (click)="onSelectType(item.type)"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all cursor-pointer"
            [ngClass]="{
              'bg-indigo-600 text-white border-indigo-600 shadow-2xs': currentType() === item.type,
              'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100': currentType() !== item.type
            }"
          >
            <mat-icon class="!text-sm leading-none">{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </button>
        }
      </div>
    </div>

    <!-- "Try Another Explanation" Action Button -->
    <div class="shrink-0 self-start sm:self-center">
      <button
        mat-stroked-button
        type="button"
        (click)="onTryAnother()"
        class="!border-indigo-300 !text-indigo-700 hover:!bg-indigo-50 !font-bold !rounded-xl !text-xs !py-1.5 !px-3 cursor-pointer shadow-2xs flex items-center gap-1"
      >
        <mat-icon class="!text-sm">shuffle</mat-icon>
        <span>Try Another Explanation</span>
      </button>
    </div>
  </div>

  <!-- Difficulty Level Switcher -->
  <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mr-1">
      Difficulty Depth:
    </span>
    <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200">
      @for (diff of allDifficulties; track diff.level) {
        <button
          type="button"
          (click)="onSelectDifficulty(diff.level)"
          class="px-3 py-1 rounded-lg text-xs font-semibold transition-all cursor-pointer"
          [ngClass]="{
            'bg-white text-slate-900 shadow-2xs font-bold': currentDifficulty() === diff.level,
            'text-slate-600 hover:text-slate-900': currentDifficulty() !== diff.level
          }"
        >
          {{ diff.label }}
        </button>
      }
    </div>
  </div>
</div>
