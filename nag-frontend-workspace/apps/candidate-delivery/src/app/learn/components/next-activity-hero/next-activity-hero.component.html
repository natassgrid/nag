@if (activity(); as act) {
  <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-lg border border-indigo-900/40 relative overflow-hidden">
    <div class="absolute -right-16 -top-16 w-60 h-60 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6 relative z-10">
      <div class="space-y-3 max-w-2xl">
        <div class="flex flex-wrap items-center gap-2">
          <span class="px-2.5 py-0.5 rounded-md text-[10px] font-bold border" [ngClass]="badgeClass()">
            {{ act.type }}
          </span>
          <span class="px-2.5 py-0.5 rounded-md text-[10px] font-bold bg-white/10 text-slate-200">
            {{ act.urgency }} PRIORITY
          </span>
          <span class="px-2.5 py-0.5 rounded-md text-[10px] font-medium bg-white/10 text-indigo-200 flex items-center gap-1">
            <mat-icon class="!text-xs">schedule</mat-icon>
            ~{{ act.estimatedMinutes }} mins
          </span>
        </div>

        <div>
          <span class="text-xs font-semibold text-indigo-300">
            {{ act.subjectName }} &bull; {{ act.topicName }}
          </span>
          <h2 class="text-xl sm:text-2xl font-black text-white mt-0.5">
            {{ act.subtopicName }}
          </h2>
        </div>

        <p class="text-xs sm:text-sm text-slate-300 font-normal leading-relaxed flex items-center gap-2">
          <mat-icon class="!text-base text-amber-400 shrink-0">lightbulb</mat-icon>
          <span>{{ act.reason }}</span>
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-row sm:flex-col items-center sm:items-end justify-between sm:justify-center gap-3 w-full lg:w-auto shrink-0 pt-2 lg:pt-0 border-t border-slate-800 lg:border-t-0">
        <button
          mat-flat-button
          type="button"
          (click)="onStart()"
          class="!bg-indigo-600 hover:!bg-indigo-500 !text-white !font-bold !rounded-2xl !py-3 !px-6 !text-xs cursor-pointer shadow-md transition-all hover:scale-102 flex items-center gap-2"
        >
          <mat-icon class="!text-base">{{ activityIcon() }}</mat-icon>
          <span>{{ actionText() }}</span>
        </button>

        <button
          mat-stroked-button
          type="button"
          [disabled]="completing()"
          (click)="onComplete()"
          class="!text-slate-300 !border-slate-700 hover:!bg-white/5 !rounded-xl !text-xs cursor-pointer"
        >
          <mat-icon class="!text-sm text-emerald-400">check</mat-icon>
          <span>{{ completing() ? 'Updating...' : 'Mark as Done' }}</span>
        </button>
      </div>
    </div>
  </div>
}
