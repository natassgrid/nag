<mat-list>
  @for (item of plan(); track item.day) {
    <mat-list-item class="hover:bg-slate-50 transition-colors rounded-xl">
      <button
        mat-icon-button
        matListItemIcon
        type="button"
        (click)="toggleDay(item.day)"
        [attr.aria-label]="'Toggle day ' + item.day"
        [ngClass]="isDayCompleted(item.day) ? 'text-emerald-600' : 'text-slate-400'"
      >
        <mat-icon>{{ isDayCompleted(item.day) ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
      </button>
      <div matListItemTitle [ngClass]="{ 'line-through text-slate-400': isDayCompleted(item.day) }">
        Day {{ item.day }}: {{ item.topicName }}
      </div>
      <div matListItemLine class="text-xs text-slate-500">
        Estimated time: {{ item.estimatedMinutes }} mins
        @if (isDayCompleted(item.day)) {
          <span class="text-emerald-600 font-semibold ml-2">&#10003; Done</span>
        }
      </div>
    </mat-list-item>
  } @empty {
    <p class="empty-state">No study plan available.</p>
  }
</mat-list>
