<div class="px-4 py-3 rounded-2xl border border-slate-200/80 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-2xs">
  <!-- Helpfulness Rating -->
  <div class="flex items-center gap-2.5">
    <span class="text-xs font-medium text-slate-600">Was this explanation helpful?</span>
    <div class="flex items-center gap-1.5">
      <button
        type="button"
        (click)="onRate(1)"
        class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-semibold border transition-all cursor-pointer"
        [ngClass]="{
          'bg-emerald-50 text-emerald-800 border-emerald-300 font-bold shadow-2xs': userRating() === 1,
          'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100': userRating() !== 1
        }"
      >
        <mat-icon class="!text-sm text-emerald-600">thumb_up</mat-icon>
        <span>Helpful</span>
      </button>

      <button
        type="button"
        (click)="onRate(-1)"
        class="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-semibold border transition-all cursor-pointer"
        [ngClass]="{
          'bg-rose-50 text-rose-800 border-rose-300 font-bold shadow-2xs': userRating() === -1,
          'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100': userRating() !== -1
        }"
      >
        <mat-icon class="!text-sm text-rose-600">thumb_down</mat-icon>
        <span>Needs Work</span>
      </button>
    </div>
  </div>

  <!-- Mark Completed Action -->
  <div>
    @if (isCompleted()) {
      <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold">
        <mat-icon class="!text-sm">verified</mat-icon>
        <span>Lesson Completed &amp; Mastery Updated</span>
      </div>
    } @else {
      <button
        mat-flat-button
        type="button"
        [disabled]="completing()"
        (click)="onMarkCompleted()"
        class="!bg-emerald-600 hover:!bg-emerald-700 !text-white !font-bold !rounded-xl !text-xs !py-2 !px-4 cursor-pointer shadow-2xs flex items-center gap-1.5"
      >
        <mat-icon class="!text-sm">check_circle</mat-icon>
        <span>{{ completing() ? 'Updating Mastery...' : 'Mark Lesson as Completed' }}</span>
      </button>
    }
  </div>
</div>
