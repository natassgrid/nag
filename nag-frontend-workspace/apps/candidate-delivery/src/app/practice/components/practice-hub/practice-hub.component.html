<div class="hub-container">
  <div class="hub-header">
    <h1>Practice Hub</h1>
    <button mat-button color="primary" routerLink="/practice/history">
      <mat-icon>history</mat-icon> View History
    </button>
  </div>

  @if (isLoading()) {
    <div class="loading-state">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else if (error()) {
    <div class="error-state">
      <mat-icon color="warn">error</mat-icon>
      <p>{{ error() }}</p>
    </div>
  } @else if (practiceSets().length === 0) {
    <div class="empty-state">
      <mat-icon>sentiment_dissatisfied</mat-icon>
      <p>No practice sets available at the moment.</p>
    </div>
  } @else {
    <div class="sets-grid">
      @for (set of practiceSets(); track set.id) {
        <app-practice-set-card [set]="set" (launch)="openLaunch($event)"></app-practice-set-card>
      }
    </div>
  }
</div>
