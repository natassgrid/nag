<div class="register-page min-h-screen bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 flex items-center justify-center p-4">
  <div class="w-full max-w-xl space-y-6 my-8">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black text-2xl shadow-lg">
          NAG
        </div>
        <div class="text-left">
          <h1 class="text-2xl font-black text-white tracking-tight">National Assessment Grid</h1>
          <p class="text-xs text-indigo-300 uppercase tracking-widest font-semibold">Candidate Self-Registration</p>
        </div>
      </div>
      <p class="text-slate-400 text-xs">Create your national candidate profile with verifiable identity documentation</p>
    </div>

    <!-- Registration Card -->
    <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-2xl space-y-6">
      @if (errorMessage()) {
        <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
          <mat-icon class="!text-base leading-none">error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form (ngSubmit)="handleRegister()" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label for="reg-fullName" class="block text-xs font-bold text-slate-700 uppercase mb-1">
              Full Legal Name (as per ID)
            </label>
            <input
              id="reg-fullName"
              type="text"
              [(ngModel)]="fullName"
              name="fullName"
              placeholder="e.g. Rahul Sharma"
              required
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label for="reg-email" class="block text-xs font-bold text-slate-700 uppercase mb-1">
              Email Address
            </label>
            <input
              id="reg-email"
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="rahul@example.com"
              required
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label for="reg-mobile" class="block text-xs font-bold text-slate-700 uppercase mb-1">
              10-Digit Mobile Number
            </label>
            <input
              id="reg-mobile"
              type="tel"
              [(ngModel)]="mobile"
              name="mobile"
              placeholder="9876543210"
              required
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-mono"
            />
          </div>

          <div>
            <label for="reg-idType" class="block text-xs font-bold text-slate-700 uppercase mb-1">
              Identity Document Type
            </label>
            <select
              id="reg-idType"
              [(ngModel)]="identityDocType"
              name="identityDocType"
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 bg-white"
            >
              <option value="AADHAAR">Aadhaar Card</option>
              <option value="PAN">PAN Card</option>
              <option value="PASSPORT">Passport</option>
              <option value="VOTER_ID">Voter ID</option>
              <option value="DL">Driver's License</option>
            </select>
          </div>

          <div>
            <label for="reg-idNum" class="block text-xs font-bold text-slate-700 uppercase mb-1">
              ID Document Number
            </label>
            <input
              id="reg-idNum"
              type="text"
              [(ngModel)]="identityDocNumber"
              name="identityDocNumber"
              placeholder="1234 5678 9012"
              required
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-mono"
            />
          </div>

          <div>
            <label for="reg-password" class="block text-xs font-bold text-slate-700 uppercase mb-1">
              Password
            </label>
            <input
              id="reg-password"
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••••••"
              required
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-sans"
            />
          </div>

          <div>
            <label for="reg-confirmPassword" class="block text-xs font-bold text-slate-700 uppercase mb-1">
              Confirm Password
            </label>
            <input
              id="reg-confirmPassword"
              type="password"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="••••••••••••"
              required
              class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 font-sans"
            />
          </div>
        </div>

        <button
          type="submit"
          mat-flat-button
          color="primary"
          [disabled]="loading()"
          class="w-full !py-3 !rounded-xl !text-sm font-bold shadow-md !bg-indigo-600 hover:!bg-indigo-700 !text-white mt-2"
        >
          <span class="flex items-center justify-center gap-2">
            <mat-icon class="!text-base">{{ loading() ? 'hourglass_top' : 'how_to_reg' }}</mat-icon>
            {{ loading() ? 'Creating Profile...' : 'Create Account & Verify OTP' }}
          </span>
        </button>
      </form>

      <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-600">
        Already registered?
        <a routerLink="/login" class="font-bold text-indigo-600 hover:underline ml-1">
          Sign In Here
        </a>
      </div>
    </div>
  </div>
</div>
