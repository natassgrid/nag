<div class="verify-otp-page min-h-screen bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 flex items-center justify-center p-4">
  <div class="w-full max-w-md space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-black text-2xl shadow-lg">
          NAG
        </div>
        <div class="text-left">
          <h1 class="text-2xl font-black text-white tracking-tight">Two-Factor OTP</h1>
          <p class="text-xs text-indigo-300 uppercase tracking-widest font-semibold">Account Verification</p>
        </div>
      </div>
      <p class="text-slate-400 text-xs">
        Enter the 6-digit verification code sent to
        <b class="text-white font-mono">{{ email() || 'your registered mobile' }}</b>
      </p>
    </div>

    <!-- OTP Card -->
    <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-2xl space-y-6">
      @if (errorMessage()) {
        <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
          <mat-icon class="!text-base leading-none">error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form (ngSubmit)="handleVerifyOtp()" class="space-y-6">
        <div>
          <label for="otp-code" class="block text-xs font-bold text-slate-700 uppercase mb-2 text-center">
            6-Digit Security Code
          </label>
          <input
            id="otp-code"
            type="text"
            maxlength="6"
            [(ngModel)]="otpCode"
            name="otpCode"
            placeholder="• • • • • •"
            required
            class="w-full py-3.5 text-center text-2xl font-mono tracking-[0.5em] font-bold border-2 border-slate-300 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          />
        </div>

        <button
          type="submit"
          mat-flat-button
          color="primary"
          [disabled]="loading() || otpCode.length < 6"
          class="w-full !py-3 !rounded-xl !text-sm font-bold shadow-md !bg-indigo-600 hover:!bg-indigo-700 !text-white"
        >
          <span class="flex items-center justify-center gap-2">
            <mat-icon class="!text-base">{{ loading() ? 'hourglass_top' : 'verified_user' }}</mat-icon>
            {{ loading() ? 'Verifying OTP...' : 'Verify & Complete Activation' }}
          </span>
        </button>
      </form>

      <div class="flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-100">
        <a routerLink="/login" class="text-slate-500 hover:text-slate-700 font-semibold">
          &larr; Back to Sign In
        </a>
        <button
          type="button"
          (click)="resendOtp()"
          [disabled]="resendCountdown() > 0"
          class="font-bold text-indigo-600 hover:underline disabled:text-slate-400 disabled:no-underline"
        >
          {{ resendCountdown() > 0 ? 'Resend in ' + resendCountdown() + 's' : 'Resend Code' }}
        </button>
      </div>
    </div>
  </div>
</div>
