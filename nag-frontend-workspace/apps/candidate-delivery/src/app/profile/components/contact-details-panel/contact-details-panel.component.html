<div class="space-y-4">
  <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center gap-2">
    <mat-icon class="text-indigo-600 !text-lg">pin_drop</mat-icon>
    Contact & Correspondence Address
  </h3>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label for="prof-mobile" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Mobile Number</label>
      <input
        id="prof-mobile"
        type="tel"
        [(ngModel)]="profile().mobile"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
      />
    </div>
    <div>
      <label for="prof-email" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email Address</label>
      <input
        id="prof-email"
        type="email"
        [(ngModel)]="profile().email"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
      />
    </div>
    <div class="sm:col-span-2">
      <label for="prof-address" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Full Postal Address</label>
      <textarea
        id="prof-address"
        rows="3"
        [(ngModel)]="profile().address"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
      ></textarea>
    </div>
    <div>
      <label for="prof-state" class="block text-xs font-semibold text-slate-700 uppercase mb-1">State / UT</label>
      <input
        id="prof-state"
        type="text"
        [(ngModel)]="profile().state"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
      />
    </div>
    <div>
      <label for="prof-pinCode" class="block text-xs font-semibold text-slate-700 uppercase mb-1">PIN Code</label>
      <input
        id="prof-pinCode"
        type="text"
        [(ngModel)]="profile().pinCode"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden font-mono"
      />
    </div>
  </div>
</div>
