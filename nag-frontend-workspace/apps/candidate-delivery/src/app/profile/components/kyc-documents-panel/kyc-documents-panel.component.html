<div class="space-y-4">
  <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center gap-2">
    <mat-icon class="text-indigo-600 !text-lg">cloud_upload</mat-icon>
    Document Uploads & Cryptographic Anchoring
  </h3>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="p-4 rounded-xl border border-dashed border-slate-300 bg-slate-50 flex items-center gap-4 transition-colors hover:border-indigo-300 hover:bg-indigo-50/20">
      <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold shrink-0">
        <mat-icon>photo_camera</mat-icon>
      </div>
      <div class="space-y-1 grow">
        <div class="text-xs font-bold text-slate-900">Passport Photograph</div>
        <div class="text-[11px] text-slate-500">Verified & Securely Stored</div>
        <span class="inline-block text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">
          Uploaded (JPEG)
        </span>
      </div>
    </div>

    <div class="p-4 rounded-xl border border-dashed border-slate-300 bg-slate-50 flex items-center gap-4 transition-colors hover:border-indigo-300 hover:bg-indigo-50/20">
      <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold shrink-0">
        <mat-icon>draw</mat-icon>
      </div>
      <div class="space-y-1 grow">
        <div class="text-xs font-bold text-slate-900">Candidate Signature</div>
        <div class="text-[11px] text-slate-500">Signature Stamp Attached</div>
        <span class="inline-block text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">
          Uploaded (PNG)
        </span>
      </div>
    </div>
  </div>
</div>
