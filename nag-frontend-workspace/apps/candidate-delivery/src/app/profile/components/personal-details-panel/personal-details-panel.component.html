<div class="space-y-4">
  <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wider flex items-center gap-2">
    <mat-icon class="text-indigo-600 !text-lg">person</mat-icon>
    Personal & Demographics
  </h3>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
    <div>
      <label for="prof-fullName" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Full Legal Name</label>
      <input
        id="prof-fullName"
        type="text"
        [(ngModel)]="profile().fullName"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
      />
    </div>
    <div>
      <label for="prof-dob" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Date of Birth</label>
      <input
        id="prof-dob"
        type="date"
        [(ngModel)]="profile().dateOfBirth"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
      />
    </div>
    <div>
      <label for="prof-gender" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Gender</label>
      <select
        id="prof-gender"
        [(ngModel)]="profile().gender"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden bg-white"
      >
        <option value="MALE">Male</option>
        <option value="FEMALE">Female</option>
        <option value="OTHER">Other</option>
      </select>
    </div>
    <div>
      <label for="prof-nationality" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nationality</label>
      <input
        id="prof-nationality"
        type="text"
        [(ngModel)]="profile().nationality"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
      />
    </div>
    <div>
      <label for="prof-category" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Category</label>
      <select
        id="prof-category"
        [(ngModel)]="profile().category"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden bg-white"
      >
        <option value="GENERAL">General / Unreserved</option>
        <option value="OBC">OBC (Non-Creamy Layer)</option>
        <option value="SC">Scheduled Caste (SC)</option>
        <option value="ST">Scheduled Tribe (ST)</option>
        <option value="EWS">Economically Weaker Section (EWS)</option>
      </select>
    </div>
    <div>
      <label for="prof-idType" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Identity Document Type</label>
      <select
        id="prof-idType"
        [(ngModel)]="profile().identityDocType"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden bg-white"
      >
        <option value="AADHAAR">Aadhaar Card</option>
        <option value="PAN">PAN Card</option>
        <option value="PASSPORT">Passport</option>
        <option value="VOTER_ID">Voter ID</option>
        <option value="DRIVING_LICENSE">Driving License</option>
      </select>
    </div>
    <div class="sm:col-span-2 md:col-span-3">
      <label for="prof-idNum" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Identity Document Number</label>
      <input
        id="prof-idNum"
        type="text"
        [(ngModel)]="profile().identityDocNumber"
        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-hidden font-mono"
      />
    </div>
  </div>
</div>
