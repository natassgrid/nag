<div class="flex items-center gap-2 bg-white p-2 rounded-xl border border-slate-200">
  <span class="text-xs font-bold uppercase text-slate-400 px-3">Filter:</span>
  <button
    type="button"
    (click)="filterChange.emit('ALL')"
    class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors"
    [ngClass]="{
      'bg-slate-900 text-white': statusFilter() === 'ALL',
      'text-slate-600 hover:bg-slate-100': statusFilter() !== 'ALL'
    }"
  >
    All ({{ totalQuestions() }})
  </button>
  <button
    type="button"
    (click)="filterChange.emit('CORRECT')"
    class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors"
    [ngClass]="{
      'bg-emerald-600 text-white': statusFilter() === 'CORRECT',
      'text-slate-600 hover:bg-slate-100': statusFilter() !== 'CORRECT'
    }"
  >
    Correct ({{ stats().correct }})
  </button>
  <button
    type="button"
    (click)="filterChange.emit('INCORRECT')"
    class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors"
    [ngClass]="{
      'bg-rose-600 text-white': statusFilter() === 'INCORRECT',
      'text-slate-600 hover:bg-slate-100': statusFilter() !== 'INCORRECT'
    }"
  >
    Incorrect ({{ stats().incorrect }})
  </button>
  <button
    type="button"
    (click)="filterChange.emit('UNATTEMPTED')"
    class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors"
    [ngClass]="{
      'bg-slate-600 text-white': statusFilter() === 'UNATTEMPTED',
      'text-slate-600 hover:bg-slate-100': statusFilter() !== 'UNATTEMPTED'
    }"
  >
    Unattempted ({{ stats().unattempted }})
  </button>
</div>
