<div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4 h-fit sticky top-20">
  <h3 class="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-2">
    <mat-icon class="text-indigo-600 !text-base">grid_view</mat-icon>
    Question Palette
  </h3>

  <div class="grid grid-cols-5 gap-2">
    @for (q of questions(); track q.id; let idx = $index) {
      <button
        type="button"
        (click)="selectQuestion.emit(idx)"
        class="h-10 rounded-xl font-mono text-xs font-bold flex items-center justify-center transition-all cursor-pointer border"
        [ngClass]="{
          'ring-2 ring-indigo-600 ring-offset-2': currentIndex() === idx,
          'bg-emerald-500 text-white border-emerald-600': q.isCorrect,
          'bg-rose-500 text-white border-rose-600': !q.isCorrect && q.userChoice,
          'bg-slate-100 text-slate-600 border-slate-200': !q.userChoice
        }"
      >
        {{ idx + 1 }}
      </button>
    }
  </div>

  <div class="pt-4 border-t space-y-2 text-[11px] text-slate-600">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
      <span>Correct (Full Marks)</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-rose-500"></span>
      <span>Incorrect (Negative Penalty)</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-slate-300"></span>
      <span>Unattempted (Zero Impact)</span>
    </div>
  </div>
</div>
