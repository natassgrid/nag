<div class="candidate-app-shell min-h-screen flex flex-col bg-slate-100 text-slate-900">
  <!-- Navigation Bar (Hidden during full-screen exam runtime) -->
  @if (!isExamRuntime()) {
    <nav class="bg-slate-900 text-white px-6 py-3.5 flex items-center justify-between border-b border-slate-800 shrink-0 sticky top-0 z-40">
      <div class="flex items-center gap-6">
        <a routerLink="/dashboard" class="flex items-center gap-2.5">
          <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-black text-sm text-white shadow-xs">
            NAG
          </span>
          <div class="flex flex-col">
            <span class="font-bold text-sm tracking-wide text-white leading-tight">
              National Assessment Grid
            </span>
            <span class="text-[10px] text-slate-400 font-medium">Candidate Examination Portal</span>
          </div>
        </a>

        <div class="hidden md:flex items-center gap-1 text-xs font-semibold">
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-slate-800 text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
          >
            My Dashboard
          </a>
          <a
            routerLink="/browse"
            routerLinkActive="bg-slate-800 text-white"
            class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
          >
            Browse Exams
          </a>
          <a
            routerLink="/profile"
            routerLinkActive="bg-slate-800 text-white"
            class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
          >
            Profile & KYC
          </a>
          <a
            routerLink="/results"
            routerLinkActive="bg-slate-800 text-white"
            class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors"
          >
            Scorecards & Results
          </a>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <a
          routerLink="/profile"
          class="hidden sm:flex items-center gap-2 text-xs hover:text-indigo-300 transition-colors"
        >
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span class="text-slate-300 font-medium">{{ authService.userName() }}</span>
        </a>
        <a
          mat-flat-button
          routerLink="/delivery"
          class="!bg-rose-600 hover:!bg-rose-700 !text-white !text-xs font-bold !rounded-lg"
        >
          <mat-icon class="!text-sm leading-none">play_arrow</mat-icon>
          Live Exam Runtime
        </a>
      </div>
    </nav>
  }

  <!-- Main View Outlet -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>
</div>
