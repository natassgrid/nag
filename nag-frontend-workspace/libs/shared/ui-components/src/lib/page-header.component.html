<header class="page-header-banner flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6 pb-4 border-b border-slate-200">
  <div class="flex items-center gap-3">
    @if (icon()) {
      <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
        <mat-icon>{{ icon() }}</mat-icon>
      </div>
    }
    <div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="text-sm text-slate-500 mt-0.5">{{ subtitle() }}</p>
      }
    </div>
  </div>
  <div class="flex items-center gap-2 flex-wrap">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
