<div class="search-input-wrapper relative w-full max-w-md">
  <div
    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"
  >
    <mat-icon class="!text-lg leading-none">search</mat-icon>
  </div>
  <input
    type="text"
    [value]="internalValue()"
    (input)="onInputChange($event)"
    [placeholder]="placeholder()"
    class="block w-full pl-9 pr-8 py-2 text-sm bg-white border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
  />
  @if (internalValue()) {
    <button
      type="button"
      (click)="clear()"
      class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600"
    >
      <mat-icon class="!text-base leading-none">close</mat-icon>
    </button>
  }
</div>
