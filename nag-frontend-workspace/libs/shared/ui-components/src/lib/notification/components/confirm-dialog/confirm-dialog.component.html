@if (confirmState()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 animate-fadeIn"
    role="dialog"
    aria-modal="true"
  >
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md border border-slate-200 p-6 space-y-4">
      <div class="flex items-start gap-3.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 {{ getIconColorClasses(confirmState()?.options?.type) }}">
          <mat-icon class="!text-xl">{{ getIconName(confirmState()?.options?.type) }}</mat-icon>
        </div>

        <div class="space-y-1">
          <h3 class="font-bold text-slate-900 text-sm">
            {{ confirmState()?.options?.title }}
          </h3>
          <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line">
            {{ confirmState()?.options?.message }}
          </p>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2.5 pt-2 border-t border-slate-100">
        <button
          type="button"
          mat-stroked-button
          (click)="onCancel()"
          class="!rounded-xl !text-xs cursor-pointer"
        >
          {{ confirmState()?.options?.cancelText || 'Cancel' }}
        </button>
        <button
          type="button"
          mat-flat-button
          (click)="onConfirm()"
          class="!rounded-xl !text-xs cursor-pointer {{ getConfirmButtonClasses(confirmState()?.options?.type) }}"
        >
          {{ confirmState()?.options?.confirmText || 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
}
