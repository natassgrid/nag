<div class="space-y-3">
  @for (task of tasks(); track task.id) {
    <button
      type="button"
      (click)="selectTask.emit(task)"
      class="w-full text-left p-4 rounded-xl border cursor-pointer transition-all bg-white"
      [ngClass]="{
        'border-indigo-600 ring-2 ring-indigo-600/20 shadow-sm': selectedTask()?.id === task.id,
        'border-slate-200 hover:border-slate-300': selectedTask()?.id !== task.id
      }"
    >
      <div class="flex items-center justify-between text-xs mb-1.5">
        <span class="font-mono font-bold text-slate-700">{{ task.questionCode }}</span>
        <nag-status-badge [variant]="taskStatusVariant(task.status)" [label]="task.status" />
      </div>
      <div class="text-xs text-slate-500 mb-2">
        Candidate: {{ task.candidateRoll }}
      </div>
      <div class="text-xs text-slate-700 line-clamp-2">
        {{ task.questionContent }}
      </div>
    </button>
  }
</div>
