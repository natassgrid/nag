<div class="bg-white rounded-xl border border-slate-200 shadow-xs p-6 space-y-6">
  @if (task(); as current) {
    <div class="flex items-center justify-between border-b pb-3">
      <div>
        <span class="text-xs font-mono font-bold text-indigo-600">{{ current.questionCode }}</span>
        <h3 class="text-base font-bold text-slate-900 mt-0.5">Subjective Response Evaluation</h3>
      </div>
      <span class="text-xs font-semibold px-2.5 py-1 rounded bg-slate-100 text-slate-700">
        Max Marks: {{ current.maxMarks }}
      </span>
    </div>

    <div class="space-y-2">
      <span class="text-xs font-bold uppercase text-slate-500">Problem Statement</span>
      <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 text-sm">
        <nag-math-renderer [content]="current.questionContent" />
      </div>
    </div>

    <div class="space-y-2">
      <span class="text-xs font-bold uppercase text-slate-500">Candidate Response</span>
      <div class="p-4 bg-amber-50/40 rounded-lg border border-amber-200 text-sm font-mono whitespace-pre-wrap">
        {{ current.candidateResponse }}
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t">
      <div>
        <label for="award-marks-input" class="block text-xs font-bold uppercase text-slate-700 mb-1">
          Awarded Marks (0 - {{ current.maxMarks }})
        </label>
        <input
          id="award-marks-input"
          type="number"
          [ngModel]="awardedMarks()"
          (ngModelChange)="awardedMarks.set($event)"
          [max]="current.maxMarks"
          min="0"
          class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500"
        />
      </div>
      <div>
        <label for="evaluator-remarks-input" class="block text-xs font-bold uppercase text-slate-700 mb-1">
          Evaluator Remarks & Rubric Notes
        </label>
        <input
          id="evaluator-remarks-input"
          type="text"
          [ngModel]="comments()"
          (ngModelChange)="comments.set($event)"
          placeholder="e.g. Correct derivation with minor sign flaw"
          class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500"
        />
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-2">
      <button
        mat-flat-button
        color="primary"
        (click)="onSubmit()"
        [disabled]="submitting()"
      >
        <mat-icon>check</mat-icon>
        Commit Grade
      </button>
    </div>
  } @else {
    <div class="text-center py-16 text-slate-400">
      <mat-icon class="!text-4xl mb-2">touch_app</mat-icon>
      <p class="text-sm">Select a candidate submission from the left queue to evaluate.</p>
    </div>
  }
</div>
