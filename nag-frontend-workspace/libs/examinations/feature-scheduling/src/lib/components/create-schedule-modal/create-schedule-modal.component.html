@if (isOpen()) {
  <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-slate-200 animate-scaleUp">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
          <mat-icon class="text-indigo-600">event_note</mat-icon>
          Create Examination Schedule Session
        </h2>
        <button type="button" (click)="onClose()" class="text-slate-400 hover:text-slate-600">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label for="new-sched-name" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Schedule Name *</label>
          <input
            id="new-sched-name"
            type="text"
            [(ngModel)]="scheduleName"
            class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="new-sched-notif" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Notification No.</label>
            <input
              id="new-sched-notif"
              type="text"
              [(ngModel)]="notificationNumber"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono font-medium"
            />
          </div>
          <div>
            <label for="new-sched-tz" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Time Zone</label>
            <input
              id="new-sched-tz"
              type="text"
              [(ngModel)]="timeZone"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono font-medium"
            />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="new-sched-date" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Exam Date *</label>
            <input
              id="new-sched-date"
              type="date"
              [(ngModel)]="examDate"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
            />
          </div>
          <div>
            <label for="new-sched-reserve" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Reserve Date</label>
            <input
              id="new-sched-reserve"
              type="date"
              [(ngModel)]="reserveDate"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
            />
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-3 border-t border-slate-100">
        <button mat-stroked-button (click)="onClose()" class="!text-slate-600">Cancel</button>
        <button mat-flat-button color="primary" [disabled]="!scheduleName.trim() || !examDate" (click)="onSubmit()">
          Create Schedule
        </button>
      </div>
    </div>
  </div>
}
