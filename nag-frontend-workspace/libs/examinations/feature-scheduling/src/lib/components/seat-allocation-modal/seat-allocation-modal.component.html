@if (isOpen()) {
  <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-slate-200 animate-scaleUp">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
          <mat-icon class="text-purple-600">airline_seat_recline_normal</mat-icon>
          Allocate Test Venue &amp; Seat Quotas
        </h2>
        <button type="button" (click)="onClose()" class="text-slate-400 hover:text-slate-600">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label for="alloc-centre-select" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Select Examination Centre *</label>
          <select
            id="alloc-centre-select"
            [(ngModel)]="allocCentreId"
            class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 font-medium"
          >
            @for (c of centres(); track c.id) {
              <option [value]="c.id">{{ c.centreName }} &bull; {{ c.city }}, {{ c.state }} (Cap: {{ c.totalCapacity }})</option>
            }
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="alloc-total-seats" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Total Allocated Seats</label>
            <input
              id="alloc-total-seats"
              type="number"
              [(ngModel)]="allocTotalSeats"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 font-mono font-bold"
            />
          </div>
          <div>
            <label for="alloc-avail-seats" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Available Seats</label>
            <input
              id="alloc-avail-seats"
              type="number"
              [(ngModel)]="allocAvailableSeats"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 font-mono font-bold text-emerald-700"
            />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="alloc-pwd-seats" class="block text-xs font-semibold text-slate-700 uppercase mb-1">PwD Disability Seats</label>
            <input
              id="alloc-pwd-seats"
              type="number"
              [(ngModel)]="allocPwdSeats"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 font-mono"
            />
          </div>
          <div>
            <label for="alloc-buff-seats" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Emergency Buffer Seats</label>
            <input
              id="alloc-buff-seats"
              type="number"
              [(ngModel)]="allocEmergencyBufferSeats"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 font-mono"
            />
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-3 border-t border-slate-100">
        <button mat-stroked-button (click)="onClose()" class="!text-slate-600">Cancel</button>
        <button mat-flat-button color="primary" [disabled]="!allocCentreId" (click)="onSubmit()">
          Save Allocation
        </button>
      </div>
    </div>
  </div>
}
