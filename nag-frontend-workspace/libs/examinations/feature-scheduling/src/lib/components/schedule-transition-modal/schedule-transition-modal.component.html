@if (isOpen()) {
  <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200 animate-scaleUp">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
          <mat-icon class="text-indigo-600">swap_horiz</mat-icon>
          DPI Approval Workflow Transition
        </h2>
        <button type="button" (click)="onClose()" class="text-slate-400 hover:text-slate-600">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
          <span class="text-slate-500 block">Current Status:</span>
          <span class="font-black text-indigo-700 text-sm uppercase">{{ schedule()?.status }}</span>
        </div>

        <div>
          <label for="target-status-select" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Target Status *</label>
          <select
            id="target-status-select"
            [(ngModel)]="targetStatus"
            class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-slate-900"
          >
            @for (st of getNextStatuses(schedule()?.status); track st) {
              <option [value]="st">{{ st }}</option>
            }
          </select>
        </div>

        <div>
          <label for="transition-comment" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Audit Comment (Optional)</label>
          <textarea
            id="transition-comment"
            [(ngModel)]="transitionComment"
            rows="2"
            placeholder="e.g. Schedule verified and verified against examination centers."
            class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
          ></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-3 border-t border-slate-100">
        <button mat-stroked-button (click)="onClose()" class="!text-slate-600">Cancel</button>
        <button mat-flat-button color="primary" [disabled]="!targetStatus" (click)="onSubmit()">
          Execute Transition
        </button>
      </div>
    </div>
  </div>
}
