@if (isOpen()) {
  <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 animate-fadeIn">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-slate-200 animate-scaleUp">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
          <mat-icon class="text-indigo-600">access_time</mat-icon>
          {{ editingShiftId ? 'Edit Shift Timing' : 'Add Test Shift' }}
        </h2>
        <button type="button" (click)="onClose()" class="text-slate-400 hover:text-slate-600">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="shift-number" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Shift Number</label>
            <input
              id="shift-number"
              type="number"
              [(ngModel)]="shiftNumber"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono font-bold"
            />
          </div>
          <div>
            <label for="shift-name" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Shift Name</label>
            <input
              id="shift-name"
              type="text"
              [(ngModel)]="shiftName"
              placeholder="Morning Session"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
            />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="shift-reporting" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Reporting Time</label>
            <input
              id="shift-reporting"
              type="text"
              [(ngModel)]="reportingTime"
              placeholder="07:30:00"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
            />
          </div>
          <div>
            <label for="shift-gate-closing" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Gate Closing</label>
            <input
              id="shift-gate-closing"
              type="text"
              [(ngModel)]="gateClosingTime"
              placeholder="08:30:00"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
            />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="shift-exam-start" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Exam Start</label>
            <input
              id="shift-exam-start"
              type="text"
              [(ngModel)]="examStartTime"
              placeholder="09:00:00"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
            />
          </div>
          <div>
            <label for="shift-exam-end" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Exam End</label>
            <input
              id="shift-exam-end"
              type="text"
              [(ngModel)]="examEndTime"
              placeholder="12:00:00"
              class="w-full px-3 py-2 text-xs bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
            />
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-3 border-t border-slate-100">
        <button mat-stroked-button (click)="onClose()" class="!text-slate-600">Cancel</button>
        <button mat-flat-button color="primary" (click)="onSubmit()">
          {{ editingShiftId ? 'Update Shift' : 'Save Shift' }}
        </button>
      </div>
    </div>
  </div>
}
