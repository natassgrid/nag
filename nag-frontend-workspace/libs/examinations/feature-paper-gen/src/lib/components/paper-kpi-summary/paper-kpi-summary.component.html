<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
  <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs flex items-center justify-between">
    <div>
      <div class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total Papers</div>
      <div class="text-2xl font-black text-slate-900 mt-1">{{ totalCount() }}</div>
    </div>
    <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
      <mat-icon>description</mat-icon>
    </div>
  </div>

  <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs flex items-center justify-between">
    <div>
      <div class="text-xs font-bold text-slate-500 uppercase tracking-wider">Approved & Encrypted</div>
      <div class="text-2xl font-black text-emerald-600 mt-1">{{ approvedCount() }}</div>
    </div>
    <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
      <mat-icon>verified</mat-icon>
    </div>
  </div>

  <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs flex items-center justify-between">
    <div>
      <div class="text-xs font-bold text-slate-500 uppercase tracking-wider">Draft In-Review</div>
      <div class="text-2xl font-black text-amber-600 mt-1">{{ draftCount() }}</div>
    </div>
    <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
      <mat-icon>pending</mat-icon>
    </div>
  </div>

  <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs flex items-center justify-between">
    <div>
      <div class="text-xs font-bold text-slate-500 uppercase tracking-wider">Practice Mode Papers</div>
      <div class="text-2xl font-black text-purple-600 mt-1">{{ practiceCount() }}</div>
    </div>
    <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center">
      <mat-icon>school</mat-icon>
    </div>
  </div>
</div>
