<div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
  <!-- Top Row: Search and Semantic Search Action -->
  <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
    <div class="w-full md:max-w-md">
      <nag-search-input
        placeholder="Search items by content, code or tags..."
        [value]="searchQuery()"
        (searchChange)="searchChange.emit($event)"
      ></nag-search-input>
    </div>

    <div class="flex items-center gap-3 w-full md:w-auto">
      @if (hasActiveFilters()) {
        <button
          mat-stroked-button
          (click)="reset.emit()"
          class="!rounded-lg !text-rose-600 !border-rose-200 hover:!bg-rose-50 flex items-center gap-1.5 text-xs font-semibold"
        >
          <mat-icon class="!text-base leading-none">clear_all</mat-icon>
          Reset Filters
        </button>
      }

      <button
        mat-stroked-button
        color="accent"
        (click)="toggleSemanticSearch.emit()"
        class="!rounded-lg flex items-center gap-2 text-xs font-semibold"
      >
        <mat-icon class="!text-base leading-none">saved_search</mat-icon>
        Semantic Search
      </button>
    </div>
  </div>

  <!-- Second Row: Filter Selectors (Subject, Difficulty, Status, Page Size) -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 pt-3 border-t border-slate-100">
    <!-- Subject Filter -->
    <div>
      <label for="filter-subject" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">
        Subject
      </label>
      <select
        id="filter-subject"
        [ngModel]="selectedSubject()"
        (ngModelChange)="subjectChange.emit($event)"
        class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white"
      >
        <option value="ALL">All Subjects</option>
        @for (s of subjects(); track s) {
          @if (s !== 'ALL') {
            <option [value]="s">{{ s }}</option>
          }
        }
      </select>
    </div>

    <!-- Difficulty Filter -->
    <div>
      <label for="filter-difficulty" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">
        Difficulty
      </label>
      <select
        id="filter-difficulty"
        [ngModel]="selectedDifficulty()"
        (ngModelChange)="difficultyChange.emit($event)"
        class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white"
      >
        <option value="ALL">All Difficulties</option>
        <option value="EASY">Easy</option>
        <option value="MEDIUM">Medium</option>
        <option value="HARD">Hard</option>
      </select>
    </div>

    <!-- Status Filter -->
    <div>
      <label for="filter-status" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">
        Lifecycle State
      </label>
      <select
        id="filter-status"
        [ngModel]="selectedStatus()"
        (ngModelChange)="statusChange.emit($event)"
        class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white"
      >
        <option value="ALL">All States</option>
        <option value="APPROVED">Approved</option>
        <option value="REVIEW">In Review</option>
        <option value="DRAFT">Draft</option>
        <option value="REJECTED">Rejected</option>
      </select>
    </div>

    <!-- Page Size Filter -->
    <div>
      <label for="filter-size" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">
        Items Per Page
      </label>
      <select
        id="filter-size"
        [ngModel]="pageSize().toString()"
        (ngModelChange)="onPageSizeSelected($event)"
        class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white"
      >
        @for (sz of pageSizes(); track sz) {
          <option [value]="sz.toString()">{{ sz }} items</option>
        }
      </select>
    </div>
  </div>
</div>
