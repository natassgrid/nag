@if (loading()) {
  <div class="py-16 flex flex-col items-center justify-center space-y-3">
    <div class="w-8 h-8 border-3 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-xs font-semibold text-slate-500">Retrieving items from assessment bank...</p>
  </div>
} @else if (questions().length === 0) {
  <nag-empty-state
    icon="menu_book"
    title="No Question Items Found"
    description="No items match your filter criteria. Adjust the filters or start authoring a new assessment item."
    actionLabel="Create First Question"
    (actionClick)="createQuestion.emit()"
  ></nag-empty-state>
} @else {
  <!-- Items Listing -->
  <div class="space-y-4">
    @for (item of questions(); track item.id) {
      <nag-question-card
        [data]="mapQuestionToCard(item)"
        (cardEdit)="editQuestion.emit($event)"
        (cardDelete)="deleteQuestion.emit($event)"
      ></nag-question-card>
    }
  </div>

  <!-- Pagination Footer -->
  <div class="p-4 bg-white rounded-2xl border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs font-medium text-slate-600">
    <div>
      Showing <span class="font-bold text-slate-900">{{ showingStart() }}</span> to
      <span class="font-bold text-slate-900">{{ showingEnd() }}</span> of
      <span class="font-bold text-slate-900">{{ total() }}</span> items
    </div>

    <div class="flex items-center gap-2">
      <button
        mat-stroked-button
        [disabled]="currentPage() === 0"
        (click)="pageChange.emit(currentPage() - 1)"
        class="!rounded-lg !text-xs !py-1 !px-3"
      >
        Previous
      </button>

      <span class="px-3 py-1 bg-slate-100 rounded-lg text-slate-800 font-bold">
        Page {{ currentPage() + 1 }} of {{ totalPages() || 1 }}
      </span>

      <button
        mat-stroked-button
        [disabled]="currentPage() + 1 >= totalPages()"
        (click)="pageChange.emit(currentPage() + 1)"
        class="!rounded-lg !text-xs !py-1 !px-3"
      >
        Next
      </button>
    </div>
  </div>
}
