<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <!-- Editor Column -->
  <div class="space-y-5 bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
    <h2 class="text-base font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
      <mat-icon class="text-indigo-600">tune</mat-icon>
      Item Taxonomy &amp; Parameters
    </h2>

    <!-- Taxonomy & Scoring Sub-component -->
    <nag-standalone-taxonomy-scoring
      [cognitiveLevel]="cognitiveLevel()"
      [difficulty]="difficulty()"
      [type]="type()"
      [marks]="marks()"
      [negativeMarks]="negativeMarks()"
      (cognitiveLevelChange)="cognitiveLevelChange.emit($event)"
      (difficultyChange)="difficultyChange.emit($event)"
      (typeChange)="typeChange.emit($event)"
      (marksChange)="marksChange.emit($event)"
      (negativeMarksChange)="negativeMarksChange.emit($event)"
    ></nag-standalone-taxonomy-scoring>

    <!-- Problem Statement -->
    <div>
      <div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">
        <label for="authoring-content-input" class="block text-xs font-semibold text-slate-700 uppercase">
          Problem Statement (Markdown + LaTeX) *
        </label>
        <div class="flex items-center gap-2">
          <button
            type="button"
            (click)="toggleFormulaPalette()"
            class="px-2.5 py-1 text-xs font-semibold rounded-lg border flex items-center gap-1.5 transition-all cursor-pointer shadow-2xs"
            [ngClass]="{
              'bg-indigo-600 text-white border-indigo-600': showFormulaPalette(),
              'bg-white text-indigo-600 border-indigo-200 hover:bg-indigo-50': !showFormulaPalette()
            }"
          >
            <mat-icon class="!text-sm leading-none">functions</mat-icon>
            <span>{{ showFormulaPalette() ? 'Close Symbol Palette' : 'Insert Formula &amp; Chemistry' }}</span>
          </button>
        </div>
      </div>

      <!-- Expandable LaTeX & Chemistry Palette -->
      @if (showFormulaPalette()) {
        <div class="mb-3">
          <nag-formula-symbol-palette
            (symbolSelected)="insertSymbolIntoContent($event)"
          ></nag-formula-symbol-palette>
        </div>
      }

      <textarea
        id="authoring-content-input"
        [ngModel]="content()"
        (ngModelChange)="contentChange.emit($event)"
        rows="6"
        placeholder="e.g. Find the roots of the quadratic equation: $$ax^2 + bx + c = 0$$ or reaction $$\ce{2H2 + O2 -> 2H2O}$$"
        class="w-full font-mono text-sm p-3 bg-slate-50 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        [ngClass]="{
          'border-rose-400 ring-rose-200': contentInvalid(),
          'border-slate-300': !contentInvalid()
        }"
      ></textarea>
      @if (contentInvalid()) {
        <p class="text-[11px] text-rose-600 mt-1 flex items-center gap-1 font-medium">
          <mat-icon class="!text-xs leading-none">error_outline</mat-icon>
          Problem statement cannot be empty.
        </p>
      }
    </div>

    <!-- Options Section Sub-component -->
    <nag-standalone-options-editor
      [options]="options()"
      [type]="type()"
      (optionsChange)="optionsChange.emit($event)"
    ></nag-standalone-options-editor>

    <!-- Explanation / Solution -->
    <div class="pt-3 border-t">
      <div class="flex items-center justify-between mb-1.5">
        <label for="authoring-explanation-input" class="block text-xs font-semibold text-slate-700 uppercase">
          Detailed Explanation / Solution
        </label>
        <button
          type="button"
          (click)="toggleExplanationPalette()"
          class="px-2 py-0.5 text-xs font-medium text-indigo-600 hover:text-indigo-800 flex items-center gap-1"
        >
          <mat-icon class="!text-xs leading-none">functions</mat-icon>
          <span>{{ showExplanationPalette() ? 'Hide Palette' : 'Symbols' }}</span>
        </button>
      </div>

      @if (showExplanationPalette()) {
        <div class="mb-3">
          <nag-formula-symbol-palette
            (symbolSelected)="insertSymbolIntoExplanation($event)"
          ></nag-formula-symbol-palette>
        </div>
      }

      <textarea
        id="authoring-explanation-input"
        [ngModel]="explanation()"
        (ngModelChange)="explanationChange.emit($event)"
        rows="3"
        placeholder="Step-by-step mathematical reasoning or theorem reference..."
        class="w-full font-mono text-sm p-3 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
      ></textarea>
    </div>
  </div>

  <!-- Live Preview Column Sub-component -->
  <nag-standalone-live-preview
    [difficulty]="difficulty()"
    [marks]="marks()"
    [negativeMarks]="negativeMarks()"
    [type]="type()"
    [content]="content()"
    [options]="options()"
    [explanation]="explanation()"
  ></nag-standalone-live-preview>
</div>
