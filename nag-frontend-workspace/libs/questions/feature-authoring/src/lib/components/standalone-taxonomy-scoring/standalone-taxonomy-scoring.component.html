<div class="space-y-4">
  <!-- Cognitive Level & Difficulty -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label for="authoring-cognitive-select" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
        Cognitive Level (Bloom's)
      </label>
      <select
        id="authoring-cognitive-select"
        [ngModel]="cognitiveLevel()"
        (ngModelChange)="cognitiveLevelChange.emit($event)"
        class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
      >
        @for (cog of cognitiveLevels; track cog.value) {
          <option [value]="cog.value">{{ cog.label }}</option>
        }
      </select>
    </div>

    <div>
      <label for="authoring-difficulty-select" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
        Difficulty Level
      </label>
      <select
        id="authoring-difficulty-select"
        [ngModel]="difficulty()"
        (ngModelChange)="difficultyChange.emit($event)"
        class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
      >
        <option value="EASY">Easy</option>
        <option value="MEDIUM">Medium</option>
        <option value="HARD">Hard</option>
        <option value="EXPERT">Expert</option>
      </select>
    </div>
  </div>

  <!-- Question Type & Scoring -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div>
      <label for="authoring-type-select" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
        Question Type *
      </label>
      <select
        id="authoring-type-select"
        [ngModel]="type()"
        (ngModelChange)="typeChange.emit($event)"
        class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
      >
        <option value="MULTIPLE_CHOICE">Single Correct (MCQ)</option>
        <option value="MULTIPLE_SELECT">Multi Correct (MSQ)</option>
        <option value="NUMERICAL">Numerical Response</option>
        <option value="TEXT">Subjective / Text</option>
      </select>
    </div>

    <div>
      <label for="authoring-marks-input" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
        Marks (+ve) *
      </label>
      <input
        id="authoring-marks-input"
        type="number"
        [ngModel]="marks()"
        (ngModelChange)="marksChange.emit($event)"
        min="1"
        class="w-full px-3 py-2 text-sm bg-white border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        [ngClass]="{
          'border-rose-400 ring-rose-200': marksInvalid(),
          'border-slate-300': !marksInvalid()
        }"
      />
      @if (marksInvalid()) {
        <p class="text-[11px] text-rose-600 mt-1 flex items-center gap-1 font-medium">
          <mat-icon class="!text-xs leading-none">error_outline</mat-icon>
          Marks must be greater than 0
        </p>
      }
    </div>

    <div>
      <label for="authoring-negmarks-input" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
        Negative Marks (-ve)
      </label>
      <input
        id="authoring-negmarks-input"
        type="number"
        [ngModel]="negativeMarks()"
        (ngModelChange)="negativeMarksChange.emit($event)"
        min="0"
        step="0.25"
        class="w-full px-3 py-2 text-sm bg-white border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        [ngClass]="{
          'border-rose-400 ring-rose-200': negMarksInvalid(),
          'border-slate-300': !negMarksInvalid()
        }"
      />
      @if (negMarksInvalid()) {
        <p class="text-[11px] text-rose-600 mt-1 flex items-center gap-1 font-medium">
          <mat-icon class="!text-xs leading-none">error_outline</mat-icon>
          {{ (negativeMarks() || 0) < 0 ? 'Negative marks cannot be negative' : 'Cannot exceed positive marks' }}
        </p>
      }
    </div>
  </div>
</div>
