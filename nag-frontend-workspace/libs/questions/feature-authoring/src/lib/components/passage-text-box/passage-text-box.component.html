<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
  <h2 class="text-base font-bold text-slate-900 border-b pb-2 flex items-center gap-2">
    <mat-icon class="text-indigo-600">article</mat-icon>
    Passage / Case Study Text
  </h2>

  <div>
    <label for="passage-title-input" class="block text-xs font-semibold text-slate-700 uppercase mb-1">
      Passage Title / Topic Heading (Optional)
    </label>
    <input
      id="passage-title-input"
      type="text"
      [ngModel]="passageTitle()"
      (ngModelChange)="passageTitleChange.emit($event)"
      placeholder="e.g. Quantum Mechanics in Semiconductor Devices"
      class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
    />
  </div>

  <div>
    <div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">
      <label for="passage-content-input" class="block text-xs font-semibold text-slate-700 uppercase">
        Passage Content (Markdown + LaTeX) *
      </label>
      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="toggleFormulaPalette()"
          class="px-2.5 py-1 text-xs font-semibold rounded-lg border flex items-center gap-1.5 transition-all cursor-pointer shadow-2xs"
          [ngClass]="{
            'bg-indigo-600 text-white border-indigo-600': showFormulaPalette(),
            'bg-white text-indigo-600 border-indigo-200 hover:bg-indigo-50': !showFormulaPalette()
          }"
        >
          <mat-icon class="!text-sm leading-none">functions</mat-icon>
          <span>{{ showFormulaPalette() ? 'Close Symbol Palette' : 'Insert Formula &amp; Chemistry' }}</span>
        </button>
      </div>
    </div>

    <!-- Expandable Symbol Palette -->
    @if (showFormulaPalette()) {
      <div class="mb-3">
        <nag-formula-symbol-palette
          (symbolSelected)="insertSymbol($event)"
        ></nag-formula-symbol-palette>
      </div>
    }

    <textarea
      id="passage-content-input"
      [ngModel]="passageContent()"
      (ngModelChange)="passageContentChange.emit($event)"
      rows="8"
      placeholder="Enter the comprehensive reading passage, case study, data narrative, or mathematical derivation..."
      class="w-full font-mono text-sm p-3 bg-slate-50 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
      [ngClass]="{
        'border-rose-400 ring-rose-200': contentInvalid(),
        'border-slate-300': !contentInvalid()
      }"
    ></textarea>
    @if (contentInvalid()) {
      <p class="text-[11px] text-rose-600 mt-1 flex items-center gap-1 font-medium">
        <mat-icon class="!text-xs leading-none">error_outline</mat-icon>
        Passage content cannot be empty.
      </p>
    }
  </div>
</div>
