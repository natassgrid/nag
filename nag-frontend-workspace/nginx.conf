server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS resolver with a short TTL so nginx
    # re-resolves the upstream address after container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Angular SPA - all client routes fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI Generate endpoint - extended timeout for LLM inference
    location /api/v1/questions/generate {
        set $upstream http://api-gateway:9000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Proxy API requests to backend monolith / api-gateway
    location /api/ {
        set $upstream http://api-gateway:9000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Cache static assets
    location ~* \.(?:css|js|woff2?|svg|ttf|eot|ico|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
