
    <div class="page-layout">
      <app-page-header
        title="Question Bank"
        subtitle="Create, review, and manage examination questions."
        icon="quiz"
      >
        <button mat-stroked-button class="action-btn btn-export" [disabled]="exporting" (click)="exportQuestions('json')"
                matTooltip="Export matching questions as JSON (batched ZIP)">
          <mat-icon class="btn-icon">download</mat-icon>
          Export JSON
        </button>
        <button mat-stroked-button class="action-btn btn-export" [disabled]="exporting" (click)="exportQuestions('csv')"
                matTooltip="Export matching questions as CSV (batched ZIP)">
          <mat-icon class="btn-icon">download</mat-icon>
          Export CSV
        </button>
        <button mat-stroked-button class="action-btn btn-import" [disabled]="importing" (click)="importInput.click()"
                matTooltip="Import questions from a ZIP of JSON/CSV batch files">
          <mat-icon class="btn-icon">upload</mat-icon>
          Import
        </button>
        <input #importInput type="file" accept=".zip,application/zip" hidden
               (change)="onImportFileSelected($event)" />
        <button mat-flat-button class="action-btn btn-ai" (click)="openAiGenerateDrawer()">
          <mat-icon class="btn-icon">auto_awesome</mat-icon>
          AI Generate
        </button>
        <button mat-flat-button color="primary" class="action-btn btn-create" (click)="openCreateDrawer()">
          <mat-icon class="btn-icon">add</mat-icon>
          Create Question
        </button>
      </app-page-header>

      <!-- Reusable Paginated Table with Filter Drawer -->
      <app-paginated-table
        #paginatedTable
        [fetcher]="fetcher"
        [columns]="columns"
        [filters]="filters"
        [filterCategories]="filterCategories"
        (filterChange)="onFilterChange($event)"
        [actionsTemplate]="actionsTmpl"
        title="Questions List"
        searchPlaceholder="Search questions..."
      ></app-paginated-table>

      <!-- Custom Actions Column Template -->
      <ng-template #actionsTmpl let-row>
        <button mat-icon-button matTooltip="Edit" (click)="openEditDrawer(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          matTooltip="Submit for Review"
          (click)="submitForReview(row)"
          *ngIf="row.state === 'DRAFT'"
        >
          <mat-icon>send</mat-icon>
        </button>
      </ng-template>

      <!-- ── RIGHT COLLAPSIBLE DRAWER FORM ── -->
      <app-question-form-dialog
        [isOpen]="drawerOpen"
        [question]="editingQuestion"
        (close)="onDrawerClose($event)"
      ></app-question-form-dialog>

      <!-- ── AI GENERATION DRAWER ── -->
      <app-ai-generate-dialog
        [isOpen]="aiDrawerOpen"
        (close)="onAiDrawerClose($event)"
      ></app-ai-generate-dialog>
    </div>
