      <!-- ── RIGHT COLLAPSIBLE GENERATE PAPER DRAWER ── -->
      <app-paper-generate-dialog
        [isOpen]="generateDrawerOpen"
        [examId]="activeFilters['examId'] || undefined"
        (paperGenerated)="onPaperGenerated($event)"
        (close)="onGenerateDrawerClose()"
      ></app-paper-generate-dialog>

      <!-- ── RIGHT COLLAPSIBLE PAPER SUMMARY DRAWER ── -->
      <app-paper-summary-drawer
        [isOpen]="summaryDrawerOpen"
        [paperId]="selectedPaperId"
        (close)="onSummaryDrawerClose()"
        (approved)="onPaperApprovedFromDrawer($event)"
      ></app-paper-summary-drawer>
