<div class="page-layout" aria-label="Dashboard">
  <app-page-header
    [title]="'Welcome, ' + username"
    subtitle="What would you like to do today?"
    icon="home"
  ></app-page-header>

  <div class="card-grid" role="list">
    @for (card of cards; track card.title) {
      <mat-card class="dashboard-card" role="listitem" appearance="outlined">
        <mat-card-header>
          <mat-icon mat-card-avatar class="card-icon" [attr.aria-hidden]="true">{{ card.icon }}</mat-icon>
          <mat-card-title>{{ card.title }}</mat-card-title>
          <mat-card-subtitle>{{ card.description }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-actions align="end">
          <button
            mat-flat-button
            color="primary"
            (click)="navigateTo(card.route)"
            [attr.aria-label]="'Go to ' + card.title">
            Go
            <mat-icon iconPositionEnd>arrow_forward</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</div>
