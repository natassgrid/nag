    <div class="paginated-table-wrapper">

      <!-- Table Header & Search Toolbar -->
      <div class="toolbar" *ngIf="title || enableSearch || enableFilter">
        <div class="toolbar-title" *ngIf="title">
          <h3>{{ title }}</h3>
        </div>

        <div class="toolbar-actions">
          <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic" *ngIf="enableSearch">
            <mat-icon matPrefix class="search-icon">search</mat-icon>
            <input
              matInput
              [placeholder]="searchPlaceholder"
              [(ngModel)]="searchQuery"
              (ngModelChange)="onSearchChange($event)"
              [attr.aria-label]="searchPlaceholder"
            />
            <button
              *ngIf="searchQuery"
              mat-icon-button
              matSuffix
              (click)="clearSearch()"
              aria-label="Clear search"
            >
              <mat-icon class="clear-icon">close</mat-icon>
            </button>
          </mat-form-field>

          <button
            mat-stroked-button
            class="filter-toggle-btn"
            [class.active-filter]="activeFilterCount > 0 || drawerOpen"
            (click)="toggleDrawer()"
            *ngIf="enableFilter"
            matTooltip="Toggle Filters"
            aria-label="Toggle Filters"
          >
            <mat-icon>filter_list</mat-icon>
            <span>Filters</span>
            <span class="filter-badge" *ngIf="activeFilterCount > 0">{{ activeFilterCount }}</span>
          </button>

          <button
            mat-icon-button
            matTooltip="Refresh"
            (click)="reload()"
            [disabled]="loading"
            aria-label="Refresh table data"
          >
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </div>

      <!-- Main Layout with Table Container and Filter Drawer -->
      <div class="table-content-layout">

        <!-- Table Container -->
        <div class="table-container" [class.loading-state]="loading">

          <div class="spinner-overlay" *ngIf="loading">
            <mat-spinner diameter="40"></mat-spinner>
          </div>

          <table
            mat-table
            [dataSource]="dataSource"
            matSort
            (matSortChange)="onSortChange($event)"
            class="custom-paginated-table"
          >
            <!-- Generic Column Generation -->
            <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
              
              <!-- Header Cell -->
              <th
                mat-header-cell
                *matHeaderCellDef
                [mat-sort-header]="col.sortable ? col.key : ''"
                [disabled]="!col.sortable"
              >
                {{ col.header }}
              </th>

              <!-- Data Cell -->
              <td
                mat-cell
                *matCellDef="let row"
                [class.clickable-row]="col.type !== 'actions'"
                (click)="col.type !== 'actions' && onRowClick(row)"
              >
                <!-- Actions Column -->
                <ng-container *ngIf="col.type === 'actions'">
                  <ng-container
                    *ngIf="actionsTemplate"
                    [ngTemplateOutlet]="actionsTemplate"
                    [ngTemplateOutletContext]="{ $implicit: row }"
                  ></ng-container>
                </ng-container>

                <!-- Status/Chip Column -->
                <ng-container *ngIf="col.type === 'chip'">
                  <span
                    class="status-chip"
                    [ngClass]="col.chipClass ? col.chipClass(getCellValue(row, col)) : ''"
                  >
                    {{ getCellValue(row, col) }}
                  </span>
                </ng-container>

                <!-- Default/Text Column -->
                <ng-container *ngIf="col.type !== 'actions' && col.type !== 'chip'">
                  {{ getCellValue(row, col) }}
                </ng-container>
              </td>
            </ng-container>

            <!-- Table Row Definitions -->
            <tr mat-header-row *matHeaderRowDef="displayedColumnKeys"></tr>
            <tr
              mat-row
              *matRowDef="let row; columns: displayedColumnKeys"
              class="table-data-row"
            ></tr>

            <!-- No Data Row -->
            <tr class="mat-row empty-row" *matNoDataRow>
              <td class="mat-cell empty-cell" [attr.colspan]="displayedColumnKeys.length">
                <div class="empty-state">
                  <mat-icon>inbox</mat-icon>
                  <p>No records found</p>
                </div>
              </td>
            </tr>
          </table>
        </div>

        <!-- Right Side Filter Drawer -->
        <div class="filter-drawer" [class.drawer-open]="drawerOpen" *ngIf="enableFilter">
          <div class="drawer-header">
            <h4>Filters</h4>
            <button mat-icon-button (click)="closeDrawer()" aria-label="Close filters">
              <mat-icon>close</mat-icon>
            </button>
          </div>

          <div class="drawer-content">
            <mat-accordion multi>
              <mat-expansion-panel
                *ngFor="let cat of filterCategories"
                [expanded]="cat.expanded"
              >
                <mat-expansion-panel-header>
                  <mat-panel-title>
                    {{ cat.label }}
                    <span
                      class="category-badge"
                      *ngIf="selectedFilters[cat.key]?.length"
                    >
                      ({{ selectedFilters[cat.key].length }})
                    </span>
                  </mat-panel-title>
                </mat-expansion-panel-header>

                <div class="filter-options-list">
                  <mat-checkbox
                    *ngFor="let opt of cat.options"
                    [checked]="isOptionSelected(cat.key, opt.value)"
                    (change)="onOptionToggle(cat.key, opt.value)"
                    color="primary"
                  >
                    {{ opt.label }}
                  </mat-checkbox>
                </div>
              </mat-expansion-panel>
            </mat-accordion>
          </div>

          <div class="drawer-footer">
            <button mat-button (click)="clearAllFilters()" [disabled]="activeFilterCount === 0">
              Clear All
            </button>
            <button mat-flat-button color="primary" (click)="closeDrawer()">
              Done
            </button>
          </div>
        </div>

      </div>

      <!-- Pagination Footer -->
      <mat-paginator
        [length]="totalElements"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        [pageIndex]="pageIndex"
        (page)="onPageChange($event)"
        showFirstLastButtons
        aria-label="Select table page"
      ></mat-paginator>

    </div>
