# SPDX-License-Identifier: AGPL-3.0-only
# Central dependency version catalog for the Examination Platform

[versions]
# ── Platforms & BOMs ──────────────────────────────────────────────────────────
spring-boot = "4.1.0"
spring-cloud = "2025.1.2"
spring-ai = "1.1.7"

# ── Plugins ───────────────────────────────────────────────────────────────────
lombok-plugin = "9.5.0"
spring-dependency-management = "1.1.7"

# ── Libraries with explicit versions (not managed by Boot BOM) ────────────────
jqwik = "1.8.5"
java-uuid-generator = "5.1.0"
resilience4j = "2.4.0"
pdfbox = "3.0.1"
tika = "2.9.2"
httpclient5 = "5.4.1"
httpcore5 = "5.3.1"
opensearch = "2.10.0"
testcontainers = "1.20.4"

# ────────────────────────────────────────────────────────────────────────────────

[libraries]
# ── Spring Boot starters (version managed by Boot BOM) ────────────────────────
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-data-redis-reactive = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }

# ── Spring Framework (version managed by Boot BOM) ────────────────────────────
spring-context = { module = "org.springframework:spring-context" }
spring-web = { module = "org.springframework:spring-web" }
spring-data-jpa = { module = "org.springframework.data:spring-data-jpa" }

# ── Spring Security (version managed by Boot BOM) ─────────────────────────────
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# ── Spring Session ────────────────────────────────────────────────────────────
spring-session-data-redis = { module = "org.springframework.session:spring-session-data-redis" }

# ── Spring Kafka (version managed by Boot BOM) ────────────────────────────────
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# ── Spring Cloud (version managed by Cloud BOM) ───────────────────────────────
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }
spring-cloud-starter-vault-config = { module = "org.springframework.cloud:spring-cloud-starter-vault-config" }
spring-vault-core = { module = "org.springframework.vault:spring-vault-core" }

# ── Database ──────────────────────────────────────────────────────────────────
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }

# ── Jackson ────────────────────────────────────────────────────────────────────
# Spring Boot 4.1 manages both Jackson 2 (com.fasterxml) and Jackson 3 (tools.jackson).
# Using com.fasterxml coordinates for backward compatibility with existing source code.
# Migrate source imports to tools.jackson.* when ready for full Jackson 3 adoption.
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }

# ── Jakarta (version managed by Boot BOM) ─────────────────────────────────────
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }

# ── Hibernate (version managed by Boot BOM) ───────────────────────────────────
hibernate-core = { module = "org.hibernate.orm:hibernate-core" }

# ── Observability (version managed by Boot BOM) ───────────────────────────────
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# ── Resilience ────────────────────────────────────────────────────────────────
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }

# ── UUID generation ───────────────────────────────────────────────────────────
java-uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "java-uuid-generator" }

# ── PDF ───────────────────────────────────────────────────────────────────────
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }

# ── Apache Tika ───────────────────────────────────────────────────────────────
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
tika-parsers-standard = { module = "org.apache.tika:tika-parsers-standard-package", version.ref = "tika" }

# ── Apache HttpClient 5 ──────────────────────────────────────────────────────
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
httpcore5-h2 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version.ref = "httpcore5" }

# ── OpenSearch ────────────────────────────────────────────────────────────────
opensearch-java = { module = "org.opensearch.client:opensearch-java", version.ref = "opensearch" }
opensearch-rest-client = { module = "org.opensearch.client:opensearch-rest-client", version.ref = "opensearch" }

# ── Reactor (version managed by Boot BOM) ─────────────────────────────────────
reactor-test = { module = "io.projectreactor:reactor-test" }

# ── Testing ───────────────────────────────────────────────────────────────────
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

# ────────────────────────────────────────────────────────────────────────────────

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok-plugin" }
