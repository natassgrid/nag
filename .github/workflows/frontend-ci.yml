name: Frontend Monorepo CI (Nx)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-frontend:
    name: Lint, Test & Build Frontend Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'nag-frontend-workspace/package-lock.json'

      - name: Install dependencies
        working-directory: nag-frontend-workspace
        run: npm ci --legacy-peer-deps

      - name: Derive base and head for Nx affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Enforce Module Boundaries & ESLint
        working-directory: nag-frontend-workspace
        run: npx nx run-many -t lint

      - name: Build All Applications & Libraries
        working-directory: nag-frontend-workspace
        run: npx nx run-many -t build

  semgrep-frontend:
    name: SAST – Semgrep (TypeScript / Angular)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.97.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep on frontend workspace
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/owasp-top-ten \
            --config p/secrets \
            --severity ERROR \
            --error \
            --sarif --output semgrep-frontend.sarif \
            nag-frontend-workspace/

      - name: Upload Semgrep SARIF to GitHub code scanning
        if: always() && hashFiles('semgrep-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-frontend.sarif
          category: semgrep-frontend
