name: Secrets Scan (Gitleaks)

on:
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan the full git history'
        type: boolean
        default: false
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

env:
  GITLEAKS_VERSION: '8.21.2'

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version

      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          FULL_HISTORY: ${{ inputs.full_history }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOG_OPTS=""
          if [ "$EVENT" = "pull_request" ]; then
            LOG_OPTS="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="${PUSH_BEFORE}..${SHA}"
          elif [ "$FULL_HISTORY" != "true" ]; then
            LOG_OPTS="-1"
          fi
          echo "Scanning log range: '${LOG_OPTS:-full history}'"
          ./gitleaks git . \
            --config .gitleaks.toml \
            --redact --verbose \
            --report-format sarif --report-path gitleaks.sarif \
            --exit-code 1 \
            ${LOG_OPTS:+--log-opts="$LOG_OPTS"}

      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
