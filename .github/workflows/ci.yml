name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Compile and assemble all modules (no tests)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build (skip tests)
        run: ./gradlew build -x test --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: '**/build/libs/*.jar'
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit & Integration tests (JUnit 5 + jqwik + Testcontainers)
  # ─────────────────────────────────────────────────────────────────────────────
  unit-test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run test suite
        run: ./gradlew test --no-daemon

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload JaCoCo coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/**'
          retention-days: 2

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: SAST — SpotBugs + Semgrep (block on HIGH severity)
  # ─────────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST (SpotBugs + Semgrep)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Compile (required for SpotBugs bytecode analysis)
        run: ./gradlew compileJava --no-daemon

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain --no-daemon
        continue-on-error: true

      - name: Upload SpotBugs HTML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-reports
          path: '**/build/reports/spotbugs/*.html'
          retention-days: 2

      - name: Run Semgrep (Java rules)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: OWASP Dependency-Check
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'exam-platform'
          path: '.'
          format: 'HTML,JSON,SARIF'
          args: >
            --failOnCVSS 7
            --enableRetired
            --disableAssembly
        env:
          JAVA_HOME: ''
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: 'reports/'
          retention-days: 2

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: DAST — OWASP ZAP baseline scan
  # ─────────────────────────────────────────────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    if: vars.STAGING_URL != ''
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
          rules_file_name: '.github/zap/rules.tsv'
          cmd_options: '-a'
          fail_action: true
          artifact_name: zap-baseline-report

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
          retention-days: 2

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: Container build + Trivy image scan
  # ─────────────────────────────────────────────────────────────────────────────
  container-build:
    name: Container Build & Scan
    runs-on: ubuntu-latest
    needs: [unit-test, sast, dependency-check]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - candidate-service
          - question-bank-service
          - translation-service
          - examination-service
          - paper-generator
          - delivery-service
          - response-service
          - evaluation-service
          - result-service
          - audit-service
          - notification-service
          - admin-service
          - analytics-service
          - asset-service
          - monolith-app
          - api-gateway
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Builder Base Image
        run: |
          docker build -f backend/Dockerfile.base -t exam/builder-base:latest .

      - name: Build JAR for ${{ matrix.service }}
        run: ./gradlew :backend:${{ matrix.service }}:bootJar --no-daemon
        continue-on-error: true

      - name: Build Docker image for ${{ matrix.service }}
        id: docker-build
        run: |
          docker build \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            --tag examplatform/${{ matrix.service }}:${{ github.sha }} \
            --tag examplatform/${{ matrix.service }}:latest \
            -f backend/Dockerfile .

      - name: Run Trivy image scan for ${{ matrix.service }}
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'examplatform/${{ matrix.service }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 7: Deploy to staging (only on develop push)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: container-build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install examplatform infrastructure/helm/examplatform \
            --namespace staging \
            --create-namespace \
            --set global.tag=${{ github.sha }} \
            --values infrastructure/helm/examplatform/values-staging.yaml \
            --wait \
            --timeout 10m
