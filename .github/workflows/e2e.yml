# E2E Integration Test Workflow — Issue #171
# Runs full-stack E2E tests against a Docker Compose environment.

name: E2E Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_frontend_e2e:
        description: 'Run Playwright frontend E2E tests'
        required: false
        default: 'false'
        type: boolean

jobs:
  e2e-backend:
    name: Backend E2E (REST Assured)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build monolith Docker image
        run: |
          docker build --no-cache \
            --build-arg SERVICE_NAME=monolith-app \
            -f backend/Dockerfile \
            -t localhost:5000/exam/monolith-app:latest \
            .

      - name: Start E2E Docker stack
        run: |
          docker compose \
            -f infrastructure/docker-compose/docker-compose.yml \
            -f infrastructure/docker-compose/docker-compose.monolith.yml \
            -f infrastructure/docker-compose/docker-compose.e2e.yml \
            up -d --wait
        env:
          POSTGRES_USER: exam_admin
          POSTGRES_PASSWORD: exam_secret
          POSTGRES_DB: exam_platform
          REDIS_PASSWORD: redis_secret

      - name: Wait for stack health
        run: |
          echo "Waiting for monolith to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/actuator/health > /dev/null 2>&1; then
              echo "Monolith is healthy after $((i * 5))s"
              break
            fi
            echo "Attempt $i/30 — waiting 5s..."
            sleep 5
          done

      - name: Seed E2E data
        run: |
          docker exec exam-postgres psql \
            -U exam_admin \
            -d exam_platform \
            -f /docker-entrypoint-initdb.d/e2e-seed-data.sql || true

      - name: Run backend E2E tests
        run: ./gradlew :e2e-tests:test -PrunE2E --info
        continue-on-error: true

      - name: Upload backend E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-report
          path: e2e-tests/build/reports/tests/
          if-no-files-found: warn

      - name: Upload backend E2E XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-xml
          path: e2e-tests/build/test-results/
          if-no-files-found: warn

      - name: Docker Compose logs on failure
        if: failure()
        run: |
          docker compose \
            -f infrastructure/docker-compose/docker-compose.yml \
            -f infrastructure/docker-compose/docker-compose.monolith.yml \
            -f infrastructure/docker-compose/docker-compose.e2e.yml \
            logs --tail=200

      - name: Tear down Docker stack
        if: always()
        run: |
          docker compose \
            -f infrastructure/docker-compose/docker-compose.yml \
            -f infrastructure/docker-compose/docker-compose.monolith.yml \
            -f infrastructure/docker-compose/docker-compose.e2e.yml \
            down -v

  e2e-frontend:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e-backend
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_frontend_e2e == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: nag-frontend-workspace/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: nag-frontend-workspace

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: nag-frontend-workspace

      - name: Build Angular apps
        run: npx nx run-many -t build --skip-nx-cache
        working-directory: nag-frontend-workspace

      - name: Run Playwright E2E tests
        run: npx playwright test --config=e2e/playwright.config.ts
        working-directory: nag-frontend-workspace
        env:
          ADMIN_PORTAL_URL: http://localhost:4200
          CANDIDATE_PORTAL_URL: http://localhost:4300
          VERIFIER_PORTAL_URL: http://localhost:4400
          API_BASE_URL: http://localhost:9000
          KEYCLOAK_URL: http://localhost:8081
        continue-on-error: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nag-frontend-workspace/e2e-report/
          if-no-files-found: warn

      - name: Upload Playwright JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-xml
          path: nag-frontend-workspace/e2e-results.xml
          if-no-files-found: warn
